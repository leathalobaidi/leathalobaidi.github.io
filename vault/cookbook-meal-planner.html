  <title>Cookbook Meal Planner — Vault</title>

  <style>
    :root {
      --ink: #222621;
      --muted: #687067;
      --line: #d8ddd4;
      --paper: #fbfaf6;
      --panel: #ffffff;
      --accent: #1f6b57;
      --accent-2: #b7432f;
      --gold: #d99b2b;
      --wash: #eef4ef;
      --shadow: 0 14px 34px rgba(31, 48, 39, .10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    header {
      min-height: 104px;
      padding: 20px clamp(16px, 3vw, 36px) 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, #f9f6ed 0%, #eef4ef 58%, #fff7ed 100%);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 4.8vw, 58px);
      line-height: .95;
      letter-spacing: 0;
    }
    .public-note { margin: 10px 0 0; color: var(--muted); max-width: 680px; font-size: 14px; }
    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .stat {
      min-width: 116px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.75);
      border-radius: 8px;
    }
    .stat b { display: block; font-size: 22px; }
    .stat span { color: var(--muted); font-size: 12px; }
    main {
      display: grid;
      grid-template-columns: minmax(290px, 360px) minmax(0, 1fr);
      min-height: calc(100vh - 104px);
    }
    aside {
      border-right: 1px solid var(--line);
      padding: 14px;
      background: #fffdf8;
      overflow: auto;
      max-height: calc(100vh - 104px);
    }
    .controls {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }
    input, select, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--line);
      min-height: 40px;
    }
    input, select {
      width: 100%;
      padding: 8px 10px;
      background: white;
      color: var(--ink);
    }
    button {
      cursor: pointer;
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      padding: 8px 12px;
      font-weight: 700;
    }
    button.secondary {
      background: white;
      color: var(--accent);
    }
    button.warn {
      background: var(--accent-2);
      border-color: var(--accent-2);
    }
    .recipe-list {
      display: grid;
      gap: 8px;
    }
    .recipe-card {
      padding: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 8px;
      box-shadow: 0 3px 12px rgba(31,48,39,.04);
      text-align: left;
    }
    .recipe-card.active { border-color: var(--accent); box-shadow: var(--shadow); }
    .recipe-card h2 {
      margin: 0 0 5px;
      font-size: 15px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .recipe-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .workspace {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto minmax(320px, 1fr);
      gap: 0;
    }
    .planner-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: white;
      flex-wrap: wrap;
    }
    .planner-bar input { width: 180px; }
    .detail {
      padding: 18px clamp(16px, 3vw, 30px);
      border-bottom: 1px solid var(--line);
      background: #fff;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(220px, .75fr);
      gap: 22px;
    }
    .detail h2 {
      font-size: clamp(22px, 3vw, 34px);
      margin: 0 0 6px;
      line-height: 1.05;
      letter-spacing: 0;
    }
    .eyebrow { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .chip {
      border: 1px solid var(--line);
      background: var(--wash);
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 12px;
    }
    .detail ul, .detail ol {
      margin: 8px 0 0;
      padding-left: 20px;
      line-height: 1.45;
    }
    .detail li { margin-bottom: 4px; }
    .columns {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 380px);
      min-height: 0;
    }
    .week {
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(7, minmax(132px, 1fr));
      gap: 10px;
      overflow: auto;
      align-content: start;
    }
    .day {
      min-height: 320px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .day h3 {
      margin: 0;
      padding: 9px 10px;
      font-size: 13px;
      background: var(--wash);
      border-bottom: 1px solid var(--line);
      letter-spacing: 0;
    }
    .slot {
      min-height: 88px;
      padding: 8px;
      border-bottom: 1px solid var(--line);
    }
    .slot:last-child { border-bottom: 0; }
    .slot-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .planned {
      display: grid;
      gap: 6px;
    }
    .pill {
      border-left: 3px solid var(--gold);
      background: #fff8e9;
      padding: 6px 7px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.25;
      display: grid;
      gap: 5px;
    }
    .pill button {
      min-height: 24px;
      padding: 2px 6px;
      font-size: 11px;
      justify-self: start;
    }
    .shopping {
      border-left: 1px solid var(--line);
      padding: 14px;
      background: #fffdf8;
      overflow: auto;
      max-height: calc(100vh - 420px);
    }
    .shopping h2 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: 0;
    }
    .shopping-list {
      display: grid;
      gap: 8px;
    }
    .shop-item {
      padding: 8px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .shop-item b { display: block; }
    .shop-item span { color: var(--muted); font-size: 12px; }
    .empty {
      color: var(--muted);
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.55);
    }
    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; align-items: start; }
      .public-note { margin: 10px 0 0; color: var(--muted); max-width: 680px; font-size: 14px; }
    .stats { justify-content: start; }
      main { grid-template-columns: 1fr; }
      aside { max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
      .recipe-list { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
      .detail { grid-template-columns: 1fr; }
      .columns { grid-template-columns: 1fr; }
      .shopping { border-left: 0; border-top: 1px solid var(--line); max-height: none; }
      .week { grid-template-columns: repeat(7, minmax(140px, 1fr)); }
    }

  <header>
    <div>
      <h1>Cookbook Meal Planner</h1>
      <p class="public-note">Planning index for the clean EPUB cookbook library. Cooking directions stay local.</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="recipeCount">0</b><span>recipes</span></div>
      <div class="stat"><b id="bookCount">0</b><span>books</span></div>
      <div class="stat"><b id="plannedCount">0</b><span>planned meals</span></div>
    </div>
  </header>
  <main>
    <aside>
      <div class="controls">
        <input id="search" type="search" placeholder="Search recipes or ingredients">
        <select id="qualityFilter">
          <option value="clean">Clean EPUB recipes</option>
        </select>
        <select id="bookFilter"></select>
        <select id="ingredientFilter"></select>
      </div>
      <div id="recipeList" class="recipe-list"></div>
    </aside>
    <section class="workspace">
      <div class="planner-bar">
        <input id="weekStart" type="date">
        <select id="mealSlot">
          <option>Dinner</option>
          <option>Lunch</option>
          <option>Breakfast</option>
        </select>
        <button id="addSelected">Add Selected</button>
        <button id="randomFill" class="secondary">Fill Week</button>
        <button id="clearPlan" class="warn">Clear</button>
      </div>
      <article id="detail" class="detail"></article>
      <div class="columns">
        <div id="week" class="week"></div>
        <aside class="shopping">
          <h2>Shopping Overlap</h2>
          <div id="shoppingList" class="shopping-list"></div>
        </aside>
      </div>
    </section>
  </main>

ed wine or balsamic vinegar", 1], ["popped rice", 1], ["tamarind chutney", 1], ["brown rice", 1], ["cherries", 1], ["heaped pine nuts", 1], ["radicchio or 2 red chicory", 1], ["heaped pickled jalapeño chilli", 1], ["mug frozen sweetcorn", 1], ["go-to houmous", 1], ["mug wholemeal self-raising flour", 1], ["big coriander", 1], ["heaped rogan josh curry paste", 1], ["litres vegetable oil", 1], ["naan bread", 1], ["each chilli flakes", 1], ["a savoy cabbage", 1], ["or frozen broad beans", 1], ["a loaf rustic bread", 1], ["level black treacle", 1], ["× 400g beans", 1], ["× 450g roasted pepper in brine", 1], ["or frozen peas or broad beans", 1], ["peas", 1], ["wholemeal penne", 1], ["delicate green veg", 1], ["tamari", 1], ["× 250g sachet cooked basmati rice", 1], ["herbs", 1], ["podded broad beans", 1], ["seeds", 1], ["sprouts", 1], ["figs", 1], ["korma curry paste", 1], ["level baking powder", 1], ["jasmine rice", 1], ["green or yellow chilli", 1], ["wholemeal tortilla", 1], ["blood or regular oranges", 1], ["buckwheat flour", 1], ["rhubarb", 1], ["frozen blueberries", 1], ["rolled jumbo oats", 1], ["unsalted nuts and seeds", 1], ["unsweetened shredded", 1], ["black rice or balsamic vinegar", 1], ["szechuan pepper", 1], ["quality kimchi", 1], ["an eating apple", 1], ["flour tortilla", 1], ["a loaf seeded bread", 1], ["pickled onion", 1], ["makes 1 | 15 minutes", 1], ["mineral water", 1], ["× 250g roasted pepper in brine", 1], ["mint and coriander", 1], ["rice paper wrappers", 1], ["beetroot", 1]]}</script>
  <script>
    const data = JSON.parse(document.getElementById('cookbook-data').textContent);
    const recipes = data.recipes;
    const byId = new Map(recipes.map(recipe => [recipe.id, recipe]));
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const slots = ['Breakfast', 'Lunch', 'Dinner'];
    let selectedId = recipes[0]?.id || null;
    let plan = JSON.parse(localStorage.getItem('cookbook.plan.v1') || '{}');

    const els = {
      recipeCount: document.getElementById('recipeCount'),
      bookCount: document.getElementById('bookCount'),
      plannedCount: document.getElementById('plannedCount'),
      search: document.getElementById('search'),
      qualityFilter: document.getElementById('qualityFilter'),
      bookFilter: document.getElementById('bookFilter'),
      ingredientFilter: document.getElementById('ingredientFilter'),
      recipeList: document.getElementById('recipeList'),
      detail: document.getElementById('detail'),
      week: document.getElementById('week'),
      shoppingList: document.getElementById('shoppingList'),
      mealSlot: document.getElementById('mealSlot'),
      addSelected: document.getElementById('addSelected'),
      randomFill: document.getElementById('randomFill'),
      clearPlan: document.getElementById('clearPlan'),
      weekStart: document.getElementById('weekStart')
    };

    function mondayISO(date = new Date()) {
      const d = new Date(date);
      const day = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - day);
      return d.toISOString().slice(0, 10);
    }

    els.weekStart.value = localStorage.getItem('cookbook.weekStart.v1') || mondayISO();
    els.recipeCount.textContent = recipes.length.toLocaleString();
    els.bookCount.textContent = new Set(recipes.map(r => r.book)).size.toLocaleString();

    function optionList(select, values, first) {
      select.innerHTML = '';
      select.append(new Option(first, ''));
      values.forEach(value => select.append(new Option(value, value)));
    }

    optionList(els.bookFilter, [...new Set(recipes.map(r => r.book))].sort(), 'All books');
    optionList(els.ingredientFilter, data.topIngredients.slice(0, 120).map(x => x[0]), 'Any ingredient');

    function filteredRecipes() {
      const q = els.search.value.trim().toLowerCase();
      const quality = els.qualityFilter.value;
      const book = els.bookFilter.value;
      const ing = els.ingredientFilter.value;
      return recipes.filter(recipe => {
        if (quality === 'clean' && recipe.quality !== 'clean') return false;
        if (quality === 'ocr' && recipe.quality !== 'ocr') return false;
        if (book && recipe.book !== book) return false;
        if (ing && !recipe.ingredient_keys.includes(ing)) return false;
        if (q && !recipe.search_text.includes(q)) return false;
        return true;
      });
    }

    function renderRecipeList() {
      const list = filteredRecipes();
      els.recipeList.innerHTML = '';
      if (!list.length) {
        els.recipeList.innerHTML = '<div class="empty">No matching recipes.</div>';
        return;
      }
      list.slice(0, 320).forEach(recipe => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'recipe-card' + (recipe.id === selectedId ? ' active' : '');
        card.innerHTML = `<h2>${escapeHTML(recipe.title)}</h2><p>${escapeHTML(recipe.book)}${recipe.time ? ' · ' + escapeHTML(recipe.time) : ''}</p>`;
        card.addEventListener('click', () => {
          selectedId = recipe.id;
          render();
        });
        els.recipeList.append(card);
      });
    }

    function escapeHTML(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function renderDetail() {
      const recipe = byId.get(selectedId);
      if (!recipe) {
        els.detail.innerHTML = '<div class="empty">Choose a recipe.</div>';
        return;
      }
      const chips = recipe.ingredient_keys.slice(0, 12).map(x => `<span class="chip">${escapeHTML(x)}</span>`).join('');
      const ingredients = recipe.ingredients.map(x => `<li>${escapeHTML(x)}</li>`).join('');
      const method = recipe.method.slice(0, 5).map(x => `<li>${escapeHTML(x)}</li>`).join('');
      els.detail.innerHTML = `
        <div>
          <div class="eyebrow">${escapeHTML(recipe.book)} · ${escapeHTML(recipe.source_location)}${recipe.meta ? ' · ' + escapeHTML(recipe.meta) : ''}</div>
          <h2>${escapeHTML(recipe.title)}</h2>
          ${recipe.subtitle ? `<p><b>${escapeHTML(recipe.subtitle)}</b></p>` : ''}
          ${recipe.description ? `<p>${escapeHTML(recipe.description)}</p>` : ''}
          <div class="chips">${chips}</div>
        </div>
        <div>
          <b>Ingredients</b>
          <ul>${ingredients}</ul>
          <b>Method</b>
          <ol>${method}</ol>
        </div>`;
    }

    function planKey(day, slot) {
      return `${els.weekStart.value}|${day}|${slot}`;
    }

    function savePlan() {
      localStorage.setItem('cookbook.plan.v1', JSON.stringify(plan));
      localStorage.setItem('cookbook.weekStart.v1', els.weekStart.value);
    }

    function addToPlan(day = days[new Date().getDay() === 0 ? 6 : new Date().getDay() - 1], slot = els.mealSlot.value) {
      if (!selectedId) return;
      const key = planKey(day, slot);
      plan[key] = plan[key] || [];
      if (!plan[key].includes(selectedId)) plan[key].push(selectedId);
      savePlan();
      render();
    }

    function renderWeek() {
      els.week.innerHTML = '';
      let planned = 0;
      days.forEach(day => {
        const dayEl = document.createElement('section');
        dayEl.className = 'day';
        dayEl.innerHTML = `<h3>${day}</h3>`;
        slots.forEach(slot => {
          const key = planKey(day, slot);
          const ids = plan[key] || [];
          planned += ids.length;
          const slotEl = document.createElement('div');
          slotEl.className = 'slot';
          slotEl.innerHTML = `<span class="slot-label">${slot}</span><div class="planned"></div>`;
          const plannedEl = slotEl.querySelector('.planned');
          ids.forEach(id => {
            const recipe = byId.get(id);
            if (!recipe) return;
            const pill = document.createElement('div');
            pill.className = 'pill';
            pill.innerHTML = `<span>${escapeHTML(recipe.title)}</span><button class="secondary">Remove</button>`;
            pill.querySelector('button').addEventListener('click', () => {
              plan[key] = (plan[key] || []).filter(x => x !== id);
              savePlan();
              render();
            });
            pill.addEventListener('click', event => {
              if (event.target.tagName !== 'BUTTON') {
                selectedId = id;
                render();
              }
            });
            plannedEl.append(pill);
          });
          slotEl.addEventListener('dblclick', () => addToPlan(day, slot));
          dayEl.append(slotEl);
        });
        els.week.append(dayEl);
      });
      els.plannedCount.textContent = planned.toLocaleString();
    }

    function renderShopping() {
      const counts = new Map();
      Object.entries(plan)
        .filter(([key]) => key.startsWith(els.weekStart.value + '|'))
        .flatMap(([, ids]) => ids)
        .map(id => byId.get(id))
        .filter(Boolean)
        .forEach(recipe => recipe.ingredient_keys.forEach(ing => counts.set(ing, (counts.get(ing) || 0) + 1)));
      const items = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      els.shoppingList.innerHTML = '';
      if (!items.length) {
        els.shoppingList.innerHTML = '<div class="empty">Plan meals to build the overlap list.</div>';
        return;
      }
      items.forEach(([ing, count]) => {
        const item = document.createElement('div');
        item.className = 'shop-item';
        item.innerHTML = `<b>${escapeHTML(ing)}</b><span>${count} planned recipe${count === 1 ? '' : 's'}</span>`;
        els.shoppingList.append(item);
      });
    }

    function fillWeek() {
      const pool = filteredRecipes();
      if (!pool.length) return;
      days.forEach((day, idx) => {
        const recipe = pool[idx % pool.length];
        const key = planKey(day, els.mealSlot.value);
        plan[key] = [recipe.id];
      });
      savePlan();
      render();
    }

    function render() {
      renderRecipeList();
      renderDetail();
      renderWeek();
      renderShopping();
    }

    els.search.addEventListener('input', renderRecipeList);
    els.qualityFilter.addEventListener('change', renderRecipeList);
    els.bookFilter.addEventListener('change', renderRecipeList);
    els.ingredientFilter.addEventListener('change', renderRecipeList);
    els.weekStart.addEventListener('change', () => { savePlan(); render(); });
    els.addSelected.addEventListener('click', () => addToPlan());
    els.randomFill.addEventListener('click', fillWeek);
    els.clearPlan.addEventListener('click', () => {
      for (const key of Object.keys(plan)) {
        if (key.startsWith(els.weekStart.value + '|')) delete plan[key];
      }
      savePlan();
      render();
    });

    render();
  </script>
</body>
