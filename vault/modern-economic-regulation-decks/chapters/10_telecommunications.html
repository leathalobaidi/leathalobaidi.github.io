</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="49" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="when-should-fixed-line-regulation-be-withdrawn">When should fixed-line regulation be withdrawn?</h2>
<div class="box">
<p>The historical rationale — the PSTN as a <strong>natural monopoly</strong> — <strong>may no longer hold</strong> where restructuring has taken root. Kahn: &quot;The industry is obviously no longer a natural monopoly... regulation of the historical variety is both unnecessary and likely to be anticompetitive.&quot;</p>
</div>
<ul>
<li><strong>Asymmetry problem.</strong> If the PSTN is heavily regulated but <strong>cable and mobile</strong> (offering similar services) are barely regulated, regulation itself <strong>distorts</strong> competition between platforms.</li>
<li><strong>Inter-platform competition</strong> — cable vs PSTN vs mobile — is the real constraint; where it's effective, historic regulation may do more harm than good.</li>
<li><strong>Proposed answer:</strong> make ex ante regulation <strong>more granular</strong> — narrow <strong>geographic markets</strong>, regulate <strong>only</strong> where competition is absent (a single supplier); lean more on <strong>ex post competition law</strong> elsewhere.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="50" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="access--unbundling-for-ngns">Access &amp; unbundling for NGNs</h2>
<div class="box">
<p>IP interconnection is seen to <strong>remove the access bottleneck</strong> of switched networks — so does unbundling still make sense for all-IP fibre (FTTx)?</p>
</div>
<ul>
<li><strong>Engineering snag.</strong> In switched networks, physical points (exchanges, distribution frames, cabinets) are natural <strong>interconnection points</strong>. In all-IP FTTx many of these become <strong>obsolete</strong> — harder, technically and economically, to unbundle the loop.</li>
<li><strong>USA:</strong> <strong>forbearance</strong> from mandatory unbundling for fibre → encourage investment.</li>
<li><strong>Europe:</strong> keeps <strong>unbundling</strong> (duct, sub-loop, bitstream access) and the <strong>ladder of investment</strong> — &quot;a more sophisticated ladder&quot; for NGA.</li>
<li>Open question: as networks converge on IP, should interconnection move from <strong>cost-based</strong> charges toward <strong>peering/transit</strong>? Regulators (EC, FCC) are leaning that way.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" class="part" data-marpit-pagination="51" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>

<h4 id="part-8">Part 8</h4>
<h1 id="evidence--assessment">Evidence &amp; assessment</h1>
<h4>What did restructuring actually achieve?</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="52" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="the-central-difficulty--disentangling-regulation-from-technology">The central difficulty — disentangling regulation from technology</h2>
<div class="box">
<p>It is <strong>very hard to separate</strong> the effects of <strong>restructuring policy</strong> from the effects of <strong>rapid technological change</strong>. Services proliferated over three decades — but were they <strong>helped or hindered</strong> by specific regulatory actions? Often we genuinely can't say. Crew &amp; Kleindorfer: regulation's role may have been to <strong>&quot;follow and perhaps slow down&quot;</strong> the impact of technology.</p>
</div>
<div class="small">This caveat colours <b>every</b> empirical claim that follows — treat causal attributions cautiously.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="53" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="what-the-evidence-suggests">What the evidence suggests</h2>
<div class="cols">
<div class="card">
<p><strong>Positive</strong></p>
<ul>
<li><strong>Price caps</strong> → network modernisation, higher productivity, lower prices for some services (Sappington &amp; Weisman).</li>
<li><strong>Tariff rebalancing</strong> → big falls in long-distance/international charges.</li>
<li><strong>OECD verdict:</strong> market-opening a <strong>&quot;success&quot;</strong> — prices fell, new services, penetration up; broadband prices fell &amp; speeds rose 2000–2010.</li>
</ul>
</div>
<div class="card">
<p><strong>Sceptical</strong></p>
<ul>
<li>Some argue US regulators/courts/legislators <strong>impeded</strong> competition and innovation (Hausman &amp; Taylor): price regulation <strong>discouraged facilities-based</strong> competition, delayed innovations, <strong>&quot;cost consumers billions&quot;</strong>.</li>
<li>Forced element-sharing at regulated rates <strong>reduced investment</strong> by incumbents and entrants alike (Sidak).</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="54" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="evidence-on-unbundling--the-real-driver">Evidence on unbundling &amp; the real driver</h2>
<ul>
<li><strong>USA:</strong> below-cost element prices → CLEC <strong>gold-rush then collapse</strong>; most don't credit unbundling for the later rise of facilities-based competition.</li>
<li><strong>Europe:</strong> evidence is <strong>equivocal</strong>. ERG (2005) and EC (2007) claimed entrants were <strong>climbing the ladder</strong>; but other studies find <strong>no support</strong> for the ladder, and that <strong>strong-unbundling countries had lower incumbent and entrant investment</strong>.</li>
<li><strong>Cambini &amp; Jiang survey:</strong> forward-looking cost pricing (TELRIC/TSLRIC) <strong>tended to discourage investment</strong> by incumbents and entrants alike.</li>
</ul>
<div class="key"><b>The headline finding.</b> Using OECD data, <b>inter-platform competition</b> (cable vs DSL vs mobile) was the <b>main driver of broadband penetration</b>; <b>intra-platform</b> competition (rivals sharing one network via unbundling) had a much <b>smaller</b> effect — casting doubt on whether mandatory unbundling was justified.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="55" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="three-technologies-that-drove-it-all-deckers-conclusion">Three technologies that drove it all (Decker's conclusion)</h2>
<div class="cols3">
<div class="card"><b>1 · Computing / digitisation</b><br />Ever-cheaper processing (<b>Moore's Law</b>) enabled digitisation and electronic switching.</div>
<div class="card"><b>2 · Fibre replaces copper</b><br />Higher-capacity transmission, pushed ever closer to the customer's premises.</div>
<div class="card"><b>3 · Circuit → packet / IP</b><br />The PSTN transformed into a digital, packet-based, IP network.</div>
</div>
<div class="key">A standardised <b>IP suite</b> lets <b>any service</b> (voice/video/data) run over <b>any infrastructure</b> (copper, fibre, mobile). The industry went from many <b>vertical, single-service</b> networks to <b>horizontal, multi-service</b> networks. Services are <b>no longer tied to a platform</b> — though quality and price still differ by delivery route.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="56" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="chapter-summary">Chapter summary</h2>
<ul>
<li>Telecoms is distinctive: <strong>two-way</strong> connection between named users, powerful <strong>network externalities</strong>, breakneck <strong>technological change</strong>, and <strong>convergence</strong> of services onto shared IP infrastructure.</li>
<li>Architecture shifted from the <strong>circuit-switched PSTN</strong> (star topology, local loop, dedicated paths) to <strong>packet-switched IP NGNs</strong> built for data, with voice as one more stream.</li>
<li>The <strong>1984 AT&amp;T break-up (MFJ)</strong> and <strong>1996 Act</strong> anchor US reform; regulation moved through <strong>four stages</strong>, embraced <strong>tariff rebalancing</strong> and <strong>price caps</strong>, and set access prices via <strong>TSLRIC/TELRIC/FL-LRIC</strong> and <strong>price–cost tests</strong>.</li>
<li><strong>One-way access:</strong> local-loop <strong>unbundling</strong> and the <strong>ladder of investment</strong> — but evidence suggests low access prices can <strong>deter investment</strong>; <strong>access holidays</strong> (US forbearance) vs the EU's rejection of them.</li>
<li><strong>Two-way access:</strong> <strong>CPNP</strong> creates a <strong>termination monopoly</strong> needing regulation; <strong>bill-and-keep</strong> sidesteps it; the <strong>competitive bottleneck</strong> and <strong>waterbed effect</strong> show cutting wholesale rates may not cut retail prices.</li>
<li><strong>Live issues:</strong> <strong>net neutrality</strong> / paid prioritisation, <strong>broadband in the USO</strong> / the digital divide, <strong>NGA</strong> investment, and <strong>when to withdraw</strong> fixed-line regulation given inter-platform competition — the real driver of broadband growth.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="57" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="self-check-questions">Self-check questions</h2>
<p>Test yourself — answers are in the deck.</p>
<ol>
<li>Why is a telecoms &quot;product&quot; economically different from an electron or a gas molecule — and why does that matter for quality and competition?</li>
<li>Set out <strong>three</strong> architectural differences between the traditional PSTN and an NGN, and explain circuit vs packet switching.</li>
<li>Distinguish <strong>TSLRIC</strong>, <strong>TELRIC</strong> and <strong>FL-LRIC</strong>, and state the two contentious assumptions behind their implementation.</li>
<li>What is the <strong>ladder of investment</strong>? Why might mandatory unbundling at low access prices become a &quot;trap&quot; rather than a ladder?</li>
<li>Explain the <strong>termination monopoly</strong> and contrast <strong>CPNP</strong> with <strong>bill-and-keep</strong>. Where is RPNP used?</li>
<li>What is the <strong>waterbed effect</strong>? What did Genakos &amp; Valletti find, and why does it complicate the case for cutting termination rates?</li>
<li>Summarise the <strong>net-neutrality</strong> debate (traffic management + paid prioritisation) and the argument for <strong>withdrawing</strong> fixed-line regulation where inter-platform competition is effective.</li>
</ol>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="lead" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" class="lead" data-marpit-pagination="58" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:lead;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>

<h1 id="end-of-chapter-10">End of Chapter 10</h1>
<h3 id="next-cost-standards-and-access-pricing-recur-across-the-utilities--telecoms-is-the-sharpest-testing-ground-for-one-way-and-two-way-access-theory">Next: cost standards and access pricing recur across the utilities — telecoms is the sharpest testing ground for one-way and two-way access theory.</h3>
<p><span class="pill">convergence</span><br />
<span class="pill">unbundling</span><br />
<span class="pill">waterbed</span><br />
<span class="pill">net neutrality</span><br />
<span class="pill">inter-platform competition</span></p>

</section>
