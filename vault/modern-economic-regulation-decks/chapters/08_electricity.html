</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="49" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="c--environmental-policy--the-biggest-issue">C · Environmental policy — the biggest issue</h2>
<ul>
<li>Perhaps the <strong>most significant</strong> current policy issue. A possible <strong>&quot;paradigm shift&quot;</strong> in how the industry is regulated.</li>
<li>Electricity is a <strong>major CO₂ source</strong> — ~<strong>38%</strong> of global energy-related CO₂ (2009). Targets: UK <strong>−80%</strong> by 2050 (vs 1990); US (Obama) <strong>−83%</strong> by 2050 (vs 2005).</li>
<li>Core levers: shift the <strong>generation mix</strong> from coal/fossil to <strong>renewables</strong>, and cut consumption via <strong>demand-side management</strong>.</li>
</ul>
<div class="box"><b>It costs consumers.</b> UK estimates of climate/energy policy on real household retail prices: <b>+15%</b> (2011), <b>+27%</b> (2020), <b>+28%</b> (2030). Medium business: <b>+22% / +34% / +45%</b>.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="50" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="c--how-renewables-stress-the-system">C · How renewables stress the system</h2>
<ul>
<li><strong>Intermittency &amp; control:</strong> wind is <strong>variable and uncertain</strong> — big hour-to-hour swings (solar minute-to-minute). Needs conventional <strong>reserves</strong> ready to start fast when wind drops.</li>
<li><strong>More volatile prices,</strong> especially in <strong>balancing markets</strong> — hour-by-hour prices move sharply with wind. When wind is abundant, wind's marginal bid can be <strong>zero or negative</strong>.</li>
<li><strong>More peaking capacity</strong> needed for low-wind periods — but peak plant only invests if it can <strong>price above marginal cost</strong> in tight hours (back to <strong>missing money</strong>).</li>
<li><strong>Remote location:</strong> best wind is often far from load centres ⇒ the <strong>transmission network must be expanded/upgraded</strong>.</li>
</ul>
<div class="small">Example (Green 2008): in W. Denmark, wind was ~26% of consumption in 2007, but in 10% of hours &lt;2.7%, and in another 10% &gt;60% — for 50 hours it exceeded local demand.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="51" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="c--environmental-policy-instruments">C · Environmental policy instruments</h2>
<div class="cols">
<div class="card">
<p><strong>Shift the generation mix</strong><br />
Renewable <strong>targets</strong> &amp; supplier <strong>obligations</strong>; <strong>feed-in tariffs</strong>; <strong>subsidies / tax credits</strong> for renewables; <strong>new nuclear</strong>; <strong>Carbon Capture &amp; Storage (CCS)</strong> demos.</p>
</div>
<div class="card">
<p><strong>Networks &amp; consumption</strong><br />
<strong>Smart grids</strong> (&quot;computerising&quot; the grid); coordinated/fast-tracked <strong>transmission planning</strong> for renewables; <strong>demand-side management</strong> — energy efficiency + demand responsiveness.</p>
</div>
</div>
<div class="def"><b>Feed-in tariff:</b> a guaranteed price paid to renewable generators for the power they supply — a subsidy to shift the mix toward low-carbon sources.</div>
<div class="small">DSM often <b>costs less per kWh</b> than new generation/T&D, and can <b>lower</b> bills rather than raise them — but benefits have often been <b>under-realised</b> (weak ICT, poor integration, needed behaviour change).</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="52" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="c--smart-meters-dsm--dynamic-pricing">C · Smart meters, DSM &amp; dynamic pricing</h2>
<div class="def"><b>Time-of-use pricing:</b> retail prices vary by fixed time bands (peak/off-peak), <b>regardless</b> of real-time conditions. <b>Dynamic pricing:</b> retail prices vary with <b>real-time system conditions</b> (e.g. hourly) — so consumers cut demand exactly when the system is stressed.</div>
<ul>
<li><strong>Smart / dynamic meters</strong> give near-real-time consumption info, &quot;empowering&quot; consumers to shift load and cut emissions.</li>
<li>Dynamic tariff types: <strong>hourly pricing</strong>; <strong>critical-peak pricing (CPP)</strong> (pre-committed high price during rare critical events, offset by cheaper off-peak); <strong>peak-time rebates</strong> (paid for consuming below a baseline at peak).</li>
<li>Cost treatment: in the US, DSM was recovered like supply-side investment; after retail competition, via a <strong>system benefits charge</strong>; some states allow recovery of <strong>lost revenue</strong> (decoupling).</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="53" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<div class="box">
<h3 id="box-83--getting-smart-with-electricity-tariffs-in-california">Box 8.3 · Getting smart with electricity tariffs in California</h3>
<div class="tag">Example</div>
<ul>
<li>Demand varies hugely by time/season, yet short-run network capacity is <strong>fixed</strong> — historically handled by <strong>time-of-use</strong> pricing. Smart meters + smart grids now enable <strong>dynamic</strong> pricing that reflects real-time conditions.</li>
<li>The <strong>CPUC</strong> has led on dynamic tariffs. Since the mid-2000s the three big investor-owned utilities must offer <strong>default (opt-out) critical-peak-pricing</strong> to larger peak-demand customers.</li>
<li>CPUC design principles (2010): default rates carry a <strong>high peak price on 9–15 critical event days/yr</strong> + TOU on non-event days; any opt-out must still be <strong>time-varying</strong> (not flat); CPP should reflect <strong>marginal energy + capacity cost</strong>.</li>
</ul>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="54" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<div class="box">
<h3 id="box-83--california-cont--the-lesson">Box 8.3 · California (cont.) — the lesson</h3>
<div class="tag">Lesson</div>
<ul>
<li>Interest traces to the <strong>2000–01 power crisis</strong>, when customers <strong>couldn't respond</strong> to wholesale price swings.</li>
<li>Trials show residential customers <strong>do respond</strong> to dynamic-price signals by cutting demand — <strong>but</strong> the response depends on <strong>how information is delivered</strong> and, critically, on <strong>opt-in vs opt-out</strong>: <strong>opt-out (default) designs</strong> get far higher participation and demand reduction.</li>
<li>Moving <strong>all</strong> residential customers to default dynamic/TOU rates is still <strong>limited by statute</strong> in California.</li>
<li><strong>Takeaway:</strong> the demand side can help balance the system and cut emissions — but <strong>default design and behavioural framing</strong> determine whether it actually works.</li>
</ul>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="55" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="c--macro-policy--cap-and-trade--ets">C · Macro policy — cap-and-trade / ETS</h2>
<div class="def"><b>Cap and trade:</b> set a total <b>cap</b> on emissions; issue a <b>quota of allowances</b> to emitters; let them <b>trade</b> allowances so cuts happen where they're cheapest. The allowance <b>price is set by the market</b>, not governments.</div>
<ul>
<li><strong>EU ETS</strong> — operational since <strong>Jan 2005</strong>, spans <strong>30 countries</strong>, the world's largest scheme, covering ~<strong>half</strong> of Europe's GHG emissions. Each member sets a national allocation plan; firms trade allowances.</li>
<li>The <strong>USA</strong> has no nationwide GHG scheme, but <strong>pioneered</strong> cap-and-trade for <strong>CFCs</strong> and <strong>SO₂</strong>; regional schemes exist (e.g. <strong>RGGI</strong>).</li>
</ul>
<div class="small">The EU can't set the allowance price directly — only <b>collectively adjust the aggregate cap</b> over time.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="56" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="c--when-climate-policy-meets-economic-regulation">C · When climate policy meets economic regulation</h2>
<ul>
<li>Some fear climate policy could <strong>undo</strong> restructuring's gains — <em>&quot;a potential vehicle for the return of old-style intervention&quot;</em> in generation and retail.</li>
<li>Britain's <strong>wholesale price guarantees</strong> for low-carbon investment (Electricity Market Reform) are cited as a swing back toward <strong>central planning</strong>.</li>
<li><strong>Re-politicisation risk:</strong> independent regulators once had <strong>narrow</strong> objectives (competition, efficient investment) but now carry <strong>environmental/sustainability</strong> duties too — creating <strong>tensions</strong> between goals.</li>
<li>In the US, &quot;traditional&quot; ROR may give way to <strong>performance-based</strong> rates that promote <strong>demand response / renewables</strong>.</li>
</ul>
<div class="key">A possible <b>"new paradigm"</b>: the restructured settlement — vertical separation + competition + independent network regulation — may have to be <b>adapted or replaced</b> to handle climate change.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" class="part" data-marpit-pagination="57" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>

<h4 id="wrap-up">Wrap-up</h4>
<h1 id="summary--self-check">Summary &amp; self-check</h1>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="58" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="chapter-summary-1">Chapter summary (1)</h2>
<ul>
<li><strong>Physics rules economics.</strong> Electricity is <strong>non-storable</strong>, must be <strong>balanced instantaneously across a synchronised network</strong>, and flows follow <strong>physics</strong> (loop flow) — so the stages behave like <em>&quot;one large machine.&quot;</em></li>
<li><strong>Split the industry.</strong> <strong>Wires (transmission &amp; distribution)</strong> are <strong>natural monopoly</strong> ⇒ regulated; <strong>generation &amp; retail</strong> are potentially <strong>competitive</strong> ⇒ opened up, but still overseen.</li>
<li><strong>Supply chain:</strong> generation → transmission → distribution → retail, with <strong>system operation</strong> (often an independent, not-for-profit <strong>ISO</strong>) holding it in balance.</li>
<li><strong>Trading arrangements</strong> evolved from <strong>gross pools</strong> (mandatory) to <strong>net pools / bilateral trading</strong> + <strong>exchanges</strong>, plus <strong>balancing markets</strong>, <strong>FTRs</strong> and <strong>capacity markets</strong>.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="59" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="chapter-summary-2">Chapter summary (2)</h2>
<ul>
<li><strong>Network regulation:</strong> <strong>price caps</strong> with <strong>building-block/RAB</strong> revenue and <strong>incentive schemes</strong> (capex menus, opex benchmarking, quality) dominate in the UK/EU/Australia; <strong>rate of return</strong> dominates in North America, increasingly with <strong>performance-based</strong> add-ons.</li>
<li><strong>Competition is fragile:</strong> constraints, non-storability, concentration and inelastic demand let even <strong>small generators</strong> exploit market power; <strong>retail competition</strong> can be blunted by tariff complexity and mispriced defaults — Britain <strong>re-regulated</strong> tariffs after 2011.</li>
<li><strong>Investment is the hard problem:</strong> the <strong>&quot;missing money&quot;</strong> gap (fixed by <strong>capacity markets/payments</strong>), decentralised <strong>transmission</strong> planning, <strong>nodal (LMP) vs zonal</strong> pricing, and <strong>deep vs shallow</strong> connection charges.</li>
<li><strong>Climate policy</strong> (renewables, feed-in tariffs, <strong>ETS/cap-and-trade</strong>, smart grids, <strong>DSM</strong>, dynamic pricing) is now the dominant force — and may push toward a <strong>&quot;new paradigm.&quot;</strong> Evidence on restructuring overall is <strong>genuinely mixed</strong>.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="60" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="self-check-1">Self-check (1)</h2>
<ol>
<li>Why does <strong>non-storability</strong> force real-time balancing, and why can a fault in one place threaten the <strong>whole</strong> network?</li>
<li>Explain <strong>loop flow</strong> and <strong>line losses</strong>, and why they make transmission pricing hard.</li>
<li>How can a generator with a <strong>small market share</strong> still exercise market power? (Use &quot;pocket,&quot; constraint, inelastic demand.)</li>
<li>Draw the distinction between a <strong>gross pool</strong> and a <strong>net/voluntary pool</strong>, with one example of each.</li>
</ol>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="61" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="self-check-2">Self-check (2)</h2>
<ol start="5">
<li>Contrast the <strong>building-block price cap</strong> with <strong>rate-of-return</strong> regulation. In which regions does each dominate, and what incentive add-ons has each acquired?</li>
<li>State the <strong>&quot;missing money&quot;</strong> problem precisely and explain how a <strong>capacity market</strong> addresses it.</li>
<li>Compare <strong>nodal (LMP)</strong> and <strong>zonal</strong> transmission pricing, and <strong>deep</strong> vs <strong>shallow</strong> connection charging — and why <strong>LMP + deep charges</strong> is argued to give the best siting signals.</li>
</ol>
<div class="key"><b>Stretch:</b> Using Boxes 8.1–8.3, argue whether benchmarking (NL), transmission pricing choices, and default (opt-out) dynamic tariffs (CA) show regulation converging on "best practice" — or diverging under local politics.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
