<header>Ch 5 · Forms of price regulation</header>

<h1 id="forms-of-price-regulation">Forms of price regulation</h1>
<h2 id="chapter-5">Chapter 5</h2>
<p><span class="small">Modern Economic Regulation · Christopher Decker (CUP 2015)</span></p>
<p><em>How regulators actually constrain the prices of monopoly network firms — from US rate-of-return to British RPI−X and the hybrids in between.</em></p>
<p><span class="pill">Rate of return</span> <span class="pill">Price cap</span> <span class="pill">Building blocks</span> <span class="pill">Yardstick</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="2" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="why-this-chapter-exists">Why this chapter exists</h2>
<div class="key">
Chapter 4 derived <strong>optimal prices</strong> assuming the regulator knows costs and demand, can use subsidies, and can commit. In the real world <em>none</em> of those hold. Chapter 5 asks: given imperfect information and weak commitment, what practical <strong>pricing rules</strong> do regulators use?
</div>
<p>The three assumptions that break down:</p>
<ul>
<li><strong>Full information</strong> — regulator does <em>not</em> know the firm's true costs, demand, or effort.</li>
<li><strong>Free instruments</strong> — subsidies and multi-part tariffs are often unavailable.</li>
<li><strong>Commitment</strong> — regulators struggle to bind their future selves across periods.</li>
</ul>
<p><span class="small">Each form of price regulation is a different way of coping with these gaps.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="3" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="learning-objectives">Learning objectives</h2>
<p>By the end you should be able to:</p>
<ul>
<li>Explain <strong>rate-of-return (ROR)</strong> regulation: the rate case, rate base, allowed return, revenue requirement, and why it is <em>low-powered</em>.</li>
<li>State the <strong>Averch–Johnson effect</strong> and why ROR is <em>asymmetric</em>.</li>
<li>Explain <strong>RPI−X / price caps</strong>, what X represents, duration, baskets, and cap forms.</li>
<li>Set a cap with the <strong>building-block</strong> method (RAB, opex, depreciation; FCM vs OCM).</li>
<li>Compare ROR and price cap — and explain why in practice they <strong>converge</strong>.</li>
<li>Describe <strong>hybrids</strong>: earnings sharing, menus, yardstick competition/benchmarking.</li>
<li>Apply price regulation where <strong>competition is emerging</strong>.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="4" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="key-terms-at-a-glance">Key terms at a glance</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Revenue requirement</strong> — total revenue the firm is allowed to recover.</li>
<li><strong>Rate base / RAB</strong> — value of capital on which a return is earned.</li>
<li><strong>Allowed return</strong> — the permitted cost of capital.</li>
<li><strong>Low-/high-powered</strong> — how much cost risk the firm bears.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Regulatory lag</strong> — gap between price reviews.</li>
<li><strong>X-factor</strong> — the efficiency offset in RPI−X.</li>
<li><strong>FCM / OCM</strong> — two ways to value the RAB.</li>
<li><strong>Yardstick</strong> — benchmark a firm against its peers.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="5" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="the-spectrum-of-price-regulation">The spectrum of price regulation</h2>
<div class="key">
Every scheme sits somewhere between two poles defined by <strong>incentive power</strong> — the fraction of its own cost changes the firm bears.
</div>

<header>Ch 5 · Forms of price regulation</header>

<h4 id="part-1">Part 1</h4>
<h1 id="rate-of-return-regulation">Rate of return regulation</h1>
<h4 id="the-us-cost-plus-tradition">The US &quot;cost-plus&quot; tradition</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="7" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="rate-of-return-the-core-idea">Rate of return: the core idea</h2>
<div class="def">
<strong>Rate of return (ROR) regulation</strong> — also "cost of service" regulation. The firm is allowed to recover <em>all</em> prudent costs of supplying regulated services, <em>plus</em> a fair return on its invested capital, so that economic profit is zero.
</div>
<p>The revenue formula (one representation):</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>R</mi><mo>=</mo><mtext>Opex</mtext><mo>+</mo><mi>s</mi><mo>⋅</mo><mo stretchy="false">(</mo><mtext>Rate Base</mtext><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">R = \text{Opex} + s \cdot (\text{Rate Base})
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8778em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">Opex</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.4445em;"></span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord text"><span class="mord">Rate Base</span></span><span class="mclose">)</span></span></span></span></span></p><ul>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi></mrow><annotation encoding="application/x-tex">R</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span></span></span></span> — total revenue the firm may recover</li>
<li><strong>Opex</strong> — operating expenses (incl. depreciation and taxes)</li>
<li><strong>Rate Base</strong> — invested capital = capital stock <em>less</em> accumulated depreciation</li>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>s</mi></mrow><annotation encoding="application/x-tex">s</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">s</span></span></span></span> — the allowed or &quot;fair&quot; rate of return</li>
</ul>
<p><span class="small">Prices need only make total revenue = total allowable cost. They need <em>not</em> be efficient.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="8" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="what-ror-does-and-does-not-require">What ROR does and does not require</h2>
<div class="cols">
<div class="card">
<p><strong>It requires</strong></p>
<ul>
<li>Total revenue = total allowable cost</li>
<li>A fair return on prudent, &quot;used and useful&quot; assets</li>
<li>Zero economic profit overall</li>
</ul>
</div>
<div class="card">
<p><strong>It does <em>not</em> require</strong></p>
<ul>
<li>Efficient (Ramsey / peak-load) price structures</li>
<li>The firm to choose least-cost input mixes</li>
<li>Prices to move instantly with costs</li>
</ul>
</div>
</div>
<div class="key">
Motivation: <strong>balance investors and consumers</strong> — let the utility recover its costs, but stop it exploiting monopoly power to earn excess profit.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="9" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="us-legal-foundations-brief">US legal foundations (brief)</h2>
<div class="def">
In the USA, rate-setting runs through <strong>rate hearings</strong> under the Administrative Procedures Act 1946, shaped by a century of Supreme Court doctrine.
</div>
<table>
<thead>
<tr>
<th>Case</th>
<th>Year</th>
<th>What it established</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Smyth v. Ames</strong></td>
<td>1898</td>
<td>Firm entitled to a &quot;fair return&quot; on property used for the public</td>
</tr>
<tr>
<td><strong>Bluefield</strong></td>
<td>1923</td>
<td>Return should match those on comparable-risk ventures; enough to keep credit sound</td>
</tr>
<tr>
<td><strong>FPC v. Hope</strong></td>
<td>1944</td>
<td>The <strong>&quot;end result&quot; test</strong> — a fair return is one commensurate with returns on comparable-risk investments, sufficient to maintain credit and attract capital</td>
</tr>
</tbody>
</table>
<p><span class="small">Constitutional &quot;takings&quot; protection requires that any allowed return be <em>fair</em>.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="10" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="the-rate-case-process">The rate case process</h2>
<div class="key">
A <strong>rate case</strong> is the public process by which a commission decides whether a firm's tariffs may change. It usually starts with the firm <em>applying</em> for a rate increase, and proceeds in two stages.
</div>
<div class="cols">
<div class="card">
<p><strong>Stage 1 — Revenue requirement</strong><br />
Determine the firm's allowable costs: opex from a recent <em>test year</em> + a return on the rate base.</p>
</div>
<div class="card">
<p><strong>Stage 2 — Rates / prices</strong><br />
Translate the revenue requirement into a <em>structure</em> of prices across customer classes and services.</p>
</div>
</div>
<p><span class="small">Regulators audit the firm's proposed costs for prudence; interveners (consumer groups) can present evidence.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="11" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="stage-1a--valuing-the-rate-base">Stage 1a — Valuing the rate base</h2>
<div class="def">
The <strong>rate base</strong> is the asset value on which the firm earns its return. In capital-intensive utilities this is the most important — and most contested — number.
</div>
<p>Contested choices:</p>
<ul>
<li><strong>Valuation</strong> — original / historic cost (most common) vs replacement or reproduction value.</li>
<li><strong>Depreciation method</strong> — straight-line, sinking-fund, accelerated — changes the timing of cost recovery.</li>
<li><strong>Inclusion</strong> — which assets count? The <strong>&quot;used and useful&quot; test</strong> governs recovery (e.g. nuclear plants in excess capacity).</li>
<li><strong>Pre-approval</strong> — some regimes let firms pre-clear big investments to cut regulatory uncertainty.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="12" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="stage-1b--the-allowed-rate-of-return">Stage 1b — The allowed rate of return</h2>
<div class="key">
The allowed return is built on an estimate of the firm's <strong>cost of capital</strong> — the return required on assets of comparable risk.
</div>
<ul>
<li>Estimated with <strong>CAPM</strong>, discounted-cash-flow, earnings–price ratios, and other risk-premium methods.</li>
<li>A bargaining process: the firm argues for a <em>higher</em> return; the regulator argues it is too high vs comparable-risk peers.</li>
<li>The regulator acts as an <strong>arbitrator</strong> — set it not so low the firm can't function, not so high it earns excess.</li>
</ul>
<p><span class="small">Joskow (2007) — even after decades of finance theory, cost-of-capital methods used remain &quot;surprisingly unsophisticated.&quot;</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="13" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="stage-2--setting-the-rates">Stage 2 — Setting the rates</h2>
<div class="key">
With one service, ROR implies <strong>average-cost pricing</strong>. With many services, many price vectors satisfy "revenue = allowable cost" — so structure is a choice.
</div>
<ul>
<li>The regulator groups customers (residential / commercial / industrial) and approves <em>relative</em> prices.</li>
<li>This raises <strong>joint and common cost allocation</strong> — usually done by accounting rules (fully distributed cost), seen by economists as <strong>arbitrary</strong>.</li>
<li>Efficient structures (<strong>Ramsey–Boiteux</strong>, non-linear, peak-load) are <em>possible in theory</em> but rarely applied in US practice.</li>
<li>Tariff design often reflects <strong>political</strong>, not economic, motives (protecting some voters from increases).</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="14" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="rate-case-once-set-prices-stick">Rate case: once set, prices stick</h2>
<div class="def">
A distinctive ROR feature: once prices and any adjustment formulas are set through a rate case, they <strong>remain until the next rate case</strong>. The firm cannot unilaterally re-price to track costs.
</div>
<div class="cols">
<div class="card">
<p><strong>Unlike price caps</strong><br />
No fixed review interval — a hearing can, in theory, be triggered at <em>any</em> time by firm or regulator.</p>
</div>
<div class="card">
<p><strong>Softeners in practice</strong><br />
Some regimes allow automatic <em>pass-through</em> formulas (e.g. fuel costs) between full reviews.</p>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="15" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="ror--advantages">ROR — advantages</h2>
<div class="key">
Prices <strong>track underlying costs</strong>, limiting monopoly pricing; as cost-plus, the firm stays solvent when unavoidable costs rise. In principle: no excessive losses, no excess profits.
</div>
<ul>
<li><strong>Quality</strong> — little incentive to cut quality; may even over-provide (though Laffont–Tirole call this reasoning incomplete).</li>
<li><strong>Investment</strong> — attractive to capital: prudent, &quot;used and useful&quot; costs are effectively guaranteed recovery.</li>
<li><strong>Lower cost of capital</strong> — consumers bear more stranding risk, so investors demand less; &quot;used and useful&quot; <em>reduces</em> regulatory-opportunism risk.</li>
<li><strong>Voice</strong> — public hearings give consumer groups a formal say.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="16" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="ror--disadvantages">ROR — disadvantages</h2>
<div class="key">
The central flaw: as a <strong>cost-plus</strong> scheme, the firm has weak incentives to cut costs — any efficiency gain is quickly passed to consumers as lower prices. Same logic blunts <strong>innovation</strong>.
</div>
<ul>
<li><strong>Low-powered incentives</strong> — firm is not the residual claimant of savings.</li>
<li><strong>Asymmetric risk</strong> — firm seeks a hearing when costs <em>rise</em>, rarely when they <em>fall</em> → risk sits on consumers.</li>
<li><strong>Cost padding</strong> — under information asymmetry the firm may inflate costs (tempered by prudence audits).</li>
<li><strong>High admin cost</strong> — slow, litigious, expert-heavy hearings; regulator must second-guess the firm.</li>
</ul>
<p><span class="small">Caveat: most critiques target <em>pure textbook</em> ROR, not the audited, lagged version used in practice.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="17" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="the-averch%E2%80%93johnson-effect">The Averch–Johnson effect</h2>
<div class="def">
<strong>Averch–Johnson (A–J) effect (1962)</strong> — if the allowed ("fair") return is set <em>above</em> the true cost of capital, the firm over-uses capital relative to labour: it "gold-plates" to inflate the rate base and earn more return.
</div>
<p><strong>Intuition:</strong> every extra dollar in the rate base earns the <em>spread</em> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>s</mi><mo>−</mo><mtext>cost of capital</mtext><mo stretchy="false">)</mo><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">(s - \text{cost of capital}) &gt; 0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">cost of capital</span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span>. So the firm has a bias toward capital — an <strong>inefficient capital/labour ratio</strong>. Output could be produced more cheaply with more labour, less capital.</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>profit incentive to add capital</mtext><mtext>  </mtext><mo>∝</mo><mtext>  </mtext><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi>s</mi><mo>−</mo><msub><mi>r</mi><mtext>true</mtext></msub><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\text{profit incentive to add capital} \;\propto\; \big(s - r_{\text{true}}\big) &gt; 0
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">profit incentive to add capital</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∝</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.2em;vertical-align:-0.35em;"></span><span class="mord"><span class="delimsizing size1">(</span></span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.2em;vertical-align:-0.35em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0278em;">r</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.0278em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">true</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mord"><span class="delimsizing size1">)</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span></span></p><footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="18" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="a%E2%80%93j-earnings-and-behaviour-%F0%9F%93%8A">A–J: earnings and behaviour <img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/></h2>
<p><span class="tag">Behaviour vs the spread (s − true cost of capital)</span></p>
<table>
<thead>
<tr>
<th>Allowed return <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>s</mi></mrow><annotation encoding="application/x-tex">s</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">s</span></span></span></span> vs cost of capital <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>r</mi></mrow><annotation encoding="application/x-tex">r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span></span></th>
<th>Firm's response</th>
<th>Efficiency</th>
</tr>
</thead>
<tbody>
<tr>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>s</mi><mo>&gt;</mo><mi>r</mi></mrow><annotation encoding="application/x-tex">s &gt; r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span></span></td>
<td>Over-capitalise (&quot;gold-plate&quot;); inflate rate base</td>
<td><span class="bad">Inefficient K/L mix</span></td>
</tr>
<tr>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>s</mi><mo>=</mo><mi>r</mi></mrow><annotation encoding="application/x-tex">s = r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span></span></td>
<td>Indifferent among input mixes (zero profit either way)</td>
<td>Neutral</td>
</tr>
<tr>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>s</mi><mo>&lt;</mo><mi>r</mi></mrow><annotation encoding="application/x-tex">s &lt; r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span></span></td>
<td>Loses money → in the long run exits</td>
<td>Firm not viable</td>
</tr>
</tbody>
</table>
<div class="key">
Counter-intuitive twist: as $s$ falls <em>toward</em> $r$, the capital distortion actually <strong>grows</strong> — the smaller the spread is <em>not</em>, the smaller the over-capitalisation (Baumol & Klevorick 1970).
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="19" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="why-ror-is-called-asymmetric">Why ROR is called &quot;asymmetric&quot;</h2>
<div class="cols">
<div class="card">
<p><strong>Two senses of asymmetry</strong></p>
<ol>
<li><strong>Information</strong> — the regulator knows almost nothing; the firm knows its costs.</li>
<li><strong>Risk / behaviour</strong> — firm asks for a hearing when costs rise, not when they fall.</li>
</ol>
</div>
<div class="card">
<p><strong>A–J assumptions (strong!)</strong></p>
<ul>
<li>No regulatory lag</li>
<li>Prices adjust instantly</li>
<li>Static costs &amp; demand</li>
<li>Regulator knows nothing</li>
</ul>
</div>
</div>
<p><span class="small">Empirical tests of A–J have been &quot;not particularly successful&quot; — real regimes have lag and imperfect audits, and firms lack the information to distort so precisely. Its lasting value: showing that <em>regulation itself can create inefficiency</em>.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="20" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="regulatory-lag-under-ror">Regulatory lag under ROR</h2>
<div class="def">
<strong>Regulatory lag</strong> — the gap between the day a cost change occurs and the day prices are re-set. During the lag the firm is the <strong>residual claimant</strong> for any cost savings (or increases).
</div>
<ul>
<li>A US rate case can take 6–12+ months; once filed, a further increase is effectively blocked for ~18–24 months.</li>
<li>The lag creates a <strong>temporary high-powered incentive</strong>: cut costs now, keep the gains until the next review.</li>
<li>Introducing lag into the A–J model <strong>mitigates</strong> the over-capitalisation bias.</li>
<li>This is the same efficiency logic that price caps later <em>institutionalise</em> into a fixed period (link to Ch 4 &amp; Ch 7).</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="21" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="developments-in-ror">Developments in ROR</h2>
<div class="key">
There is no <strong>"pure" ROR</strong> in practice. Real regimes have lag, prudence audits, "used and useful" tests, and can disallow inefficient opex — all of which inject some efficiency incentive.
</div>
<ul>
<li><strong>Negotiated settlements</strong> (North America) — firm and customers agree terms directly, avoiding slow, costly formal hearings; seen as more creative and importing incentive-regulation features.</li>
<li>Despite these, ROR's <em>inherent</em> incentive power is still judged weak — which drove the search for higher-powered schemes since the 1980s.</li>
</ul>
<p><span class="small">Much criticism of &quot;traditional&quot; ROR rests on a poor understanding of how it actually works (Joskow).</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" class="part" data-marpit-pagination="22" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>

<h4 id="part-2">Part 2</h4>
<h1 id="price-cap-regulation">Price cap regulation</h1>
<h4 id="rpi%E2%88%92x-and-the-british-innovation">RPI−X and the British innovation</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="23" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="price-caps-the-core-idea">Price caps: the core idea</h2>
<div class="def">
<strong>Price cap regulation</strong> — the firm's allowed prices are <em>detached from its own costs</em> for a set period. It caps the price (or revenue) <em>path</em>; the firm keeps any savings made within the period.
</div>
<ul>
<li>Shifts <strong>cost-variability risk</strong> from consumers to the firm.</li>
<li>Designed to <strong>mimic a competitive market</strong>: the firm can't influence the &quot;market price,&quot; so the only route to higher profit is to cut costs → <strong>high-powered incentive</strong>.</li>
<li>Now the dominant approach across the UK, Europe, Australia, New Zealand, and US telecoms/electricity.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="24" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="origins-littlechild-1983">Origins: Littlechild 1983</h2>
<div class="key">
The approach traces to <strong>Stephen Littlechild's 1983 report</strong> on regulating British Telecom after privatisation. He argued for regulating <em>prices, not profits</em> — more incentive for efficiency and innovation than ROR.
</div>
<ul>
<li>Littlechild's two charges against ROR: it was &quot;burdensome and costly… reduces the incentive to efficiency,&quot; and it covered the <em>whole</em> firm rather than targeting where monopoly power was greatest.</li>
<li>Intellectual roots: Baumol &amp; Klevorick (1970) on regulatory lag as an efficiency lever; Vogelsang–Finsinger (1979) on nudging a multi-product firm toward efficient prices.</li>
<li><strong>Adopted for BT in 1984</strong>, then gas (1986), airports (1987), water (1989), electricity (1990). US telecoms from 1989.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="25" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="rpi%E2%88%92x-methodology">RPI−X methodology</h2>
<div class="def">
Under <strong>RPI−X</strong>, the firm's average price for a basket of services may rise by no more than economy-wide inflation (RPI) minus an efficiency offset <em>X</em>.
</div>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mi>P</mi><mi>t</mi></msup><mo>=</mo><msup><mi>P</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msup><mo>⋅</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mn>1</mn><mo>+</mo><mtext>RPI</mtext><mo>−</mo><mi>X</mi><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo></mrow><annotation encoding="application/x-tex">P^{t} = P^{t-1}\cdot\big(1 + \text{RPI} - X\big)
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8436em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8436em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8641em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span><span class="mbin mtight">−</span><span class="mord mtight">1</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.2em;vertical-align:-0.35em;"></span><span class="mord"><span class="delimsizing size1">(</span></span><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord text"><span class="mord">RPI</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.2em;vertical-align:-0.35em;"></span><span class="mord mathnormal" style="margin-right:0.0785em;">X</span><span class="mord"><span class="delimsizing size1">)</span></span></span></span></span></span></p><p><strong>Worked example:</strong> last period price <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>=</mo><mi mathvariant="normal">$</mi><mn>10</mn></mrow><annotation encoding="application/x-tex">= \$10</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.3669em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8056em;vertical-align:-0.0556em;"></span><span class="mord">$10</span></span></span></span>; RPI <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>=</mo><mn>4</mn><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">= 4\%</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.3669em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8056em;vertical-align:-0.0556em;"></span><span class="mord">4%</span></span></span></span>; <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>X</mi><mo>=</mo><mn>5</mn><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">X = 5\%</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0785em;">X</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8056em;vertical-align:-0.0556em;"></span><span class="mord">5%</span></span></span></span>.</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>allowed change</mtext><mo>=</mo><mn>4</mn><mi mathvariant="normal">%</mi><mo>−</mo><mn>5</mn><mi mathvariant="normal">%</mi><mo>=</mo><mo>−</mo><mn>1</mn><mi mathvariant="normal">%</mi><mtext>  </mtext><mo>⇒</mo><mtext>  </mtext><msup><mi>P</mi><mi>t</mi></msup><mo>=</mo><mi mathvariant="normal">$</mi><mn>9.90</mn></mrow><annotation encoding="application/x-tex">\text{allowed change} = 4\% - 5\% = -1\% \;\Rightarrow\; P^{t} = \$9.90
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">allowed change</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.0833em;"></span><span class="mord">4%</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8056em;vertical-align:-0.0556em;"></span><span class="mord">5%</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.0833em;"></span><span class="mord">−</span><span class="mord">1%</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">⇒</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8436em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8436em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8056em;vertical-align:-0.0556em;"></span><span class="mord">$9.90</span></span></span></span></span></p><ul>
<li>Prices are indexed to an <strong>exogenous</strong> measure (inflation) minus a regulator-set <strong>X</strong>.</li>
<li>X can be constant across the period, or vary year by year. (CPI replaces RPI in some jurisdictions.)</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="26" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="duration-of-the-cap-and-the-reset">Duration of the cap and the reset</h2>
<div class="key">
The <strong>duration</strong> (usually 3–5 years, sometimes 8+) is what makes the incentive work: during the fixed period the firm <strong>keeps</strong> the gains from beating its cost path.
</div>
<p>The core trade-off:</p>
<table>
<thead>
<tr>
<th>Cap too <strong>short</strong></th>
<th>Cap too <strong>long</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td>Prices stay near costs</td>
<td>Earnings can drift far from costs</td>
</tr>
<tr>
<td>But acts like ROR → weakens incentives</td>
<td>Strong incentive to cut costs</td>
</tr>
</tbody>
</table>
<p><span class="small">Short caps suit high uncertainty or intense political pressure. Detaching prices from costs <em>institutionalises the regulatory lag</em> for a fixed period.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="27" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="the-reset-and-the-ratchet-effect">The reset and the ratchet effect</h2>
<div class="def">
<strong>Ratchet effect</strong> — if this period's cost-cutting is "rewarded" with tougher targets next period, the firm has a reason <em>not</em> to reveal savings late in a period.
</div>
<p>At reset the regulator re-bases prices to costs and removes excess profit — but must keep incentives constant across periods.</p>
<div class="cols">
<div class="card">
<p><strong>P₀ adjustment</strong><br />
One-off re-basing at the <em>start</em> of the next period → consumers benefit fast, but firm may slack near period-end.</p>
</div>
<div class="card">
<p><strong>Glide path</strong><br />
Gradual price adjustment over the next period → firm keeps a <em>decreasing</em> share of gains, sustaining effort.</p>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="28" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="baskets-and-pricing-flexibility">Baskets and pricing flexibility</h2>
<div class="def">
A <strong>tariff basket</strong> is a group of services to which one RPI−X constraint applies. Within a basket the firm can rebalance individual prices, provided the weighted-average constraint holds.
</div>
<ul>
<li><strong>More baskets → less flexibility.</strong> Separate business and residential baskets stop the firm offsetting a residential rise with a business cut.</li>
<li>Splitting into sub-caps guards against a <strong>margin/price squeeze</strong> (vertically integrated firms) or breaches of distributional aims.</li>
<li>But disaggregating re-introduces the familiar <strong>joint-and-common-cost allocation</strong> problem.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="29" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="what-does-x-represent">What does &quot;X&quot; represent?</h2>
<div class="key">
There is no single agreed meaning of <strong>X</strong> — and the interpretation drives how it is estimated.
</div>
<div class="cols">
<div class="card">
<p><strong>Narrow: productivity</strong><br />
X = expected productivity growth of the firm <em>above</em> the wider economy. Estimate from historic TFP + input costs, add a &quot;<strong>stretch factor</strong>.&quot; (Common in US applications.)</p>
</div>
<div class="card">
<p><strong>Broad: discretionary</strong><br />
X reflects many factors — past efficiency, investment needs, expected earnings — and is one variable in a &quot;<strong>political and commercial bargaining process</strong>&quot; (Beesley &amp; Littlechild).</p>
</div>
</div>
<p><span class="small">Third use: set X so allowed revenue just covers forecast efficient costs — the <em>building-block</em> approach.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="30" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="forms-of-price-cap-1--revenue-based">Forms of price cap (1) — revenue-based</h2>
<div class="cols">
<div class="card">
<p><strong>Fixed revenue cap</strong><br />
Max allowed revenue <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>R</mi><mo lspace="0em" rspace="0em">∗</mo></msup></mrow><annotation encoding="application/x-tex">R^{*}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6887em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6887em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">∗</span></span></span></span></span></span></span></span></span></span></span></span> set for the period, <em>independent of volume</em>. Firm bears <strong>no volume risk</strong>.<br />
<span class="small good">Suits fixed costs + stable demand.</span><br />
<span class="small bad">No incentive to grow demand; may even <em>degrade</em> quality to cut cost.</span></p>
</div>
<div class="card">
<p><strong>Average-revenue (yield) cap</strong><br />
Cap on average revenue per unit (= total requirement ÷ forecast demand), growing at RPI−X.<br />
<span class="small good">Firm responds to demand.</span><br />
<span class="small bad">Volume risk on firm; applies symmetrically regardless of service cost; can distort supply.</span></p>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="31" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="forms-of-price-cap-2--hybrid--weighted">Forms of price cap (2) — hybrid &amp; weighted</h2>
<div class="cols">
<div class="card">
<p><strong>Hybrid cap</strong><br />
Revenue = fixed + variable driven by <em>several</em> parameters (output, connections, peak demand, performance):</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mi>R</mi><mo lspace="0em" rspace="0em">∗</mo></msup><mo>=</mo><mi>F</mi><mo>+</mo><mi>α</mi><msub><mi>q</mi><mn>1</mn></msub><mo>+</mo><mi>β</mi><msub><mi>q</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">R^{*} = F + \alpha q_1 + \beta q_2
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7387em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7387em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">∗</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7778em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0037em;">α</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0528em;">β</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span></p><p>Coefficients set so <strong>marginal revenue ≈ marginal cost</strong>.</p>
</div>
<div class="card">
<p><strong>Weighted-average / tariff basket</strong><br />
Caps a weighted-average price for a <em>basket</em>; weights = revenue or output shares. Firm can rebalance within it.<br />
<span class="small good">Links marginal revenue to each service's price → efficient structures (low price on elastic, high on inelastic).</span></p>
</div>
</div>
<p><span class="small">The BT 1984 cap used a weighted-average basket, RPI − 3%.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" class="part" data-marpit-pagination="32" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>

<h4 id="part-3">Part 3</h4>
<h1 id="building-blocks">Building blocks</h1>
<h4 id="setting-the-cap-against-costs">Setting the cap against costs</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="33" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="the-building-block-approach">The building-block approach</h2>
<div class="def">
Though prices are <em>detached</em> from costs in principle, regulators usually set the cap so that revenue covers <strong>efficient costs</strong>. The <strong>building-block</strong> method builds the ex-ante revenue requirement from three components.
</div>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mi>R</mi><mi>t</mi></msup><mo>=</mo><msup><mi>r</mi><mi>t</mi></msup><mo>⋅</mo><msup><mtext>RAB</mtext><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msup><mo>+</mo><msup><mtext>Opex</mtext><mi>t</mi></msup><mo>+</mo><msup><mtext>Dep</mtext><mi>t</mi></msup></mrow><annotation encoding="application/x-tex">R^{t} = r^{t}\cdot \text{RAB}^{t-1} + \text{Opex}^{t} + \text{Dep}^{t}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8436em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8436em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8436em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0278em;">r</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8436em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.9707em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord text"><span class="mord">RAB</span></span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8873em;"><span style="top:-3.1362em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span><span class="mbin mtight">−</span><span class="mord mtight">1</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.0612em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord text"><span class="mord">Opex</span></span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8668em;"><span style="top:-3.1362em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.0612em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord text"><span class="mord">Dep</span></span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8668em;"><span style="top:-3.1362em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span></span></span></span></span></span></span></span></span></span></span></span></span></p><ul>
<li><strong>Return on capital</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>r</mi><mi>t</mi></msup><mo>⋅</mo><msup><mtext>RAB</mtext><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msup></mrow><annotation encoding="application/x-tex">r^{t}\cdot \text{RAB}^{t-1}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7936em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0278em;">r</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7936em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8873em;"></span><span class="mord"><span class="mord text"><span class="mord">RAB</span></span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8873em;"><span style="top:-3.1362em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span><span class="mbin mtight">−</span><span class="mord mtight">1</span></span></span></span></span></span></span></span></span></span></span></span> — allowed cost of capital × opening asset base</li>
<li><strong>Opex</strong> — expected efficient operating expenditure</li>
<li><strong>Depreciation</strong> (the <em>return of</em> capital)</li>
</ul>
<p><span class="small">The regulator then picks X so forecast revenue = efficient cost, and the firm breaks even — unless it <em>beats</em> the cost forecast.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="34" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="building-blocks-look-a-lot-like-ror">Building blocks look a lot like ROR</h2>
<div class="key">
The building-block method shares ROR's contested tasks: estimating efficient costs, valuing the asset base, and choosing the cost of capital. The <strong>key difference</strong>: building blocks are <em>forward-looking</em> and <em>fixed</em> for a set period.
</div>
<p>Elements the regulator must forecast:</p>
<ul>
<li>Services and expected output per service</li>
<li>Efficient opex and efficient new capex</li>
<li>Depreciation charge (asset lives)</li>
<li>Cost of capital applied to the asset value</li>
</ul>
<p><span class="small">Because prices are set on <em>expected</em> costs, the firm profits if it beats the regulator's efficiency estimates.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="35" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="the-regulatory-asset-base-rab--rav">The Regulatory Asset Base (RAB / RAV)</h2>
<div class="def">
The <strong>Regulatory Asset Base (RAB)</strong> — also Regulatory Asset Value (RAV) — is the value of the firm's assets on which the return is earned. It corresponds to the "rate base" of ROR.
</div>
<p>Two capex questions the RAB must answer:</p>
<ul>
<li><strong>Past investment</strong> — how are historic assets valued? (FCM vs OCM — next slide.)</li>
<li><strong>In-period capex</strong> — at reset, roll in the <em>forecast</em> capex or the <em>actual</em> capex?
<ul>
<li>Roll in <strong>forecast</strong> → incentive to <em>exaggerate</em> forecasts, then underspend.</li>
<li>Roll in <strong>actual</strong> → curbs forecast padding, but weakens the drive to deliver capex cheaply.</li>
</ul>
</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="36" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="fcm-vs-ocm">FCM vs OCM</h2>
<div class="cols">
<div class="card">
<p><strong>Financial Capital Maintenance (FCM)</strong><br />
RAB set so the firm earns a fair return on <em>past</em> capital <strong>irrespective of asset-value changes</strong>. Once an asset is &quot;rolled in,&quot; its value is fixed until fully depreciated.<br />
<span class="small good">Protects against stranding → promotes investment where prices are volatile.</span></p>
</div>
<div class="card">
<p><strong>Operational Capital Maintenance (OCM)</strong><br />
RAB <em>re-valued</em> to reflect technology, price, and obsolescence changes.<br />
<span class="small bad">Firm bears asset-value risk.</span><br />
<span class="small good">Sharper investment signals → suits rapid technological change.</span></p>
</div>
</div>
<p><span class="small">Most UK/Australian core-network utilities use <strong>FCM</strong>. The choice shifts risk between shareholders and consumers.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
