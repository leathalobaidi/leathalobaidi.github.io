</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="37" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="lric-the-other-revenue-setting-route">LRIC: the other revenue-setting route</h2>
<div class="def">
<strong>Long-run incremental cost (LRIC)</strong> — set each service's price to the forward-looking cost a <em>new efficient entrant</em> would incur to supply an increment of demand. Widely used in telecoms.
</div>
<ul>
<li>Aims to replicate a <strong>competitive-market</strong> price and give correct <strong>entry/investment signals</strong>.</li>
<li><strong>LRIC+</strong> adds a mark-up to recover joint and common costs.</li>
<li>Modelling choices are large and contestable: increment size, service vs element (TSLRIC/TELRIC), optimisation (&quot;scorched earth&quot; vs &quot;scorched node&quot;), asset valuation (ORC / DORC), depreciation.</li>
<li>Downside: heavy regulator <strong>discretion</strong> → uncertainty can deter investment and raise the cost of capital.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="38" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="price-caps--advantages">Price caps — advantages</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Cost-cutting incentive</strong> — savings become profit until the next reset.</li>
<li><strong>Eases information asymmetry</strong> — the firm's behaviour reveals its true costs over time.</li>
<li><strong>Less micro-management</strong> — firm gets discretion; regulator need not set every price.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Efficient pricing</strong> — pricing flexibility can yield welfare-improving structures.</li>
<li><strong>No A–J</strong> — less prone to over-capitalisation.</li>
<li><strong>Risk transfer</strong> — cost/demand risk moves to the firm, who may manage it better.</li>
<li><strong>Simpler</strong> (in principle).</li>
</ul>
</div>
</div>
<p><span class="small">Reality check: many of these are &quot;in-principle&quot; gains. Regulatory burden did <em>not</em> fall as hoped; efficient price structures often did not emerge.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="39" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="price-caps--disadvantages">Price caps — disadvantages</h2>
<div class="key">
Detaching price from cost creates its own problems — chiefly on quality, investment, and <strong>commitment</strong>.
</div>
<ul>
<li><strong>Allocative inefficiency</strong> — prices and costs can diverge; excess earnings can embarrass the regulator.</li>
<li><strong>Quality</strong> — firm can cut cost by cutting quality (Spence: a price-capped monopolist sets quality too low).</li>
<li><strong>Higher cost of capital</strong> — the firm now bears cost risk.</li>
<li><strong>Weaker investment</strong> — fear that efficiently incurred costs won't be recovered at reset.</li>
<li><strong>Ratchet effect</strong> — slack effort at period-end.</li>
<li><strong>Cross-subsidy / anti-competitive</strong> use of pricing flexibility.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="40" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="the-commitment-problem--the-achilles-heel">The commitment problem — the &quot;Achilles' heel&quot;</h2>
<div class="def">
Unlike ROR, price caps offer <strong>no assurance</strong> that prudent costs will be recovered. Everything turns on whether the regulator will act opportunistically when re-setting X.
</div>
<div class="cols">
<div class="card">
<p><strong>Risk to the firm</strong><br />
Regulator bows to political/consumer pressure and sets X <em>too high</em> — clawing back returns. The firm becomes &quot;a hostage to the regulator.&quot;</p>
</div>
<div class="card">
<p><strong>Risk to consumers</strong><br />
Regulator is <em>captured</em> and sets X <em>too low</em> — the firm keeps excess profit.</p>
</div>
</div>
<p><span class="small">Fixes: quality standards in licences, financial reward/penalty schemes, published X-setting guidelines, a <em>financeability</em> duty, and efficiency carry-over mechanisms for the ratchet.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="41" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="developments-in-price-caps">Developments in price caps</h2>
<div class="key">
Practice has layered many adaptations onto the basic cap to sharpen incentives, share risk, and cut information asymmetry.
</div>
<ul>
<li><strong>Longer / mid-period reviews</strong>; automatic <strong>pass-through</strong> (RPI−X+Y, Z-factors) of uncontrollable costs.</li>
<li><strong>Rolling</strong> efficiency incentives; <strong>efficiency carry-over</strong> for constant incentives.</li>
<li>Richer <strong>benchmarking</strong>; capex <strong>trigger</strong> mechanisms; <strong>menu regulation</strong> for capex.</li>
<li><strong>Outputs-based</strong> regulation (Britain, energy): regulator sets high-level <em>outcomes</em> over an 8-year cap and lets the firm choose how to deliver them, via an approved business plan.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" class="part" data-marpit-pagination="42" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">

<h4 id="part-4">Part 4</h4>
<h1 id="ror-vs-price-cap">ROR vs price cap</h1>
<h4 id="contrast--then-convergence">Contrast — then convergence</h4>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="43" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="the-fundamental-regulatory-trade-off">The fundamental regulatory trade-off</h2>
<div class="def">
Laffont & Tirole frame it as two contracts. A <strong>fixed-price contract</strong> gives high-powered cost incentives but extracts little rent. A <strong>cost-plus contract</strong> extracts all rent but gives no cost incentive.
</div>
<div class="key">
An incentive scheme is <strong>high-powered</strong> if the firm bears a high fraction of its realised costs (keeps its savings), <strong>low-powered</strong> if it bears little. The unavoidable tension: <em>incentives vs rent extraction</em> — and, as a corollary, <em>who bears cost risk</em>.
</div>
<ul>
<li>Pure <strong>ROR</strong> = low-powered → good rent extraction, cost risk on <strong>consumers</strong>.</li>
<li>Pure <strong>price cap</strong> = high-powered → weak rent extraction in-period, cost risk on the <strong>firm</strong>.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="44" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="45" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="empirical-evidence-mostly-mixed">Empirical evidence: mostly mixed</h2>
<div class="key">
Studies of the ROR→price-cap transition (esp. US & UK telecoms) find effects that are <strong>real but not dramatic</strong>, and often mixed (Sappington 2002).
</div>
<ul>
<li><strong>Prices</strong> — some find lower under caps; others find little or higher.</li>
<li><strong>Operating costs</strong> — mixed; some show slight <em>increases</em>, some no reduction.</li>
<li><strong>TFP / productivity</strong> — mixed; large gains for BT, none elsewhere.</li>
<li><strong>Earnings</strong> — some evidence earnings <em>rose</em> under caps (e.g. BT).</li>
<li><strong>Quality</strong> — mixed; often no lasting decline.</li>
<li><strong>Network modernisation</strong> — <em>higher</em> under incentive regulation.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="46" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="in-practice-the-two-converge">In practice, the two converge</h2>
<div class="def">
The single most important insight of the chapter: in practice the difference between ROR and price cap is one of <strong>degree, not kind</strong>. No real system is "pure."
</div>
<p>Why they converge:</p>
<ul>
<li>Both are <strong>incomplete long-term contracts</strong> — periodically re-negotiated.</li>
<li>Caps get <strong>reset against costs</strong>; at the first review, price-cap regulators make essentially the same cost-of-capital calculation as ROR regulators (Newbery).</li>
<li>Setting X uses <strong>past performance</strong> — just like a rate case.</li>
<li>The <strong>RAB anchors</strong> the cap to the asset base, exactly as the rate base anchors ROR.</li>
</ul>
<p><span class="small">A short-duration cap with full gain give-back <em>is</em> lagged ROR. A long cap where the firm keeps earnings is genuinely different.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" class="part" data-marpit-pagination="47" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">

<h4 id="part-5">Part 5</h4>
<h1 id="hybrids--adaptations">Hybrids &amp; adaptations</h1>
<h4 id="sharing-menus-and-yardsticks">Sharing, menus, and yardsticks</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="48" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="earnings-sliding-scale-sharing">Earnings (sliding-scale) sharing</h2>
<div class="def">
<strong>Earnings / profit sharing</strong> ("sliding scale") — a <em>middle ground</em>. Set a target return with a <strong>deadband</strong> where the firm keeps all earnings; outside it, gains and losses are <em>shared</em> with consumers.
</div>
<ul>
<li>Inside the deadband → behaves like a <strong>price cap</strong> (firm keeps everything).</li>
<li>Outside the band → behaves like <strong>ROR</strong> (earnings/losses shared via refunds or higher prices).</li>
<li>Attractive to regulators <em>first moving away</em> from ROR — some protection against excess earnings.</li>
<li>Used in US telecoms and energy in the early–mid 1990s; ~22 states once ran sliding-scale telecoms plans.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="49" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">

<td>above <strong>18%</strong></td>
<td>0%</td>
<td>all extra refunded</td>
</tr>
</tbody>
</table>
<div class="key">
Trade-off (Sappington): sharing <strong>reduces excess earnings</strong> but <strong>blunts</strong> the cost-cutting incentive. Net value depends on which matters more in context.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="50" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="side-effects-of-sharing">Side effects of sharing</h2>
<div class="cols">
<div class="card">
<p><strong>Earnings sharing distorts</strong></p>
<ul>
<li>Near the <strong>floor</strong> → take on <em>riskier</em> projects (downside is shared).</li>
<li>Near the <strong>ceiling</strong> → <em>avoid</em> projects that push earnings over.</li>
<li>Incentive to <strong>shift costs</strong> between years.</li>
</ul>
</div>
<div class="card">
<p><strong>Revenue sharing (alternative)</strong><br />
Share <em>revenue</em> above a threshold, not earnings.<br />
<span class="small good">Keeps the cost-cutting incentive; doesn't push the regulator to disallow costs.</span><br />
<span class="small bad">May deter revenue growth; cut quality to curb demand.</span></p>
</div>
</div>
<p><span class="small">By the late 2000s US state regulators had largely dropped earnings sharing for conventional price caps; still seen in some developing/transitional countries.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="51" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="menu-regulation-laffont%E2%80%93tirole">Menu regulation (Laffont–Tirole)</h2>
<div class="def">
<strong>Menu regulation</strong> — offer the firm a <em>choice</em> among regulatory contracts, each pairing a capex allowance with a reward for beating it. The firm's choice <em>reveals</em> its private information.
</div>
<ul>
<li><strong>Low-capex / high-powered</strong> contract — smaller allowance, but the firm keeps a <em>large</em> share of any under-spend.</li>
<li><strong>High-capex / low-powered</strong> contract — larger allowance, but a <em>smaller</em> share of the actual-vs-target difference.</li>
<li>A firm that knows it can economise self-selects the high-powered menu; an honest signal emerges.</li>
<li>Used in GB electricity and gas from 2004, and water &amp; wastewater (England &amp; Wales) from 2010.</li>
</ul>
<p><span class="small">Also links to <strong>efficiency carry-over</strong>: let the firm retain gains for a fixed span into the next period so effort stays constant.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="52" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="yardstick-competition-shleifer-1985">Yardstick competition (Shleifer 1985)</h2>
<div class="def">
<strong>Yardstick competition</strong> — tie a firm's reward to its performance <em>relative to comparable peers</em> (firms facing similar demand and technology), not to its own costs.
</div>
<ul>
<li>Each firm is paid the <strong>industry-average cost</strong>; beat the average → profit, lag it → loss.</li>
<li>Detaches price from <em>own</em> cost (like a cap) → strong, dynamic pressure to converge on the efficient level.</li>
<li>Directly <strong>sidesteps information asymmetry</strong>: peers reveal what efficient cost looks like.</li>
<li>Shleifer: <em>&quot;If a firm reduces costs when its twin firms do not, it profits; if it fails to reduce costs when others do, it incurs a loss.&quot;</em></li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="53" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="yardstick-the-practical-catches">Yardstick: the practical catches</h2>
<div class="cols">
<div class="card">
<p><strong>Why it's hard</strong></p>
<ul>
<li>Firms could <strong>collude</strong> to raise the average price.</li>
<li>Comparators must be <strong>truly similar</strong> (Joskow–Schmalensee: utilities differ in too many ways) — else rewards are random.</li>
</ul>
</div>
<div class="card">
<p><strong>How it's actually used</strong><br />
Rarely a full pricing system. Usually <strong>partial benchmarking</strong>: adjust X against peers — efficient firms get <em>low</em> X, inefficient firms <em>high</em> X. Used in GB, Netherlands, Austria (energy, water).</p>
</div>
</div>
<div class="key">
Shleifer showed full yardstick can still work with <em>heterogeneous</em> firms — <strong>if</strong> the differences are correctly modelled.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="54" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="benchmarking-toolkit">Benchmarking toolkit</h2>
<div class="def">
<strong>Benchmarking</strong> uses comparator data to estimate a firm's efficient cost or productivity, feeding the value of X. Data-hungry, but powerful against information asymmetry.
</div>
<table>
<thead>
<tr>
<th>Method</th>
<th>What it does</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>DEA</strong> (Data Envelopment Analysis)</td>
<td>Non-parametric efficient frontier from inputs/outputs</td>
</tr>
<tr>
<td><strong>COLS</strong> (Corrected OLS)</td>
<td>Regression cost function, shifted to the best performer</td>
</tr>
<tr>
<td><strong>SFA</strong> (Stochastic Frontier Analysis)</td>
<td>Separates inefficiency from random noise</td>
</tr>
<tr>
<td><strong>TFP</strong> (Total Factor Productivity)</td>
<td>Output-to-input growth vs the economy or peers</td>
</tr>
</tbody>
</table>
<p><span class="small">In the Netherlands, each electricity DSO's X has been explicitly linked to sector-average efficiency improvement, quality included.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" class="part" data-marpit-pagination="55" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>

<h4 id="part-6">Part 6</h4>
<h1 id="emerging-competition">Emerging competition</h1>
<h4 id="when-to-loosen-the-grip">When to loosen the grip</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="56" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="price-regulation-as-competition-emerges">Price regulation as competition emerges</h2>
<div class="key">
When competition constrains the firm <em>partly</em> but not fully, standard caps can <strong>backfire</strong> — shielding the incumbent and dulling its incentive to cut costs. Conventional caps may even <em>deter entry</em>.
</div>
<p>Five transitional responses:</p>
<ul>
<li><strong>Additional obligations, no formal cap</strong> — e.g. non-discrimination, cost-orientation rules on the dominant firm.</li>
<li><strong>Oversight / monitoring</strong> — replace the cap with structured watching, backed by the <em>threat</em> of re-regulation.</li>
<li><strong>Shorter control periods</strong> — review more often whether competition has arrived.</li>
<li><strong>Precautionary (&quot;safeguard&quot;) caps</strong> — a <em>loose</em> cap above cost but below excessive; the incumbent matches rivals rather than pricing to the ceiling.</li>
<li><strong>Targeted controls</strong> — regulate only the specific services or geographies where competition is weak.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="57" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="withdrawal-the-guiding-principle">Withdrawal: the guiding principle</h2>
<div class="def">
<strong>Asymmetric / transitional regulation</strong> — apply lighter, targeted controls to the firm with market power, and be ready to <em>withdraw</em> them as rivalry develops.
</div>
<div class="key">
The main lesson: where competition is developing, the regulator must <strong>continually review</strong> whether the pricing obligations on the incumbent are still appropriate — and remove them when they start protecting the incumbent rather than consumers.
</div>
<p><span class="small">Wider vertical-access questions — how entrants get the core network's services — are the subject of Chapter 6.</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="58" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="chapter-summary">Chapter summary</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>ROR</strong> tracks costs → limits monopoly pricing and losses, but <strong>low-powered</strong>: weak cost/innovation incentives; <strong>A–J</strong> over-capitalisation if <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>s</mi><mo>&gt;</mo><mi>r</mi></mrow><annotation encoding="application/x-tex">s&gt;r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span></span>; <strong>regulatory lag</strong> adds some incentive.</li>
<li><strong>Price cap / RPI−X</strong> detaches price from cost for a fixed period → <strong>high-powered</strong>, firm keeps in-period savings; risks on quality, investment, and <strong>commitment</strong>.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Building blocks</strong> set the cap: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi><mo>=</mo><mi>r</mi><mo>⋅</mo><mtext>RAB</mtext><mo>+</mo><mtext>Opex</mtext><mo>+</mo><mtext>Dep</mtext></mrow><annotation encoding="application/x-tex">R = r\cdot\text{RAB} + \text{Opex} + \text{Dep}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.4445em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord text"><span class="mord">RAB</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8778em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">Opex</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8778em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">Dep</span></span></span></span></span>; RAB, FCM vs OCM, capex roll-in.</li>
<li>The two forms <strong>converge</strong> — incomplete contracts, reset against costs, RAB-anchored.</li>
<li><strong>Hybrids</strong>: earnings/revenue sharing, menus, <strong>yardstick</strong>/benchmarking (DEA, COLS, SFA, TFP).</li>
<li>Emerging competition → <strong>transitional, targeted, withdrawable</strong> controls.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="59" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="self-check-1%E2%80%934">Self-check (1–4)</h2>
<div class="key">
Try each before moving on — the answers are in this deck.
</div>
<ol>
<li>Write the ROR revenue formula and the building-block formula. What plays the role of the &quot;rate base&quot; in each?</li>
<li>State the Averch–Johnson effect. Under what condition on <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>s</mi></mrow><annotation encoding="application/x-tex">s</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">s</span></span></span></span> and <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>r</mi></mrow><annotation encoding="application/x-tex">r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span></span> does it vanish?</li>
<li>In RPI−X, if RPI = 3% and X = 6%, by how much must average prices change? What does X &quot;represent&quot; on the two competing views?</li>
<li>Contrast FCM and OCM. Which places asset-value risk on the firm, and which suits rapid technological change?</li>
</ol>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" data-marpit-pagination="60" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
<header>Ch 5 · Forms of price regulation</header>
<h2 id="self-check-5%E2%80%937">Self-check (5–7)</h2>
<ol start="5">
<li>Give three reasons ROR and price cap <strong>converge</strong> in practice.</li>
<li>In the Figure 5.1 earnings-sharing plan, what happens to a firm earning a 17% return? A 10.5% return? Why does sharing &quot;blunt&quot; incentives?</li>
<li>Explain yardstick competition in one sentence (Shleifer). Name two practical obstacles and two benchmarking methods used to implement it partially.</li>
</ol>
<div class="def">
<strong>Stretch:</strong> A regulator wants high-powered incentives <em>and</em> protection against excess profit while moving off ROR. Which hybrid fits, and what is the central trade-off it imposes?
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header="Ch 5 · Forms of price regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="lead" data-theme="q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji" lang="en-GB" class="lead" data-marpit-pagination="61" style="--paginate:true;--header:Ch 5 · Forms of price regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:lead;--theme:q1hunq9n8zq391qefq3qs2px4llhizlmrucyxpxf0pji;" data-marpit-pagination-total="61">
