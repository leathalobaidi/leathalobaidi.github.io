<header>Ch 3 · Alternatives to regulation</header>

<h1 id="alternatives-to-traditional-regulation">Alternatives to Traditional Regulation</h1>
<h2 id="chapter-3--modern-economic-regulation">Chapter 3 · Modern Economic Regulation</h2>
<p><span class="small">Six ways to &quot;control&quot; a utility <em>without</em> classic ex ante price, conduct and entry regulation — and why most of them fall short.</span></p>
<p><span class="pill">Competition for the market</span> <span class="pill">Contestability</span> <span class="pill">State ownership</span><br />
<span class="pill">Ex post competition law</span> <span class="pill">Deregulation</span> <span class="pill">Negotiated settlements</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="2" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="learning-objectives">Learning objectives</h2>
<div class="key">
By the end you should be able to <strong>define, explain the mechanism of, and critique</strong> each alternative to traditional regulation — and say <em>when</em> each might work.
</div>
<ul>
<li><strong>Frame</strong> the question: is ongoing ex ante regulation inevitable?</li>
<li>Explain <strong>competition for the market</strong> (Demsetz/Chadwick franchising) and its contracting problems.</li>
<li>State the <strong>contestability</strong> result and why real utilities are not contestable.</li>
<li>Weigh <strong>state ownership</strong> vs regulated private ownership.</li>
<li>Contrast <strong>ex ante regulation</strong> with reliance on <strong>ex post competition law</strong>.</li>
<li>Trace the <strong>monopoly → competition</strong> transition (&quot;deregulation&quot;).</li>
<li>Assess <strong>negotiated settlements</strong>, private contracts, and light-handed monitoring.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="3" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="key-terms">Key terms</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Ex ante</strong> — rules set <em>before</em> conduct occurs (e.g. a price cap).</li>
<li><strong>Ex post</strong> — intervene <em>after</em> harm is proven (competition law).</li>
<li><strong>Franchise / concession</strong> — right to be the monopoly, awarded by bid.</li>
<li><strong>Contestable market</strong> — free entry, costless exit.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Sunk cost</strong> — spending that cannot be recovered on exit.</li>
<li><strong>Essential facility</strong> — bottleneck input rivals must access.</li>
<li><strong>Asymmetric regulation</strong> — tighter rules on the incumbent than on entrants.</li>
<li><strong>Negotiated settlement</strong> — utility + customers agree, regulator approves.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="4" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="31-is-economic-regulation-inevitable">3.1 Is economic regulation inevitable?</h2>
<p>The Chapter 2 case for regulation rests on <strong>natural monopoly</strong>: price/conduct rules fix allocative inefficiency; entry rules fix productive inefficiency.</p>
<div class="key">
This chapter asks the opposite question: are there <strong>other ways</strong> to control a utility's behaviour that avoid permanent, intrusive ex ante regulation?
</div>
<p>Six candidate alternatives are examined. None is a clean, universal substitute — but each has <strong>contemporary relevance</strong>, some for whole industries, some only as an influence on how regulation is designed.</p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="5" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="the-spectrum-of-alternatives">The spectrum of alternatives</h2>
<div class="cols">
<div class="card">
<p><strong>Replace regulation entirely</strong></p>
<ol>
<li>Competition <em>for</em> the market (franchising)</li>
<li>Contestability / threat of entry</li>
<li>State ownership</li>
<li>Ex post competition law</li>
</ol>
</div>
<div class="card">
<p><strong>Change the industry, then step back</strong><br />
5. &quot;Deregulation&quot; — introduce competition, withdraw controls as it develops<br />
6. Negotiated settlements — regulator as <em>facilitator</em>, not decider</p>
</div>
</div>
<div class="box">
<strong>A recurring dividing line:</strong> the <em>core network</em> (wires, pipes) resists every alternative; the <em>competitive activities</em> around it (generation, retail) are where alternatives can bite.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" class="part" data-marpit-pagination="6" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>

<h4 id="alternative-1">Alternative 1</h4>
<h1 id="competition-for-the-market">Competition <em>for</em> the Market</h1>
<p><span class="small">Franchising · Demsetz auctions · &quot;competition for the field&quot;</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="7" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="32-what-it-is">3.2 What it is</h2>
<div class="def">
<strong>Competition for the market:</strong> potential suppliers <em>bid</em> for the exclusive right to serve a monopoly market on pre-set terms for a set period. The firm offering the lowest price (at a minimum quality) wins.
</div>
<ul>
<li>Competition happens <strong>at the auction</strong>, not in the market day-to-day.</li>
<li>The winning bid should reflect <strong>average cost</strong> → a normal profit, no excess pricing.</li>
<li>Government's only jobs: <strong>run the auction</strong> and <strong>pick the winner</strong>.</li>
</ul>
<div class="key">
Key insight (Demsetz): scale economies in <em>production</em> are irrelevant to the <em>number of bidders</em>. Many firms can compete to be the one monopolist.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="8" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="how-its-meant-to-work">How it's meant to work</h2>
<div class="cols">
<div class="card">
<p><strong>The logic</strong></p>
<ul>
<li>Rivalry among bidders drives the price down to average cost.</li>
<li>No need for a regulator to keep estimating cost and demand year after year.</li>
<li>The franchisee keeps cost savings while it holds the contract → efficiency incentive.</li>
</ul>
</div>
<div class="card">
<p><strong>Claimed advantages</strong></p>
<ul>
<li>Lower <strong>information costs</strong> for the state.</li>
<li>Avoids <strong>over-investment</strong> seen under rate-of-return regulation.</li>
<li>Rewards <strong>innovation</strong> and cost-cutting.</li>
</ul>
</div>
</div>
<div class="box">
<strong>Two hidden assumptions:</strong> (1) all bidders can buy inputs at competitive prices; (2) bidders <em>do not collude</em> — bids are genuinely competitive.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="9" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="origins--real-world-use">Origins &amp; real-world use</h2>
<div class="cols">
<div class="card">
<p><strong>Intellectual roots</strong></p>
<ul>
<li><strong>Chadwick (1859)</strong> — &quot;competition <em>for</em> the field.&quot;</li>
<li><strong>Demsetz (1968)</strong> — challenged the link between natural monopoly and the <em>need</em> to regulate.</li>
</ul>
</div>
<div class="card">
<p><strong>In practice (100+ years)</strong></p>
<ul>
<li>19th-c. Paris gas put up for the &quot;whole field.&quot;</li>
<li>US <strong>municipal franchising</strong> for utilities.</li>
<li><strong>Concession contracts</strong> today — rail, water — esp. in developing/transitional economies.</li>
</ul>
</div>
</div>
<div class="key">
Gómez-Ibáñez: developing economies may prefer concessions because <strong>courts look less politically vulnerable than regulatory agencies</strong>.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="10" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="limitations--it-is-really-a-contract">Limitations — it is really a <em>contract</em></h2>
<p>The winning bid creates a <strong>long-term contract</strong> between franchisee and government. Like all big complex contracts, it is hard to specify well up front.</p>
<div class="box">
<strong>Contractual incompleteness</strong> is the core problem: you cannot write everything in advance, so gaps must be filled later — a source of instability when uncertainty is high and the contract runs for years.
</div>
<p>Williamson's transaction-cost critique — the messy &quot;complications&quot; that reappear:</p>
<ul>
<li>Obscure or artificial <strong>award criteria</strong></li>
<li>Execution hazards; adapting <strong>prices to changing costs</strong></li>
<li>Policing <strong>quality standards</strong></li>
<li><strong>Ex post opportunism</strong> by the franchisee</li>
<li><strong>Loss of bidding parity at re-tender</strong></li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="11" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="limitations-cont--the-asset-transfer-trap">Limitations (cont.) — the asset-transfer trap</h2>
<div class="key">
At <strong>re-tendering</strong>, the incumbent owns the sunk assets and knows the operation. New bidders start blind and cannot cheaply take over the assets → the "competition" at renewal is often illusory.
</div>
<ul>
<li><strong>Few real bidders</strong> for capital-intensive utilities.</li>
<li>Not efficient by design: it caps monopoly pricing but does <strong>not</strong> deliver marginal-cost pricing.</li>
<li>Doesn't generalise cleanly to <strong>multi-product</strong> settings.</li>
</ul>
<div class="box">
Armstrong, Cowan &amp; Vickers (1994): bidding is <strong>not well suited to capital-intensive utility activities</strong>; administering the contract needs ongoing regulatory involvement anyway. So franchise-administration vs regulation is a difference <em>of degree, not of kind</em>.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="12" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="verdict-on-franchising">Verdict on franchising</h2>
<div class="cols">
<div class="card">
<p><strong>Where it fits</strong></p>
<ul>
<li>Simpler services, <strong>shorter contracts</strong>.</li>
<li>Recent US concessions work better — used in <em>less complex</em> settings than electricity/telecoms.</li>
<li>Perhaps best <strong>early</strong> in a new natural monopoly's life.</li>
</ul>
</div>
<div class="card">
<p><strong>Where it fails</strong></p>
<ul>
<li>Complex, long-lived, capital-heavy utilities.</li>
<li>Empirical record: design, bidding, renegotiation and re-franchising problems recur.</li>
</ul>
</div>
</div>
<div class="key">
Best seen as a <strong>short-to-medium-run</strong> solution to natural monopoly — not a long-run replacement for regulation. Over time, the old regulatory problems creep back.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" class="part" data-marpit-pagination="13" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>

<h4 id="alternative-2">Alternative 2</h4>
<h1 id="contestability--the-threat-of-entry">Contestability &amp; the Threat of Entry</h1>
<p><span class="small">Baumol · Panzar · Willig (early 1980s)</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="14" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="33-what-it-is">3.3 What it is</h2>
<div class="def">
A market is <strong>perfectly contestable</strong> when "entry is absolutely free, and exit is absolutely costless." Then the mere <em>threat</em> of entry disciplines the incumbent — even a single-firm monopoly behaves competitively, and <strong>regulation may be unnecessary</strong>.
</div>
<ul>
<li>Any excess profit or slack is an <strong>earnings opportunity</strong> for an entrant.</li>
<li>An entrant can jump in, grab the profit, and exit with the profit intact — <strong>&quot;hit-and-run&quot; entry</strong>.</li>
<li>So potential competition works <strong>almost like actual competition</strong>.</li>
</ul>
<div class="key">
Baumol: "every deviation from good behaviour instantly makes them vulnerable to hit-and-run entry."
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="15" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="how-its-meant-to-work-1">How it's meant to work</h2>
<p>The incumbent, fearing <strong>&quot;shadow entrants,&quot;</strong> sets price at average cost so <strong>no profit opportunity exists</strong> to attract entry. Discipline arrives <em>without anyone actually entering</em>.</p>
<div class="box">
<strong>Policy implication (if true):</strong> imposing entry restrictions is harmful — it removes the shadow entrants that keep the monopolist honest. Matters can "take care of themselves."
</div>
<p>Same spirit as franchising (freedom of entry limits monopoly pricing) — but with a <strong>critical difference</strong>: contestability needs <strong>no franchise at all</strong>. Technology and cost conditions alone do the disciplining.</p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="16" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="the-three-critical-assumptions">The three critical assumptions</h2>
<div class="key">
Perfect contestability (single-product) requires <strong>all</strong> of:
</div>
<ol>
<li><strong>No sunk costs</strong> — every entry cost can be recovered on exit.</li>
<li>Entrants have <strong>identical technology, costs, information</strong> and offer identical products.</li>
<li>The incumbent's <strong>response time is slower</strong> than the time to enter <em>and</em> exit — so no strategic price cut can catch the entrant.</li>
</ol>
<div class="box">
The load-bearing assumption is <strong>#1, no sunk costs</strong>. It is what lets an entrant recover its assets and flee before the incumbent reacts. This is exactly what separates contestability from franchising (where sunk costs are recovered over the franchise term).
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="17" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="limitations--the-disconnect-from-reality">Limitations — the disconnect from reality</h2>
<div class="key">
Most potent critique: real industries <strong>violate the assumptions</strong>. Almost all have entry/exit <em>lags</em> and at least <em>some</em> sunk costs.
</div>
<ul>
<li>The &quot;<strong>total entry</strong>&quot; assumption — instantly duplicating the incumbent's size, brand, product range — is implausible.</li>
<li>The &quot;<strong>reserve army</strong>&quot; of idle phantom entrants waiting to pounce does not exist.</li>
<li><strong>Extreme fragility:</strong> Stiglitz — &quot;arbitrarily small sunk costs can serve as an <em>absolute</em> barrier to entry,&quot; making potential competition useless.</li>
<li>A short entry lag <strong>+</strong> a little sunk cost overturns the result entirely.</li>
</ul>
<p>Shepherd: drawing policy lessons from it is &quot;naïve and premature.&quot;</p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="18" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="the-proponents-defence">The proponents' defence</h2>
<div class="box">
Baumol replies: perfect contestability is <strong>not a description of reality</strong> — it is a <em>normative benchmark</em>, like perfect competition. It helps <em>delineate</em> where regulation is needed and flag candidates for deregulation.
</div>
<ul>
<li>But note (Spence): perfect competition relies on <em>many price-takers</em>; contestability instead relies on <em>rapid entry and exit</em> — a stronger, rarer condition.</li>
<li>Legacy that outlived the theory: <strong>stand-alone cost (SAC)</strong> and <strong>incremental cost</strong> — used to set price <strong>ceilings and floors</strong> in rail and telecoms.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="19" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="where-contestability-actually-applies">Where contestability actually applies</h2>
<div class="cols">
<div class="card">
<p><strong>&quot;Capital on wheels&quot;</strong><br />
Planes, buses, trucks — assets are <strong>fixed but not sunk</strong>; you can redeploy them across routes. Higher entry threat.</p>
</div>
<div class="card">
<p><strong>Core networks — NOT contestable</strong><br />
Electricity wires &amp; towers, gas pipelines, water pipes, phone lines: <strong>specific, immobile, durable, sunk</strong>. Rapid entry is impossible; entry threat is weak.</p>
</div>
</div>
<div class="key">
Even US <strong>airline</strong> deregulation gave "little support" for the theory — entry on routes proved far from "ultrafree."
</div>
<div class="box">
But <strong>services over the network</strong> (generation, gas production, retail) <em>can</em> be constrained by potential entry, even where the <em>network owner</em> cannot. This is the seed of the "deregulation" argument later.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" class="part" data-marpit-pagination="20" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>

<h4 id="alternative-3">Alternative 3</h4>
<h1 id="state-ownership-of-the-utilities">State Ownership of the Utilities</h1>
<p><span class="small">Nationalisation instead of regulating a private monopoly</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="21" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="34-what-it-is">3.4 What it is</h2>
<div class="def">
<strong>State ownership:</strong> the government owns and runs the utility. Economic rationale — a state firm is <em>not driven by private gain</em> and can be <em>directed</em> to serve the public interest: price at cost, invest efficiently, meet social goals.
</div>
<p>Why chosen, at different times:</p>
<ul>
<li>Perceived <strong>failure of regulating private monopolies</strong> (Gray: reconciling private privilege with public interest by the &quot;alchemy of regulation&quot; is a <em>delusion</em>).</li>
<li>In developing economies, often <strong>by default</strong> — no credible commitment to private property rights.</li>
</ul>
<div class="key">
Historically common worldwide (notable exception: US utilities, mostly private + regulated). Still widespread today — even new assets, e.g. Australia's <strong>National Broadband Network</strong>.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="22" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="incentives--the-principal%E2%80%93agent-lens">Incentives — the principal–agent lens</h2>
<div class="cols">
<div class="card">
<p><strong>Private ownership</strong></p>
<ul>
<li>Principal = <strong>shareholders</strong></li>
<li>Objective = <strong>profit maximisation</strong></li>
<li>Pecuniary interest → <strong>close monitoring</strong> of managers.</li>
</ul>
</div>
<div class="card">
<p><strong>State ownership</strong></p>
<ul>
<li>Principal = <strong>&quot;the state&quot;</strong> (public, politicians, civil servants)</li>
<li>Objective = welfare + <strong>many social goals</strong></li>
<li>Weak private incentive to <strong>monitor</strong> management.</li>
</ul>
</div>
</div>
<div class="box">
"The state" is not one principal but <strong>many</strong>, with conflicting agendas — which makes a clean "public interest" objective hard to define.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="23" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="limitations-of-state-ownership">Limitations of state ownership</h2>
<div class="key">
Four classic problems:
</div>
<ul>
<li><strong>Fuzzy objective</strong> — &quot;public interest&quot; is imprecise, multi-dimensional, and often internally conflicting.</li>
<li><strong>Political volatility</strong> — goals change from one administration to the next.</li>
<li><strong>Politicised pricing</strong> — prices set below cost for distributional reasons; cross-subsidy (rural funded by urban) to win support. Newbery: &quot;less pressure to get prices right... to keep them from going too low.&quot;</li>
<li><strong>Weak monitoring / soft budget</strong> — politicians and civil servants have marginal incentives to police efficiency.</li>
</ul>
<div class="box">
Partial fixes: <strong>shareholder executives</strong> to sharpen oversight; or subject the state firm to an <strong>independent regulator</strong>.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="24" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="empirical-evidence-does-private-do-better">Empirical evidence: does private do better?</h2>
<p>Three research designs:</p>
<ol>
<li><strong>International</strong> comparison of public vs private firms in one industry.</li>
<li><strong>Within-country</strong> comparison of public vs private.</li>
<li><strong>Before/after</strong> the 1980s–90s <strong>privatisation wave</strong>.</li>
</ol>
<div class="key">
A broad survey found performance gains from privatisation <strong>almost unanimously</strong> reported. Supported by utility studies in telecoms, rail and energy.
</div>
<div class="box">
<strong>Caveats:</strong> in <em>developing countries</em>, privatisation often did <em>not</em> improve infrastructure performance. Early studies also biased toward private firms by measuring only profit/costs, ignoring consumer-side effects.
</div>
<p>Why gains? Pre-sale restructuring, capital-market discipline, less union control, stronger innovation incentives.</p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="25" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="coexistence-state-ownership-plus-regulation">Coexistence: state ownership <em>plus</em> regulation</h2>
<div class="key">
Increasingly, state ownership is <strong>not</strong> a substitute for regulation — the two run side by side. State-owned utilities are subject to an independent regulator.
</div>
<p>Examples: UK rail networks; Scottish water; electricity T&amp;D in Australia, NZ and Ireland; US water &amp; wastewater.</p>
<div class="box">
<strong>The "two masters" problem:</strong> the owner (government) may want wide coverage, low prices, big investment; the regulator wants cost scrutiny and no subsidies. Conflicting signals to the firm → need a <em>clear separation of roles</em>.
</div>
<div class="key">
Takeaway: that regulators are added on top suggests state ownership <em>alone</em> is not viewed as an effective control.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" class="part" data-marpit-pagination="26" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>

<h4 id="alternative-4">Alternative 4</h4>
<h1 id="reliance-on-ex-post-competition-law">Reliance on Ex Post Competition Law</h1>
<p><span class="small">Antitrust instead of sector-specific ex ante rules</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="27" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="35-ex-ante-vs-ex-post--the-core-contrast">3.5 Ex ante vs ex post — the core contrast</h2>
<div class="cols">
<div class="def">
<p><strong>Ex ante (standard regulation)</strong><br />
Anticipates harm; <strong>limits conduct before it happens</strong> (e.g. a price cap). Best where harmful conduct is <em>frequent</em> or the damage would be <em>large and irreversible</em>.</p>
</div>
<div class="def">
<p><strong>Ex post (competition law)</strong><br />
Harm-based; <strong>intervenes only after</strong> suspected appreciable harm. The <em>threat</em> of action is meant to deter bad conduct.</p>
</div>
</div>
<div class="cols">
<div class="card">
<p><strong>Ex ante trade-off</strong></p>
<ul>
<li>(+) Certainty; limits regulator discretion.</li>
<li>(−) <strong>Regulatory error</strong> — must set allowable conduct in advance on imperfect information.</li>
</ul>
</div>
<div class="card">
<p><strong>Ex post trade-off</strong></p>
<ul>
<li>(+) Better information <em>after</em> the fact → better-targeted intervention.</li>
<li>(−) <strong>Less certainty</strong> — a standard can be breached in unforeseen ways; may chill good conduct.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="28" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="352-using-competition-law-on-utilities">3.5.2 Using competition law on utilities</h2>
<p>Subject the utility to <strong>economy-wide competition/antitrust law</strong> — especially <strong>abuse of dominance / monopolisation</strong> — instead of a sector regulator.</p>
<div class="cols">
<div class="card">
<p><strong>Exclusionary conduct</strong><br />
Refusing access on reasonable terms → <strong>&quot;refusal to supply.&quot;</strong> The utility is treated like any owner of an <strong>essential / bottleneck facility</strong> rivals must reach.</p>
</div>
<div class="card">
<p><strong>Exploitative conduct</strong><br />
Charging <strong>excessive prices</strong> (esp. in Europe) — prices above the service's economic value.</p>
</div>
</div>
<div class="box">
<strong>Essential-facilities doctrine:</strong> US roots in <em>Terminal Railroad</em> (1912); EU lead case <em>Commercial Solvents</em> (1974). EU examples: the telephone <em>local loop</em>; electricity transmission/distribution networks. Definition is controversial and sometimes read very widely.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="29" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="attractive-properties">Attractive properties</h2>
<div class="key">
The appeal: intervene <strong>only on proven abuse</strong>, nothing more.
</div>
<ul>
<li>No need for <strong>permanent sector-specific regulators</strong> — just one competent competition authority.</li>
<li><strong>No ex ante price/conduct rules</strong> → less scope for regulatory error.</li>
<li>Intervention is <strong>targeted</strong> — only when a problem actually arises.</li>
<li>Reduces regulatory <strong>&quot;game-playing&quot;</strong> (strategies to dodge fixed rules).</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="30" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="limitations-of-the-ex-post-approach">Limitations of the ex post approach</h2>
<div class="key">
It stops the worst abuses but does not <em>optimise</em>.
</div>
<ul>
<li>Deters excessive prices / refusals, but does <strong>not ensure efficient</strong> prices or access terms.</li>
<li>Ignores other monopoly harms from Ch 2 — <strong>quality degradation, productive inefficiency</strong>.</li>
<li><strong>Slow and costly</strong>: enforcement is case-by-case; <strong>lengthy litigation</strong> means harm continues meanwhile.</li>
<li>Courts are <strong>ill-suited to price-setting</strong> — excessive-pricing cases founder on hard price–cost comparisons, esp. multi-product cost allocation.</li>
</ul>
<div class="box">
Mirrors the critique of the "administered contract" view — reasonableness, not efficiency. Won't satisfy those who see regulation's job as fixing allocative <em>and</em> productive inefficiency.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="31" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="evidence--the-ex-anteex-post-interaction">Evidence &amp; the ex ante/ex post interaction</h2>
<div class="key">
<strong>New Zealand, 1990s</strong> — relied on economy-wide competition law + "light-handed" measures for utilities. Widely judged <strong>unsuccessful</strong>; later replaced by standard ex ante regulation. (Foreshadowed by <em>Clear v Telecom NZ</em>.)
</div>
<ul>
<li>In the UK and Australia, regulators holding <em>both</em> powers have leaned on <strong>ex ante</strong> tools, not competition law.</li>
<li><strong>Complements, not substitutes (EU):</strong> access-price regulation and abuse-of-dominance rules apply <em>concurrently</em> in telecoms.</li>
<li><strong>Contrast — USA:</strong> antitrust generally <strong>won't apply</strong> where a regulator already governs access (<strong>Trinko</strong>, 2004).</li>
</ul>
<div class="box">
Likely verdict: keep ex ante for <strong>core network</strong> activities; a shift to ex post competition law can suit activities where <strong>competition has developed</strong>.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" class="part" data-marpit-pagination="32" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>

<h4 id="alternative-5">Alternative 5</h4>
<h1 id="deregulation--reliance-on-competition">&quot;Deregulation&quot; &amp; Reliance on Competition</h1>
<p><span class="small">Restructure the industry, then withdraw controls as competition grows</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="33" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="36-what-it-is-and-why-the-name-is-wrong">3.6 What it is (and why the name is wrong)</h2>
<div class="def">
"<strong>Deregulation</strong>": where an industry is <em>already</em> regulated, change its structure — allow competitive entry where possible and rely on <em>competition itself</em> to control firms. Withdraw ex ante entry and price restrictions on the activities that can bear competition.
</div>
<div class="key">
The label is a <strong>misnomer</strong>. Firms keep licences and standards; new rules replace old ones. Better terms: "<strong>restructuring</strong>" (Ch 1) or "<strong>re-regulation</strong>" (Vogel) — new rules tailored to the new structure.
</div>
<ul>
<li>Usually applies only to <strong>non-core</strong> activities → <strong>coexists</strong> with traditional regulation of the core network.</li>
<li>Two separate questions: when to lift <strong>entry</strong> restrictions, and when to lift <strong>price</strong> controls.</li>
<li>In practice, <strong>entry restrictions go first</strong>; price controls are withdrawn <strong>more gradually</strong>.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="34" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="361-removing-entry-restrictions">3.6.1 Removing entry restrictions</h2>
<p>The test ties back to the <strong>rationale</strong>: entry restrictions are justified where activities have <strong>natural-monopoly</strong> cost/demand conditions — so lift them where they <strong>don't</strong>.</p>
<div class="box">
Not as simple as it sounds. Whether competition beats regulated monopoly depends on <strong>context</strong> — information conditions, ownership, regulator capacity. Both monopoly <em>and</em> competition are imperfect incentive mechanisms.
</div>
<p>Why competition is still worth pursuing:</p>
<ul>
<li>Incentives to <strong>cut costs, serve consumers, invest and innovate</strong>.</li>
<li><strong>Hayek:</strong> competition as a <strong>&quot;discovery procedure&quot;</strong> — surfacing facts and methods that cannot be known ex ante; benefits <em>snowball</em> beyond what was foreseen.</li>
<li>Sidesteps regulator–firm <strong>information asymmetry</strong>.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="35" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="barriers-to-competition--asymmetric-regulation">Barriers to competition &amp; asymmetric regulation</h2>
<p>Even where competition is feasible, the <strong>former incumbent</strong> has legacy advantages: cheap long-term input contracts, a strong brand, and <strong>customer inertia / switching costs</strong>. This creates a role for the regulator.</p>
<div class="def">
<strong>Asymmetric regulation:</strong> firms in the same activity face <em>different</em> rules — tighter on the incumbent, lighter on entrants — to help competition take hold. Common in telecoms.
</div>
<p>Forms: restricting the incumbent's price cuts; letting entrants charge higher mark-ups; different reporting/quality rules; supplier-of-last-resort duties; even a temporary duopoly cap.</p>
<div class="box">
<strong>Objections:</strong> distorts price signals and imposes uneven cost burdens (productive-efficiency loss); creates competitive distortions; and skews investment — <em>dampening</em> incumbent investment while <em>over-stimulating</em> entrant investment.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="36" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="362-removing-ex-ante-price-controls">3.6.2 Removing ex ante price controls</h2>
<p>The hard part: <strong>when is competition &quot;effective enough&quot;</strong> to drop price controls?</p>
<div class="key">
The regulator must balance two errors:
</div>
<ul>
<li>Keep controls <strong>too long</strong> → can <em>hinder</em> competition (a regulated price becomes a collusion <strong>focal point</strong>, or deters entry/investment).</li>
<li>Drop controls <strong>too soon</strong> → the incumbent exploits market power against consumers.</li>
</ul>
<div class="box">
The two <em>end-states</em> — full monopoly and effective competition — are well defined. The messy <strong>middle</strong> is where the right response "depends significantly on context." Crude tests (e.g. incumbent share below 60%?) rarely settle it.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="37" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="the-four-stylised-stages-britain-early-2000s">The four stylised stages (Britain, early 2000s)</h2>
<div class="def">
A conceptual ladder from monopoly to competition (attributed to Beesley, for Ofgem):
</div>
<table>
<thead>
<tr>
<th>Stage</th>
<th>What it looks like</th>
<th>Regulatory task</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1 Pre-entry</strong></td>
<td>No competition; incumbent ≈ 100%</td>
<td>Full ex ante restrictions</td>
</tr>
<tr>
<td><strong>2 Pre-competitive</strong></td>
<td>Some entry; incumbent still (super-)dominant</td>
<td>Transitional / <strong>asymmetric</strong> regulation</td>
</tr>
<tr>
<td><strong>3 Established competition</strong></td>
<td>Incumbent power much reduced; entrants credible</td>
<td>Ease ex ante rules; <strong>monitor</strong></td>
</tr>
<tr>
<td><strong>4 Effective competition</strong></td>
<td>Intense rivalry constrains <em>all</em> firms</td>
<td>Rely on <strong>ex post competition law</strong></td>
</tr>
</tbody>
</table>
<div class="key">
At Stage 4 the risk of high prices is no worse than in any normal sector — so ordinary competition law suffices. The practical challenge is spotting the shift from Stage 2 → 3.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="38" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="transitional-measures--the-reality-check">Transitional measures &amp; the reality check</h2>
<p>Even after deciding to withdraw price control, safeguards often remain:</p>
<ul>
<li><strong>Transitional price controls</strong>; a mandated <strong>standard offer</strong> at a set price.</li>
<li>Continued <strong>price monitoring</strong>; caps on the <strong>number of tariffs</strong>; consumer-information duties.</li>
<li><strong>Periodic market-power tests</strong> (EU telecoms &quot;significant market power&quot;; US market-based-rate tests for generators and gas pipelines).</li>
</ul>
<div class="box">
Sobering conclusion: "<strong>regulating for competition has proved much more difficult than regulation of monopoly</strong>." It redistributes rents and risk among incumbents, entrants and consumers — and timing the withdrawal of controls is genuinely hard.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" class="part" data-marpit-pagination="39" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>

<h4 id="alternative-6">Alternative 6</h4>
<h1 id="negotiated-settlements">Negotiated Settlements</h1>
<p><span class="small">North America · regulator as facilitator, not decider</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="40" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="37-what-it-is">3.7 What it is</h2>
<div class="def">
<strong>Negotiated settlement:</strong> the utility and customer/consumer groups <em>negotiate</em> rates and terms directly, then submit the package to the regulator for <strong>approval</strong> — usually <em>without</em> a full regulatory hearing.
</div>
<ul>
<li>The regulator is a <strong>facilitator / backstop</strong>, not the primary decision-maker.</li>
<li>Used in <strong>US and Canadian federal energy</strong> regulation and states like Florida and California.</li>
<li>Championed by <strong>Littlechild</strong> as an alternative to rate-of-return and RPI−X price caps.</li>
</ul>
<div class="key">
Links to Ch 2's <em>long-term-contract</em> view of regulation: the settlement <em>is</em> the negotiated bargain, with the regulator holding the ring rather than dictating terms.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="41" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="advantages">Advantages</h2>
<div class="cols">
<div class="card">
<p><strong>Better outcomes</strong></p>
<ul>
<li>Reaches agreements the standard process <strong>wouldn't</strong>.</li>
<li>Reflects <strong>consumers' actual views</strong>.</li>
<li><strong>Flexible</strong>, not one-size-fits-all.</li>
<li>Lets parties <strong>trade across issues</strong> as a package.</li>
</ul>
</div>
<div class="card">
<p><strong>Lower cost</strong></p>
<ul>
<li>Usually <strong>faster</strong> than litigated regulation.</li>
<li><strong>Less burdensome</strong> for regulator and parties.</li>
<li>Avoids heavy <strong>technical/econometric</strong> analysis.</li>
<li>Improves <strong>industry relationships</strong> (buy-in).</li>
</ul>
</div>
</div>
<div class="key">
Littlechild's review of FERC/PUC use: agreed outcomes were "more flexible, more innovative and more closely tailored" than litigated ones.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="42" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="concerns--who-is-at-the-table">Concerns — who is at the table?</h2>
<div class="key">
The central worry: <strong>representation</strong>. Agreements bind everyone, but not everyone negotiates.
</div>
<ul>
<li><strong>Customer heterogeneity</strong> — one deal may not fit all current consumers. Consumer advocates (OCAs) may champion only &quot;safe&quot; issues; evidence they can leave <em>residential</em> customers worse off and <em>industrial</em> better off.</li>
<li><strong>Future consumers</strong> are absent — e.g. settlements that <strong>defer costs</strong> to later periods burden people not in the room.</li>
</ul>
<div class="box">
Hence a <strong>residual role for the regulator</strong>: represent future consumers and reject any settlement inconsistent with statutory duties or with inadequate representation. Also worry about <strong>repeated players</strong> capturing the process.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="43" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="negotiated-settlement-vs-private-contracting">Negotiated settlement vs private contracting</h2>
<div class="def">
Key distinction: in a negotiated settlement <strong>the regulator still has a role</strong> — structuring the negotiation, compelling disclosure, and <strong>deciding via the standard process if talks fail</strong> (not via ordinary commercial courts).
</div>
<div class="box">
<strong>"Negotiate–arbitrate"</strong> variant (access contexts): parties negotiate terms commercially; if they fail, refer to the regulator as a <em>dispute-resolver</em>. Used in UK/Australia telecoms and water — mixed results; Australia later replaced it in telecoms with standard "access determinations."
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" class="part" data-marpit-pagination="44" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>

<h4 id="also-considered">Also considered</h4>
<h1 id="other-approaches">Other Approaches</h1>
<p><span class="small">Private contracts · light-handed monitoring</span></p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="45" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="381-reliance-on-private-contracts">3.8.1 Reliance on private contracts</h2>
<div class="def">
The most radical option: govern price, quantity and quality through <strong>ordinary long-term private contracts</strong>, enforced in <strong>commercial courts</strong> — argued to give a clearer, stronger commitment than regulators.
</div>
<div class="cols">
<div class="card">
<p><strong>Attractions</strong></p>
<ul>
<li>Close <strong>customisation</strong> to a customer.</li>
<li>Court enforcement may be more credible than regulatory processes.</li>
<li>Works for large industrial buyers of power/water; freight rail; airlines.</li>
</ul>
</div>
<div class="card">
<p><strong>The small-customer problem</strong></p>
<ul>
<li>Impractical for <strong>many small buyers</strong> of small quantities with hard-to-specify needs.</li>
<li><strong>Transaction costs</strong> of negotiating/monitoring may exceed those of a regulator acting collectively for buyers.</li>
</ul>
</div>
</div>
<div class="key">
Schmalensee: there is a "general impossibility" of solving natural monopoly by negotiation alone — you need an agent for the buyers. But brokers/intermediaries or a <strong>menu of standard contracts</strong> may ease the small-customer problem.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="46" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="382-monitoring-sunshine--light-handed">3.8.2 Monitoring (&quot;sunshine&quot; / light-handed)</h2>
<div class="def">
<strong>Monitoring:</strong> leave the utility largely free but <em>watch</em> its prices and conduct, under threat of <strong>imposing (or re-imposing) regulation</strong> if behaviour proves unsatisfactory.
</div>
<ul>
<li>Used for <strong>airports</strong> in Australia and some UK airports.</li>
<li>Some optimism about extending it to energy.</li>
</ul>
<div class="box">
<strong>Critical condition:</strong> the <em>criteria</em> for "satisfactory vs unsatisfactory" must be clear in advance — otherwise the threat lacks bite and firms lack guidance.
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" class="part" data-marpit-pagination="47" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>

<h1 id="synthesis">Synthesis</h1>
<h1 id="comparison--summary">Comparison &amp; Summary</h1>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="48" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="comparison-table">Comparison table</h2>
<table>
<thead>
<tr>
<th>Alternative</th>
<th>Mechanism</th>
<th>Where used</th>
<th>Main weakness</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Competition for the market</strong></td>
<td>Bid for the exclusive franchise; auction sets price</td>
<td>Water, transport, concessions (developing econ.)</td>
<td>Incomplete contracts; asset transfer at re-tender; few bidders</td>
</tr>
<tr>
<td><strong>Contestability</strong></td>
<td><em>Threat</em> of hit-and-run entry disciplines incumbent</td>
<td>Airlines/trucking (&quot;capital on wheels&quot;)</td>
<td>Fails with sunk costs &amp; entry lags → not real utilities</td>
</tr>
<tr>
<td><strong>State ownership</strong></td>
<td>Public firm directed to serve public interest</td>
<td>EU rail/energy, US water, many LDCs</td>
<td>Fuzzy goals, political interference, soft budget, weak monitoring</td>
</tr>
<tr>
<td><strong>Ex post competition law</strong></td>
<td>Intervene only on proven abuse of dominance</td>
<td>NZ 1990s (failed); EU as complement</td>
<td>Slow, case-by-case; courts poor at price-setting; not efficient</td>
</tr>
<tr>
<td><strong>&quot;Deregulation&quot;</strong></td>
<td>Restructure; withdraw controls as competition grows</td>
<td>Telecoms, energy, gas (over 3 decades)</td>
<td>Timing the withdrawal; harder than regulating monopoly</td>
</tr>
<tr>
<td><strong>Negotiated settlements</strong></td>
<td>Utility + customers agree; regulator approves</td>
<td>US/Canada energy, Florida, California</td>
<td>Representation gaps; future consumers absent</td>
</tr>
</tbody>
</table>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="49" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="chapter-summary">Chapter summary</h2>
<div class="key">
None of the six is a clean, universal replacement for traditional regulation — but each matters, and the <strong>core-network vs competitive-activity</strong> split runs through all of them.
</div>
<ul>
<li><strong>Actively used:</strong> franchising (water/transport), state ownership (worldwide), and deregulation/restructuring (telecoms, energy) — though restructuring proved hard.</li>
<li><strong>Influential on design, not full substitutes:</strong> ex post competition law (suits developing-competition activities) and contestability (gave us SAC/incremental-cost price bounds).</li>
<li>State ownership is increasingly <strong>paired with</strong> an independent regulator — a sign it doesn't control conduct on its own.</li>
<li><strong>Rising interest:</strong> negotiated settlements, as an alternative to price-cap/rate-of-return regulation.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="Ch 3 · Alternatives to regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2" lang="en-GB" data-marpit-pagination="50" style="--paginate:true;--header:Ch 3 · Alternatives to regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:6bmytfg3wxp4r48bwu4wxaddbyfvktf9evltjwpnad2;" data-marpit-pagination-total="50">
<header>Ch 3 · Alternatives to regulation</header>
<h2 id="self-check-exam-style">Self-check (exam-style)</h2>
<div class="box">
<ol>
<li>Explain Demsetz's claim that scale economies are irrelevant to the number of bidders. What contracting problems undermine franchising as a <em>long-run</em> substitute for regulation?</li>
<li>State the perfect-contestability result and its three assumptions. Why does &quot;capital on wheels&quot; matter, and why are core networks not contestable?</li>
<li>Set out the principal–agent problems of state ownership. Why is state ownership increasingly combined with independent regulation?</li>
<li>Compare ex ante regulation with reliance on ex post competition law. Reference the essential-facilities doctrine, <em>Trinko</em>, and NZ/<em>Clear v Telecom</em>.</li>
<li>Describe the four stylised stages from monopoly to effective competition and the changing regulatory task. Why is &quot;deregulation&quot; a misnomer?</li>
<li>What are the advantages and representation concerns of negotiated settlements? How do they differ from private contracting?</li>
</ol>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
