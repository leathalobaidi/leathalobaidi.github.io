<header>Ch 10 · Telecommunications regulation</header>
<h2 id="learning-objectives">Learning objectives</h2>
<p>By the end of this chapter you should be able to:</p>
<ul>
<li>Explain the <strong>distinctive economic characteristics</strong> of telecoms — two-way connection, <strong>network externalities</strong>, rapid tech change and <strong>convergence</strong>.</li>
<li>Contrast the <strong>traditional PSTN</strong> (circuit switching, star topology) with <strong>IP-based Next-Generation Networks (NGNs)</strong>.</li>
<li>Describe the shift in the <strong>approach to regulation</strong>: rebalancing, ROR → price caps, ex ante + competition law, the <strong>SMP framework</strong>.</li>
<li>Apply the <strong>cost standards</strong> (TSLRIC / TELRIC / FL-LRIC) and <strong>price–cost tests</strong> used to set access prices.</li>
<li>Analyse <strong>one-way access</strong> (local-loop <strong>unbundling</strong>, the <strong>ladder of investment</strong>, <strong>access holidays</strong>) and <strong>two-way access</strong> (CPNP vs bill-and-keep, the <strong>waterbed effect</strong>).</li>
<li>Debate the live policy issues: <strong>net neutrality</strong>, <strong>universal service / the digital divide</strong>, and <strong>when to withdraw</strong> fixed-line regulation.</li>
</ul>
<div class="key"><b>Key terms preview:</b> PSTN · NGN · circuit vs packet switching · local loop · xDSL · FTTx · HFC · SMP · TSLRIC/TELRIC · LLU · ladder of investment · access holiday · CPNP · bill-and-keep · termination rate · competitive bottleneck · waterbed effect · net neutrality · universal service.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="4" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="telecoms-is-not-like-the-other-utilities">Telecoms is not like the other utilities</h2>
<div class="cols">
<div class="card">
<p><strong>Electricity, gas, water</strong><br />
A largely <strong>homogeneous, anonymous</strong> product flows <strong>one-way</strong> from production to the consumption point. Consumers don't care <em>which</em> electron arrives.</p>
</div>
<div class="card">
<p><strong>Telecommunications</strong><br />
The product is a <strong>two-way interconnection between identifiable parties</strong> — a call, a message, a shared web/video session — often <strong>across different networks</strong> with different characteristics.</p>
</div>
</div>
<div class="key">Because the product connects specific users (not just delivers a commodity), the network's job is <b>interconnection</b>, and quality depends on the transmission technology at <i>both</i> ends. Two calls over different technologies can be <b>heterogeneous products</b>.</div>
<div class="small">Shared traits with other utilities: large, sunk, immobile assets; economies of scale and scope.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="5" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="a-useful-analogy-telecoms-as-a-transport-industry">A useful analogy: telecoms as a transport industry</h2>
<div class="box">
<p>Just as <strong>freight and passenger trains</strong> of different sizes share one <strong>rail network</strong>, so <strong>data, voice and broadcasting &quot;packets&quot;</strong> increasingly share one <strong>telecoms network</strong>. And just as <strong>rail competes with road</strong>, <strong>fixed, cable and mobile networks</strong> increasingly compete with each other — so-called <strong>facilities-based (infrastructure) competition</strong>.</p>
</div>
<p><strong>Lesson.</strong> The modern industry has moved from <em>one network = one service</em> to <em>many services sharing common infrastructure</em>, and <em>several infrastructures competing</em>. This reframes both the economics and the regulation.</p>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="6" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="characteristic-1--network-externalities">Characteristic 1 · Network externalities</h2>
<div class="def"><b>Network externality:</b> the value of the network to any one user <b>rises</b> with the number of users connected to it (or reachable via interconnection). Also discussed as a "bandwagon effect".</div>
<ul>
<li>The 20th user gains from the first 19 being reachable — and adds value for them in turn.</li>
<li>Growth is self-reinforcing once penetration passes a threshold.</li>
</ul>
<div class="key"><b>The externality-surcharge idea.</b> Because each new subscriber benefits existing users, some regulators have <b>added an "externality surcharge" to access prices</b>. The extra access revenue is meant to fund <b>handset and subscription subsidies</b>, encouraging firms to cut subscription charges and grow the subscriber base (revisited under mobile termination).</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="7" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="characteristic-2--rapid-relentless-technological-change">Characteristic 2 · Rapid, relentless technological change</h2>
<ul>
<li>1994: ~<strong>2 million</strong> computers on the Internet. 2004: ~<strong>200 million</strong>. 2012: ~<strong>2.4 billion</strong> users.</li>
<li>Mobile users: ~<strong>1 billion</strong> (2002) → ~<strong>4 billion</strong> (2008).</li>
<li>New devices (smartphones, tablets) and new modes (SMS, VoIP, social media, video calls) keep appearing.</li>
</ul>
<div class="key">Consequence for regulation: cost of key inputs (digital switches, optical fibre) keeps <b>falling</b>. This favours <b>price-cap</b> regulation (pass on cost falls without endless rate hearings) — and makes it <b>hard to disentangle</b> the effect of regulation from the effect of technology.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="8" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="characteristic-3--convergence-supply-side">Characteristic 3 · Convergence (supply side)</h2>
<div class="def"><b>Convergence:</b> the shift from <b>different services on separate networks</b> (voice on PSTN, TV on cable, mobile voice on wireless) to <b>many services delivered over any of several networks</b>, thanks to digitisation and Internet Protocol (IP).</div>
<ul>
<li>The <strong>PSTN</strong> now carries voice <strong>and</strong> broadband data (and some broadcasting).</li>
<li><strong>Cable</strong> now carries TV <strong>and</strong> high-speed Internet <strong>and</strong> telephony.</li>
<li><strong>Mobile</strong> carries voice <strong>and</strong> data <strong>and</strong> Internet <strong>and</strong> broadcasting.</li>
</ul>
<div class="key">This lets operators sell <b>bundles</b> — "triple play" (fixed + Internet + TV) or "quadruple play" (adding mobile). It also drives <b>demand-side and supply-side substitutability</b>, the engine of inter-platform competition.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="9" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="characteristics-4--changing-demand">Characteristics 4 · Changing demand</h2>
<ul>
<li><strong>Fixed lines are declining</strong> — in the USA ~<strong>20%</strong> of consumers have &quot;cut the cord&quot;, relying only on mobile / VoIP.</li>
<li>Younger users <strong>substitute voice calls</strong> for instant messaging, e-mail and social networking.</li>
<li>Different data services need very different speeds: e-mail/browsing tolerate low speeds; video, IPTV and online gaming need <strong>10+ Mbps</strong> to be viable.</li>
<li>In many <strong>developing countries</strong>, mobile is a more effective route to communication than building fixed networks.</li>
</ul>
<div class="small">Separating the <b>network</b> from the <b>services</b> is the structural fact behind all of this — and behind the whole modern regulatory debate.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" class="part" data-marpit-pagination="10" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>

<h4 id="part-2">Part 2</h4>
<h1 id="network-architectures">Network architectures</h1>
<h4>PSTN vs NGN · switching · transmission media · services</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="11" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="the-traditional-pstn--%F0%9F%93%8A-fig-101">The traditional PSTN — <img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> Fig 10.1</h2>
<div class="def"><b>PSTN (Public Switched Telephone Network):</b> designed to carry <b>one-to-one human voice</b> efficiently. Its architecture reflects that single purpose.</div>
<p><strong>Star topology.</strong> Each user's <strong>local loop</strong> (last-mile wire) runs to a <strong>local exchange / central office</strong>. The exchange connects the caller's wire to the called party's wire.</p>
<ul>
<li>A <strong>second level of switching</strong> (<strong>tandem</strong> exchanges) links exchanges over long distances via a <strong>trunk network</strong> → intercity / interstate calls.</li>
<li><strong>Why a star, not a full mesh?</strong> Wiring every phone to every other phone would be astronomically costly and impractical. The star <strong>minimises transmission paths</strong> and cost.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="12" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="fig-101--pstn-star-topology-schematic">Fig 10.1 · PSTN star topology (schematic)</h2>
<div class="box">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>   Customer A        Customer B         Customer C        Customer D
       │                 │                  │                 │
   ┌───┴────┐        ┌───┴────┐         ┌───┴────┐       ┌────┴───┐
   │ Local  │        │ Local  │         │ Local  │       │ Local  │
   │Exchange│◄──────►│Exchange│         │Exchange│◄─────►│Exchange│
   └───┬────┘  (some └───┬────┘         └───┬────┘ direct└────┬───┘
       │    direct links │                  │       links     │
       │    exist)       │                  │                 │
    ┌──┴──────────────┐  │               ┌──┴──────────────┐  │
    │ TANDEM exchange │◄─┘               │ TANDEM exchange │◄─┘
    └─────────┬───────┘   ── trunk ──    └────────┬────────┘
              └────────────network─────────────────┘
</code></pre>
</div>
<div class="small"><b>Local loop</b> = the last-mile connection (often via a street cabinet). <b>Tandem</b> exchanges interconnect local exchanges over the long-distance <b>trunk</b> network. The star radiates from exchanges outward to customers.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="13" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="two-more-pstn-design-facts">Two more PSTN design facts</h2>
<div class="cols">
<div class="card">
<p><strong>Circuit switching</strong><br />
Set-up establishes a <strong>dedicated calling path</strong> that stays reserved for that one call until it's taken down. Once you have a dial tone, the path is unaffected by other users.<br />
<strong>Congestion</strong> only bites at <strong>set-up</strong> (no dial tone) — never mid-call.</p>
</div>
<div class="card">
<p><strong>Multiplexing</strong><br />
Combining multiple signals onto one path.</p>
<ul>
<li><strong>Frequency-division</strong> (analogue PSTN): each call gets a <em>fraction of the bandwidth</em> for the <em>whole</em> call.</li>
<li><strong>Time-division</strong> (digital): each call gets <em>all</em> the bandwidth for a <em>fraction</em> of the time.</li>
</ul>
</div>
</div>
<div class="small">Historically voice → electrical impulses over copper; long-distance trunk increasingly light signals over fibre-optic cable.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="14" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="the-next-generation-network-ngn">The Next-Generation Network (NGN)</h2>
<div class="def"><b>NGN:</b> a packet-based, IP network able to provide many services over multiple broadband, quality-of-service-enabled transport technologies, with service functions <b>independent of the underlying transport</b>. No single agreed definition — "often a vision more than a market concept" (OECD).</div>
<p>Three defining features vs the PSTN:</p>
<ol>
<li><strong>Digital</strong>, not analogue.</li>
<li><strong>Packet-based</strong> switching, not circuit-based.</li>
<li>Uses the <strong>Internet Protocol (IP)</strong> to route packets from source to destination.</li>
</ol>
<div class="key">"The ascendancy of IP networks is an architectural response to the ascendancy of data over voice." The old network was built for voice with data bolted on; the IP network is built for data — with voice as just another data stream. The transition is now seen as <b>inevitable</b>.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="15" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="switching-technologies--circuit-vs-packet">Switching technologies — circuit vs packet</h2>
<table>
<thead>
<tr>
<th></th>
<th><strong>Circuit switching</strong></th>
<th><strong>Packet switching (IP)</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Path</strong></td>
<td>Dedicated calling path per call</td>
<td>Packets share bandwidth; each finds its own route</td>
</tr>
<tr>
<td><strong>Bandwidth</strong></td>
<td>Reserved for the call's duration</td>
<td>Shared statistically → more efficient</td>
</tr>
<tr>
<td><strong>Data unit</strong></td>
<td>Continuous stream</td>
<td>Bits → &quot;packets&quot; with address + control info</td>
</tr>
<tr>
<td><strong>Congestion</strong></td>
<td>At set-up only (busy signal)</td>
<td>Anytime → <strong>latency</strong>, <strong>jitter</strong>, dropped packets</td>
</tr>
<tr>
<td><strong>Quality</strong></td>
<td>High, constant (good for voice)</td>
<td>Variable; needs management for real-time traffic</td>
</tr>
<tr>
<td><strong>Flexibility</strong></td>
<td>Tailored to one technology</td>
<td>Runs on <strong>any</strong> transmission medium</td>
</tr>
</tbody>
</table>
<div class="small">IP is a "connectionless protocol": each packet carries all it needs to be routed independently, then reassembled at the far end — like addressed envelopes.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="16" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="managing-packets--and-internet-telephony">Managing packets — and internet telephony</h2>
<div class="cols">
<div class="card">
<p><strong>Managed packet networks</strong><br />
Define <strong>classes of service</strong>; use <strong>prioritisation</strong> and <strong>traffic-shaping</strong> to separate time-sensitive voice from other traffic → low latency, high reliability.<br />
→ combine packet <strong>efficiency</strong> with circuit-like <strong>quality</strong>.</p>
</div>
<div class="card">
<p><strong>Internet telephony (&quot;over-the-top&quot; VoIP)</strong><br />
Skype, Vonage: convert voice to packets, send over the <strong>public Internet</strong> like any data.<br />
<strong>No router prioritises</strong> them. Congestion handled on a <strong>&quot;best-efforts&quot;</strong> basis — all packets treated alike, queued/dropped arbitrarily.</p>
</div>
</div>
<div class="key">In <b>low congestion</b>, over-the-top VoIP quality rivals managed networks. In <b>high congestion</b>, best-efforts delivery can degrade — hence latency and jitter. This distinction sits at the heart of the <b>net-neutrality</b> debate.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="17" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="transmission-media-1--copper-and-fibre">Transmission media (1) — copper and fibre</h2>
<div class="cols">
<div class="card">
<p><strong>Twisted copper pairs</strong><br />
Built for voice → <strong>limited bandwidth</strong> (a voice call needs only ~64 Kbps).<br />
<strong>xDSL</strong> upgrades copper into a high-speed digital line via modems at each end.<br />
Quality falls with distance from the exchange (ADSL ≈ up to ~2 miles).</p>
</div>
<div class="card">
<p><strong>Fibre-optic cable</strong><br />
Glass fibre carrying <strong>light</strong> signals → <strong>much greater bandwidth</strong>, faster speeds, streaming/HD.<br />
Standard on long-distance <strong>trunk</strong> routes; increasingly pushed into the <strong>local access</strong> network.<br />
Copper→fibre in the last mile is a <strong>major, costly, contentious</strong> policy issue.</p>
</div>
</div>
<div class="def"><b>xDSL family:</b> ADSL (asymmetric), HDSL, VDSL (very-high-rate). <b>"Naked DSL"</b> = a stand-alone data line with no PSTN voice — pair it with VoIP to make calls.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="18" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="transmission-media-2--cable-and-wireless">Transmission media (2) — cable and wireless</h2>
<div class="cols">
<div class="card">
<p><strong>Hybrid fibre coaxial (HFC)</strong> — cable<br />
Fibre runs from the <strong>cable headend</strong> to local <strong>nodes</strong> near clusters of homes; <strong>coaxial cable</strong> covers the last stretch to each premises.<br />
The <strong>DOCSIS</strong> standard let cable add data/Internet → cable firms became major telecoms rivals.</p>
</div>
<div class="card">
<p><strong>Wireless / mobile</strong><br />
<strong>Radio spectrum</strong> (licensed) carries signals between a <strong>handset</strong> and the nearest <strong>base station</strong>; base stations link to a <strong>mobile switching centre</strong> via fibre or radio.<br />
Base stations can be <strong>shared</strong> by operators.</p>
</div>
</div>
<div class="key"><b>Convergence of media.</b> Telephone, cable and wireless are converging on a common shape: high-capacity <b>fibre to a node near users</b>, then copper, coax or radio for the last stretch. The distinctions between "types" of network are blurring.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="19" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="services-and-the-fttx-ladder">Services and the FTTx ladder</h2>
<div class="cols">
<div class="card">
<p><strong>Three service families</strong></p>
<ul>
<li><strong>Voice</strong> — fixed (PSTN), IP (managed VoIP + over-the-top), mobile.</li>
<li><strong>Data</strong> — dial-up/narrowband (≤56 Kbps), <strong>broadband</strong> (&quot;always on&quot;: xDSL, cable modem, fibre), wireless (3G ~5 Mbps, 4G/LTE ~20–30 Mbps).</li>
<li><strong>Multimedia / broadcasting</strong> — cable TV, IPTV, video on demand.</li>
</ul>
</div>
<div class="card">
<p><strong>FTTx</strong> — how deep the fibre goes</p>
<ul>
<li><strong>FTTN</strong> — to the node</li>
<li><strong>FTTC</strong> — to the curb</li>
<li><strong>FTTB</strong> — to the basement/building</li>
<li><strong>FTTH</strong> — to the home</li>
</ul>
<p>The closer fibre gets to the user, the higher the speed (≈30–100+ Mbps).</p>
</div>
</div>
<div class="small">Regional pattern: xDSL led globally & in Europe; cable strong in the USA; fibre-to-home led in South Korea, Japan, Hong Kong.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="20" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="service-providers--who-competes">Service providers — who competes</h2>
<ul>
<li><strong>Incumbents:</strong> former fixed-line monopolies — <strong>AT&amp;T / Verizon</strong> (USA), <strong>BT</strong> (UK), <strong>France Télécom</strong>, <strong>Deutsche Telekom</strong>, <strong>Telstra</strong>.</li>
<li><strong>Cable companies:</strong> added telephone switching in the 1990s → <strong>Comcast, Time Warner Cable</strong> now among the world's largest fixed broadband providers.</li>
<li><strong>Mobile operators:</strong> typically an <strong>oligopoly</strong> of 3–4; number set by spectrum licences.</li>
<li><strong>MVNOs:</strong> own no spectrum — buy wholesale, resell retail.</li>
<li><strong>Others:</strong> satellite (Sky), OTT VoIP (Skype), IPTV (BBC iPlayer, Hulu).</li>
</ul>
<div class="key">Because of convergence, providers now overlap: cable firms sell phone + broadband; incumbents sell TV (AT&T U-Verse, BT Vision). Categorising by <b>technology</b> no longer maps cleanly to categorising by <b>service</b>.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="21" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="trading-arrangements--spectrum">Trading arrangements &amp; spectrum</h2>
<div class="cols">
<div class="card">
<p><strong>No commodity market</strong><br />
Unlike electricity/gas, telecoms has <strong>no wholesale commodity/capacity market</strong> — the &quot;product&quot; connects specific users, so it isn't tradeable in bulk.<br />
Wholesale trading centres instead on <strong>interconnection terms</strong> (regulated or negotiated).</p>
</div>
<div class="card">
<p><strong>Spectrum — the exception</strong><br />
Scarce radio spectrum <strong>is</strong> allocated capacity-style:</p>
<ul>
<li><strong>&quot;Beauty contests&quot;</strong> (business-plan comparison)</li>
<li><strong>Auctions</strong> (increasingly common; India's 3G auction raised ~<strong>$11bn</strong>)</li>
<li><strong>Secondary trading</strong> helps entrants access the market.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" class="part" data-marpit-pagination="22" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>

<h4 id="part-3">Part 3</h4>
<h1 id="approach-to-regulation">Approach to regulation</h1>
<h4>The four stages · rebalancing · ROR → price caps · SMP</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="23" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="the-1984-turning-point--att-break-up--mfj">The 1984 turning point — AT&amp;T break-up / MFJ</h2>
<div class="box">
<p>The <strong>1984 Modified Final Judgment (MFJ)</strong> — the outcome of a US antitrust action — is the industry's watershed. It <strong>required AT&amp;T to separate</strong> its activities, splitting off <strong>seven Regional Bell Operating Companies (RBOCs / &quot;Baby Bells&quot;)</strong> to run local calls, and opened <strong>long-distance, manufacturing and information services</strong> to competition.</p>
</div>
<ul>
<li>The MFJ split <strong>potentially competitive</strong> activities (long-distance) from <strong>non-competitive</strong> ones (local call network).</li>
<li>Result: long-distance capacity tripled; new backbones built; entrants adopted fibre faster than incumbent AT&amp;T.</li>
<li><strong>1996 Telecommunications Act</strong> completed the arc — federal push for local-call competition, mandatory <strong>unbundling</strong>, and <strong>TELRIC</strong> pricing.</li>
</ul>
<div class="small">Contrast: the UK privatised BT in 1984 <b>without</b> separation, pursuing a "duopoly policy" (Mercury) instead.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="24" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="four-stages-of-pstn-regulation">Four stages of PSTN regulation</h2>
<ol>
<li><strong>Statutory monopoly (pre-1980s).</strong> One PSTN operator, end-to-end responsibility, treated as a <strong>classic natural monopoly</strong>. Focus: <strong>retail prices</strong>, shaped by universal-service and cross-subsidy politics.</li>
<li><strong>Transition to competition (mid-1980s→).</strong> Encourage entry (US long-distance) or a <strong>duopoly</strong> (UK, Australia). Regulator must now set <strong>interconnection</strong> terms.</li>
<li><strong>Competition in all activities (mid-1990s→).</strong> Open even the <strong>local loop</strong>. Two premises: the network is <strong>no longer a natural monopoly</strong>, and the incumbent holds <strong>SMP over essential elements</strong> that must be <strong>unbundled</strong>.</li>
<li><strong>Selective withdrawal (later).</strong> Where competition is effective (often urban), regulate <strong>only</strong> the specific services where the incumbent still has dominance; <strong>withdraw</strong> elsewhere (e.g. UK removed BT retail price controls in <strong>2006</strong>).</li>
</ol>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="25" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="rebalancing-tariffs">Rebalancing tariffs</h2>
<div class="def"><b>Tariff rebalancing:</b> unwinding the historical cross-subsidies of the monopoly era, so prices move toward the underlying costs of each service.</div>
<p><strong>The old monopoly pricing structure:</strong></p>
<ul>
<li><strong>Low</strong> line rentals (to boost penetration / universal service).</li>
<li><strong>Low</strong> local call charges (affordable, geographically uniform).</li>
<li><strong>High</strong> long-distance and international charges (to subsidise the above).</li>
</ul>
<div class="key">Restructuring drove <b>rebalancing</b>: subscription/rental charges <b>rose</b>, and long-distance & international charges <b>fell sharply</b>. Cross-subsidy of local by long-distance calls shrank. This is one of the clearest, most robust effects of reform.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="26" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="from-rate-of-return-to-price-caps">From rate-of-return to price caps</h2>
<div class="cols">
<div class="card">
<p><strong>Why ROR faded</strong><br />
By 2007 only <strong>3 US states</strong> and <strong>5 of 21</strong> developing/transitional countries still used ROR.<br />
ROR suits stable costs; telecoms costs <strong>fall fast</strong> with technology.</p>
</div>
<div class="card">
<p><strong>Why price caps won</strong></p>
<ul>
<li>Cost falls (digital switches, fibre) <strong>pass through</strong> without constant rate hearings.</li>
<li>Simpler tariff review, lower admin cost.</li>
<li>Seen as the <strong>bridge</strong> to eventual competition and deregulation.</li>
</ul>
</div>
</div>
<div class="key"><b>The telecoms twist.</b> Price-cap regulation elsewhere sets the revenue requirement via the <b>building-block</b> approach. In telecoms it is typically based on the <b>long-run incremental cost</b> of supplying the relevant services — because unbundling requires a price per network <b>element</b>, not per firm.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="27" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="ex-ante-regulation--competition-law--smp">Ex ante regulation + competition law + SMP</h2>
<div class="cols">
<div class="card">
<p><strong>Two tools side by side</strong><br />
Sector-specific <strong>ex ante</strong> rules run alongside <strong>ex post competition law</strong> (notably the <strong>essential-facilities</strong> doctrine). The EU framework is <strong>modelled on competition-law concepts</strong>.</p>
</div>
<div class="card">
<p><strong>Where they clash</strong></p>
<ul>
<li><strong>EU:</strong> rates approved by a national regulator can <strong>still</strong> be found anti-competitive (e.g. margin-squeeze cases).</li>
<li><strong>USA:</strong> once rates are regulated, antitrust scope is <strong>narrower</strong> (<em>Trinko</em>).</li>
</ul>
</div>
</div>
<div class="def"><b>SMP framework (EU), three steps:</b> (1) define markets <b>susceptible to ex ante regulation</b>; (2) assess whether any operator holds <b>Significant Market Power</b>; (3) impose <b>remedies</b> on SMP holders (access, transparency, cost-orientation, accounting separation, non-discrimination).</div>
<div class="small">Regulation is being <b>trimmed</b>: EU pre-identified markets fell from 18 (2002) to 8 (2007), with proposals for just 4. Cable and mobile face much lighter regulation than the PSTN.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" class="part" data-marpit-pagination="28" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>

<h4 id="part-4">Part 4</h4>
<h1 id="price-controls--cost-standards">Price controls &amp; cost standards</h1>
<h4>Price caps · price–cost tests · TSLRIC / TELRIC / FL-LRIC</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="29" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="cost-standards-for-network-elements">Cost standards for network elements</h2>
<div class="def"><b>LRIC family:</b> set access prices at the <b>forward-looking long-run incremental cost</b> a <b>new efficient operator</b> would incur — replicating a competitive-market outcome.</div>
<table>
<thead>
<tr>
<th>Standard</th>
<th>Where</th>
<th>Captures</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>FL-LRIC</strong> (forward-looking)</td>
<td>Europe</td>
<td>Incremental cost of services, forward-looking</td>
</tr>
<tr>
<td><strong>TELRIC</strong> (total <strong>element</strong> LRIC)</td>
<td>USA, Japan</td>
<td>Cost of network <strong>elements</strong> (e.g. switches)</td>
</tr>
<tr>
<td><strong>TSLRIC</strong> (total <strong>service</strong> LRIC)</td>
<td>Australia, NZ</td>
<td>Cost of the whole <strong>service</strong> using a facility</td>
</tr>
</tbody>
</table>
<div class="key"><b>Twin goals:</b> let the incumbent <b>recover efficient costs</b> (capital + operating), while sending entrants an efficient <b>"make-or-buy" signal</b> — build your own, or buy access, whichever is genuinely cheaper. FL-LRIC and TSLRIC are effectively the same; TELRIC differs mainly in treating element-level vs service-level common costs.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="30" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="applying-tslric--five-steps">Applying TSLRIC — five steps</h2>
<ol>
<li><strong>Total costs</strong> of an entire service (e.g. unbundled local loop) — both internal use and external sales.</li>
<li><strong>Long-run</strong> basis → include <strong>capital</strong> costs, not just operating costs.</li>
<li><strong>Incremental</strong> = extra cost of producing the service vs not producing it.</li>
<li>Add an allowance for <strong>joint &amp; common costs</strong> → <strong>&quot;LRIC+&quot;</strong>.</li>
<li><strong>Divide by demand</strong> → an <strong>average</strong> per-unit cost (per loop/minute), <strong>not</strong> marginal cost.</li>
</ol>
<div class="key"><b>Two contentious assumptions:</b> (1) costs are based on the <b>replacement cost of a hypothetical efficient operator</b>, not the actual firm; (2) assets are <b>optimised</b> to the most efficient modern technology. "Bottom-up" (engineering) and "top-down" (accounting) models are used to estimate them.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="31" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="the-joint-and-common-cost-problem">The joint-and-common-cost problem</h2>
<div class="box">
<p>Much telecoms capital — switches, exchanges, links — is <strong>shared across many services</strong>. Newbery estimated BT's <strong>joint and common costs at ~80% of all costs</strong> (1995). So <strong>how you allocate</strong> those shared costs among services largely <strong>determines</strong> each element's price — and any allocation rule is, economically, somewhat <strong>arbitrary</strong>.</p>
</div>
<ul>
<li>This is why LRIC+ must <strong>add back</strong> an allowance for common costs — and why the add-back is always disputed.</li>
<li>It also motivates <strong>cost-orientation</strong> requirements and <strong>price–cost tests</strong> (next), used where formal price caps have been lifted but prices must still be justified.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="32" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="box-101--price%E2%80%93cost-tests--contestable-markets-theory">Box 10.1 · Price–cost tests &amp; contestable-markets theory</h2>
<div class="box">
<p><strong>Idea.</strong> Contestable-markets theory has limited direct use in utilities (sunk costs make entry/exit threats weak). But two of its cost concepts survive as <strong>price ceilings and floors</strong>:</p>
<ul>
<li><strong>Stand-Alone Cost (SAC)</strong> = cost of supplying a service (or group) <strong>on its own</strong> → a <strong>ceiling</strong> (prices above it look excessive / cross-subsidising).</li>
<li><strong>Incremental cost</strong> = extra cost of adding that service → a <strong>floor</strong>.</li>
</ul>
<p><strong>Example.</strong> UK Ofcom's <strong>Distributed Stand-Alone Cost (DSAC)</strong> test judges whether BT's prices for specific components (trunk access, wholesale Ethernet) are <strong>&quot;cost-oriented&quot;</strong>: prices should sit <strong>between LRIC and the SAC ceiling</strong>. In 2012 a DSAC-based analysis led Ofcom to order <strong>BT to repay £94m</strong>.</p>
</div>
<div class="key"><b>Lesson.</b> The tests are <b>controversial and hard to apply well</b>. Faulhaber's key insight: SAC must be applied to <b>every combination</b> of services — with 31 shared-cost products that's <b>over a billion tests</b>. They are highly discretionary, invite rent-seeking (a "full-employment bill for economists"), and rely on the actual firm's accounts rather than a true hypothetical efficient operator — so don't lean on them too heavily.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" class="part" data-marpit-pagination="33" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>

<h4 id="part-5">Part 5</h4>
<h1 id="one-way-access--unbundling">One-way access &amp; unbundling</h1>
<h4>LLU · ladder of investment · make-or-buy · access holidays</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="34" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="local-loop-unbundling-llu">Local-loop unbundling (LLU)</h2>
<div class="def"><b>Local-loop unbundling (LLU):</b> requiring the incumbent to <b>share access</b> to the last-mile copper (the local loop) with entrants on reasonable, regulated terms — because it is treated as an <b>essential facility</b> the incumbent has SMP over.</div>
<p><strong>Three routes to competition it enables:</strong></p>
<div class="cols3">
<div class="card"><b>Facilities-based</b><br />Entrant builds <b>all</b> its own infrastructure — full head-to-head.</div>
<div class="card"><b>Quasi-facilities</b><br />Entrant builds <b>some</b>, buys unbundled elements (esp. the copper loop) for the rest.</div>
<div class="card"><b>Resale</b><br />Minimal investment; buys wholesale and resells retail under its own brand.</div>
</div>
<div class="small">US 1996 Act used a "necessary and impair" standard (not strict essential-facilities); EU pursued LLU via Directives (EC/2887/2000, effective 2001). UK required BT to unbundle in 1999.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="35" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="the-ladder-of-investment--stepping-stone-hypothesis">The ladder of investment / stepping-stone hypothesis</h2>
<div class="def"><b>Ladder of investment (Europe) / stepping-stone (USA):</b> cheap regulated access is the <b>first rung</b>. Entrants start with resale/quasi-facilities, build a customer base, then <b>climb</b> toward full facilities-based competition, investing in their own infrastructure over time.</div>
<p><strong>The make-or-buy decision.</strong> Access priced at true LRIC should give the entrant an efficient choice: <strong>build</strong> where that's cheaper, <strong>buy</strong> where it isn't.</p>
<div class="key"><b>The tension.</b> If access is priced <b>too low</b>, entrants never climb — they stay renting the incumbent's network, and <b>neither side invests</b>. The ladder can become a <b>trap</b>. This is the central empirical controversy of the chapter.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="36" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="investment-effects--the-case-against-unbundling">Investment effects — the case against unbundling</h2>
<ul>
<li><strong>Incumbent incentives dulled.</strong> Why invest if rivals can share the benefit without the risk? Constant <strong>asset optimisation and re-valuation</strong> under TELRIC can also <strong>under-recover</strong> past investment.</li>
<li><strong>Entrant incentives dulled.</strong> Renting unbundled elements in <strong>small increments, short durations</strong> means entrants bear <strong>no sunk cost</strong> — cheaper to keep buying than to build (Pindyck: an asymmetric risk/return split not priced into the access rate).</li>
<li><strong>USA:</strong> below-cost element prices spawned a <strong>CLEC &quot;gold-rush&quot; (late 1990s)</strong>, then <strong>bankruptcies and consolidation (early 2000s)</strong>.</li>
</ul>
<div class="key">Many now attribute the later rise of US facilities-based competition <b>not</b> to unbundling but to <b>asymmetric regulation of cable</b> (never forced to share), <b>new wireless entrants</b>, and a general <b>retreat from mandatory unbundling</b>, especially for fibre.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="37" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="access-holidays--regulatory-holidays-for-nga">Access holidays / regulatory holidays for NGA</h2>
<div class="cols">
<div class="card">
<p><strong>Access / regulatory holiday</strong><br />
Regulator <strong>commits not to impose</strong> sharing/access obligations on <strong>new</strong> infrastructure for a set (or unspecified) period — a <strong>time-limited right to refuse</strong> access. Proposed by Gans &amp; King to spur risky fibre investment. Holiday needs to be <strong>long</strong> (≥ ~6 yrs) to work.</p>
</div>
<div class="card">
<p><strong>Regulatory forbearance</strong><br />
Regulator agrees <strong>not to regulate</strong> specific services, but with <strong>no fixed time-frame</strong> — doesn't rule out future regulation. <strong>US FCC</strong> has forborne on fibre/IP networks since <strong>2003</strong>.</p>
</div>
</div>
<div class="key"><b>The NGA trade-off.</b> Encourage large, risky investment in next-generation access (fibre) <b>now</b> vs capture short-term price/access benefits <b>later</b>. Other tools: add a <b>risk premium</b> to the cost of capital (EU preference); public <b>subsidies</b>/co-investment (broadband as a quasi-public good).</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="38" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="box-103--the-controversy-over-regulatory-holidays-in-europe">Box 10.3 · The controversy over regulatory holidays in Europe</h2>
<div class="box">
<p><strong>Example.</strong> Germany's 2007 Telecommunications Act amendment defined <strong>&quot;new markets&quot;</strong> and tried to <strong>exempt Deutsche Telekom</strong> from having to provide wholesale access to its new <strong>VDSL</strong> network — a de facto regulatory holiday.</p>
<p><strong>Outcome.</strong> The <strong>European Commission challenged</strong> it as incompatible with the EU common framework, and the <strong>European Court of Justice deemed it unlawful (2009)</strong>. The EC's position: Digital-Agenda broadband goals are best met by the <strong>standard regulatory approach</strong>, <strong>not</strong> holidays. &quot;Any suggestion of regulatory forbearance in Europe has been soundly dismissed&quot; (OECD).</p>
</div>
<div class="key"><b>Lesson.</b> The USA and EU diverge sharply. The US <b>forbears</b> on fibre to spur investment; the EU <b>rejects holidays</b>, keeps unbundling and the ladder-of-investment philosophy, and instead offers a cost-of-capital premium. Contrast: Brazil committed to a <b>~9-year</b> broadband holiday to 2021.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" class="part" data-marpit-pagination="39" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>

<h4 id="part-6">Part 6</h4>
<h1 id="two-way-interconnection">Two-way interconnection</h1>
<h4>Termination rates · CPNP vs bill-and-keep · bottlenecks · waterbed</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="40" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="the-termination-monopoly-problem">The termination monopoly problem</h2>
<div class="def"><b>Call termination:</b> the service of <b>completing a call on the recipient's network</b>. To reach a given subscriber you <b>must</b> use their network — that network is a <b>monopoly over terminating calls to that person</b>.</div>
<ul>
<li>One-way access (unbundling) was about the <strong>local loop bottleneck</strong>.</li>
<li>Two-way access is about networks that <strong>compete for subscribers</strong> but <strong>must buy termination from each other</strong> to complete calls end-to-end.</li>
<li>The terminating network can exploit this to <strong>charge excessive</strong> termination rates.</li>
</ul>
<div class="small">This shapes the regulation of <b>mobile</b> and <b>fixed</b> termination — and depends critically on <b>who pays</b> for a call.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="41" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="cpnp-vs-bill-and-keep">CPNP vs bill-and-keep</h2>
<table>
<thead>
<tr>
<th></th>
<th><strong>CPNP</strong> (Calling-Party-Network-Pays)</th>
<th><strong>Bill-and-keep (BAK)</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Mechanism</strong></td>
<td>Originating network <strong>pays</strong> the terminating network per minute</td>
<td>Each network <strong>terminates the other's calls free</strong></td>
</tr>
<tr>
<td><strong>Best when</strong></td>
<td>—</td>
<td>Traffic roughly <strong>balanced</strong> both ways</td>
</tr>
<tr>
<td><strong>Termination monopoly?</strong></td>
<td><strong>Yes</strong> — needs regulation of rates</td>
<td><strong>Sidestepped</strong> — no charge to inflate</td>
</tr>
<tr>
<td><strong>Retail pairing</strong></td>
<td><strong>Calling Party Pays (CPP)</strong></td>
<td>Often flat-rate / receiver-inclusive</td>
</tr>
<tr>
<td><strong>Used in</strong></td>
<td>EU, Australia, most OECD</td>
<td>USA, Canada, Singapore, China, Hong Kong</td>
</tr>
<tr>
<td><strong>Rate regulation</strong></td>
<td>Mobile termination rates <strong>regulated</strong> (LRIC/LRIC+)</td>
<td>Generally <strong>no</strong> direct rate regulation</td>
</tr>
</tbody>
</table>
<div class="key">A third model — <b>Receiving-Party-Network-Pays (RPNP)</b>, paired with <b>Receiving Party Pays (RPP)</b> at retail — is theoretically possible but <b>used nowhere in the world</b>. Evidence: BAK countries (USA, Singapore) show <b>higher usage</b> and <b>lower price-per-minute</b> than CPNP countries.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="42" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="box-102--bottlenecks-and-waterbeds-1">Box 10.2 · Bottlenecks and waterbeds (1)</h2>
<div class="def"><b>Competitive bottleneck:</b> a setting where networks <b>compete for subscribers</b> yet each must <b>buy access (termination) from the other</b>. Analysed by Armstrong (1996/98) and Laffont–Rey–Tirole (1998).</div>
<div class="box">
<p><strong>Key insight.</strong> Even with fierce competition <strong>for subscribers</strong>, freely negotiated <strong>access charges can be used as an instrument of collusion</strong> — pushing retail prices as high as under monopoly (given symmetry + product differentiation).</p>
<p><strong>Why it mattered.</strong> (1) It explained why access prices stayed <strong>high despite competition</strong>. (2) It <strong>demolished</strong> the then-popular idea that competition would make regulation obsolete — wholesale access may need <strong>permanent oversight</strong> even in competitive retail markets.</p>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="43" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="box-102--bottlenecks-and-waterbeds-2--the-waterbed-effect">Box 10.2 · Bottlenecks and waterbeds (2) — the waterbed effect</h2>
<div class="def"><b>Waterbed effect:</b> when regulation <b>cuts</b> a network's wholesale access (termination) revenue, the operator <b>rebalances</b> — raising <b>retail</b> prices (or cutting handset subsidies) to recoup the loss. Press down one side, the other rises.</div>
<div class="box">
<p><strong>Two-sided logic.</strong> Termination revenue often <strong>cross-subsidises</strong> the retail side (subsidised handsets, cheap subscriptions to win users). Cut termination rates and that subsidy must be <strong>clawed back</strong> from subscribers — so lower wholesale prices may <strong>not</strong> mean lower retail prices or higher welfare.</p>
<p><strong>Evidence (Genakos &amp; Valletti, 20 countries).</strong> A regulated <strong>~10% cut</strong> in mobile termination rates led to a <strong>~5% rise</strong> in retail prices — a <strong>strong but incomplete</strong> waterbed. Operators retain some rents via market power.</p>
</div>
<div class="key"><b>Lesson.</b> Regulators disagree: the UK Competition Commission (2012) accepted a strong, incomplete waterbed and doubted that cutting rates to LRIC would lower retail prices; the EC and Australia questioned the effect and pushed rates toward <b>"pure LRIC"</b> (no common-cost allowance) anyway.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="44" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="internet-interconnection--why-no-termination-monopoly">Internet interconnection — why no termination monopoly</h2>
<div class="cols">
<div class="card">
<p><strong>Peering</strong><br />
Two ISPs agree to <strong>exchange each other's traffic</strong>, often <strong>without payment</strong>.</p>
</div>
<div class="card">
<p><strong>Transit</strong><br />
One ISP agrees to <strong>carry traffic to third parties</strong>, usually <strong>for a fee</strong>.</p>
</div>
</div>
<div class="key">Internet backbone access is set by <b>private negotiation, no regulator</b>. Because a snubbed ISP can still reach any customer via an <b>indirect transit</b> route, the <b>termination monopoly of circuit networks does not arise</b>. As networks converge on IP, a live question is whether termination should keep its <b>cost-based</b> pricing or move to the Internet's <b>peering/transit</b> model — and the EC and FCC lean toward the latter.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" class="part" data-marpit-pagination="45" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>

<h4 id="part-7">Part 7</h4>
<h1 id="policy-issues">Policy issues</h1>
<h4>Net neutrality · universal service · NGA · when to withdraw</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="46" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="net-neutrality--the-core-question">Net neutrality — the core question</h2>
<div class="def"><b>Net neutrality:</b> whether all Internet traffic <b>is / should be treated equally</b> by network operators, vs allowing ISPs to manage, discriminate, or charge for prioritising traffic.</div>
<div class="cols">
<div class="card">
<p><strong>ISPs' case for management</strong><br />
&quot;Reasonable&quot; traffic management is <strong>essential</strong> — prioritise <strong>latency-sensitive</strong> traffic (IPTV, voice, video) so it stays viable in congestion; block <strong>illegal</strong> content.</p>
</div>
<div class="card">
<p><strong>Neutrality supporters</strong> (Google, Facebook, civil-liberty groups)<br />
Without rules, ISPs will <strong>discriminate against rivals</strong> — a fixed operator throttling Skype; a cable operator throttling Netflix/BitTorrent. Neutrality <strong>subsidised content creation</strong> and fuelled the Internet's success.</p>
</div>
</div>
<div class="small">Disputed practices: <b>blocking</b>, <b>throttling</b> (slowing), <b>degrading</b>, or <b>prioritising</b> particular content, apps or services.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="47" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="net-neutrality--paid-prioritisation--access-tiering">Net neutrality — paid prioritisation &amp; access tiering</h2>
<div class="def"><b>Access tiering / paid prioritisation:</b> ISPs charging <b>content providers</b> for a <b>"fast lane"</b> — premium/priority delivery above the "free" best-efforts Internet.</div>
<div class="cols">
<div class="card">
<p><strong>For</strong> (in absence of market power)<br />
Price differentiation is <strong>welfare-enhancing</strong>; helps ISPs <strong>recover</strong> broadband investment; enables <strong>high-value services</strong> currently drowned out by low-value traffic congestion.</p>
</div>
<div class="card">
<p><strong>Against</strong><br />
Access prices set <strong>above optimal</strong>; <strong>foreclosure</strong> of independent content by vertically integrated ISPs; the &quot;free&quot; lane deliberately <strong>degraded</strong> to coerce providers into paying — a de facto Internet toll (Economides: ISPs may even <strong>create congestion</strong>).</p>
</div>
</div>
<div class="small">Regulators: FCC 2010 Order (disclose; no blocking; no unreasonable discrimination) — <b>struck down 2014</b>, then re-proposed. Similar rules in France, Chile, Netherlands, Canada. EU focus: <b>transparency/disclosure</b>. On "specialised services" the FCC took a <b>"wait and see"</b> line.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="Ch 10 · Telecommunications regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu" lang="en-GB" data-marpit-pagination="48" style="--paginate:true;--header:Ch 10 · Telecommunications regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:jwh4uxfrkr9vtqa7bgrrra7bch0giabhj33rgbej0teu;" data-marpit-pagination-total="58">
<header>Ch 10 · Telecommunications regulation</header>
<h2 id="universal-service--the-digital-divide">Universal service &amp; the digital divide</h2>
<div class="def"><b>Universal service obligation (USO):</b> a duty on a designated provider to supply basic service to <b>all</b> citizens/households, <b>anywhere</b>, at an <b>affordable</b> (often geographically uniform) price — historically <b>voice only</b>.</div>
<ul>
<li>The live question: <strong>should broadband be added</strong> to the USO?</li>
<li>Fibre investment concentrates in <strong>dense urban</strong> areas → risk of a <strong>&quot;broadband gap&quot; / &quot;digital divide&quot;</strong> between urban and rural users.</li>
<li><strong>EU (since 2002):</strong> access to voice, data and <strong>&quot;functional Internet access&quot;</strong>.</li>
<li><strong>USA (2010 National Broadband Plan):</strong> every location should have affordable broadband — <strong>≥4 Mbps down, ≥1 Mbps up</strong>.</li>
<li>Israel, Finland, Malta, Spain, Switzerland have added broadband to their USO.</li>
</ul>
<div class="small">Historic USO funding: cross-subsidy of local by long-distance calls, and of residential by business users.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
