<h4 id="theme-1">Theme 1</h4>
<h1 id="foundations">Foundations</h1>
<h4 id="the-economic-bedrock-of-why-utilities-are-special">The economic bedrock of why utilities are special</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="4" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="foundations--market-structure">Foundations — market structure</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Natural monopoly</strong> — one firm supplies the whole market more cheaply than several could.</li>
<li><strong>Subadditivity</strong> — a single firm's cost of total output is below the sum of any split among firms; the true test of natural monopoly.</li>
<li><strong>Economies of scale</strong> — average cost falls as output rises.</li>
<li><strong>Economies of scope</strong> — cheaper to produce two goods together than separately.</li>
<li><strong>Economies of density</strong> — unit cost falls as more customers share the same fixed network.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Sunk costs</strong> — spending that cannot be recovered on exit; a barrier to entry and to contestability.</li>
<li><strong>Sustainability</strong> — a monopoly's ability to hold prices that deter entry without losing money.</li>
<li><strong>Cream-skimming</strong> — entrants target only the profitable customers, undermining averaged prices.</li>
<li><strong>Hold-up</strong> — one party under-invests fearing the other will later exploit its sunk commitment.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="5" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="foundations--efficiency--welfare">Foundations — efficiency &amp; welfare</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Allocative efficiency</strong> — output where price equals marginal cost; no gains from trade left unrealised.</li>
<li><strong>Productive efficiency</strong> — producing at least cost for the output chosen.</li>
<li><strong>Dynamic efficiency</strong> — efficient innovation and investment over time.</li>
<li><strong>X-inefficiency</strong> — slack: costs above the minimum because monopoly removes competitive pressure.</li>
<li><strong>Cost efficiency</strong> — umbrella term for producing output at minimum feasible cost.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Deadweight loss</strong> — welfare destroyed when price above marginal cost cuts output below the efficient level.</li>
<li><strong>Consumer surplus</strong> — value consumers get above the price they pay.</li>
<li><strong>Producer surplus</strong> — revenue a firm earns above its marginal costs.</li>
<li><strong>Total surplus</strong> — consumer plus producer surplus; the welfare pie regulators try to maximise.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="6" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="foundations--externalities--networks">Foundations — externalities &amp; networks</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Externality</strong> — a cost or benefit falling on third parties, not priced by the market.</li>
<li><strong>Environmental externality</strong> — pollution and emissions costs borne by society, e.g. electricity CO₂.</li>
<li><strong>Network externality</strong> — a user's value rises as more others join the same network.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Positive / negative network externality</strong> — joining benefits (positive) or congests/harms (negative) existing users.</li>
<li><strong>Complementary services</strong> — services worth more together, often across adjacent monopolies.</li>
<li><strong>Double-marginalisation</strong> — successive mark-ups by a vertical chain push price above the monopoly optimum.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" class="part" data-marpit-pagination="7" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>

<h4 id="theme-2">Theme 2</h4>
<h1 id="why-we-regulate">Why we regulate</h1>
<h4 id="normative-rationales-and-positive-theories">Normative rationales and positive theories</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="8" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="why-we-regulate-1">Why we regulate</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Economic regulation</strong> — rules constraining a firm's prices, conduct or entry to serve the public interest.</li>
<li><strong>Normative theory</strong> — regulation <em>ought</em> to correct market failure (natural monopoly, externalities).</li>
<li><strong>Positive theory</strong> — explains what regulation <em>actually</em> is and whose interests it serves.</li>
<li><strong>Public-interest rationale</strong> — regulate to lift welfare where competition cannot.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Capture theory</strong> — regulators come to serve the industry they oversee, not consumers.</li>
<li><strong>Interest-group theory</strong> — regulation is the outcome of competing groups lobbying for rents (Stigler, Peltzman, Becker).</li>
<li><strong>Regulation as long-term contract</strong> — a durable, adjustable bargain between state and firm under uncertainty.</li>
<li><strong>Destructive competition</strong> — the (weak) claim that unregulated rivalry is ruinously wasteful.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" class="part" data-marpit-pagination="9" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>

<h4 id="theme-3">Theme 3</h4>
<h1 id="pricing-principles">Pricing principles</h1>
<h4 id="getting-prices-right-in-a-monopoly">Getting prices right in a monopoly</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="10" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="pricing--the-benchmarks">Pricing — the benchmarks</h2>
<div class="key">
<strong>First-best (marginal-cost) rule:</strong> set price = marginal cost. Efficient, but a natural monopoly then fails to cover fixed costs — hence the search for second-best rules.
</div>
<div class="cols">
<div class="card">
<ul>
<li><strong>Marginal-cost / first-best pricing</strong> — price = MC; allocatively efficient but loss-making for a natural monopoly.</li>
<li><strong>Second-best pricing</strong> — best achievable prices once the break-even (or other) constraint binds.</li>
<li><strong>Average-cost pricing</strong> — price = average cost; breaks even but distorts consumption.</li>
<li><strong>Linear pricing</strong> — a single per-unit price with no fixed element.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Cross-subsidy</strong> — profits on one service fund below-cost pricing of another.</li>
<li><strong>Transfer subsidy</strong> — an explicit payment used to keep a loss-making service viable.</li>
<li><strong>Price discrimination</strong> — charging different prices to different buyers by willingness to pay.</li>
<li><strong>Demand-reflective pricing</strong> — prices that track how much each user values the service.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="11" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="pricing--ramsey--multi-product-rules">Pricing — Ramsey &amp; multi-product rules</h2>
<div class="def">
<strong>Ramsey–Boiteux rule:</strong> mark up each price above marginal cost <em>inversely to its demand elasticity</em> — $\dfrac{p_i - c_i}{p_i} = \dfrac{k}{\varepsilon_i}$ — to raise the needed revenue with least deadweight loss.
</div>
<div class="cols">
<div class="card">
<ul>
<li><strong>Ramsey–Boiteux pricing</strong> — welfare-optimal break-even prices: inverse-elasticity mark-ups.</li>
<li><strong>EPMU (equi-proportionate mark-up)</strong> — simpler rule adding the same proportional mark-up to every service.</li>
<li><strong>FDC (fully distributed costs)</strong> — accounting method allocating common costs by a chosen key.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Common / joint costs</strong> — costs shared across services that no single output causes.</li>
<li><strong>Stand-alone cost</strong> — the cost of producing a service entirely on its own (a price ceiling test).</li>
<li><strong>Incremental cost</strong> — the extra cost of adding one service to the mix (a price floor test).</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="12" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="pricing--tariffs--time">Pricing — tariffs &amp; time</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Two-part tariff</strong> — a fixed access charge plus a per-unit price; recovers fixed cost while pricing usage near MC.</li>
<li><strong>Non-linear pricing</strong> — per-unit price varies with quantity (blocks, declining rates).</li>
<li><strong>Optimal non-linear pricing</strong> — quantity-varying schedule that can raise welfare as a Pareto improvement.</li>
<li><strong>Block tariff</strong> — price steps by consumption band (increasing or decreasing block).</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Peak-load pricing</strong> — higher prices in high-demand periods to reflect capacity costs.</li>
<li><strong>Time-of-use / dynamic tariff</strong> — prices that vary by time of day or real-time conditions.</li>
<li><strong>Ramsey vs peak-load</strong> — Ramsey rations by elasticity; peak-load rations scarce capacity by period.</li>
<li><strong>Sustainable prices</strong> — a price set that covers cost and deters inefficient entry.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" class="part" data-marpit-pagination="13" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>

<h4 id="theme-4">Theme 4</h4>
<h1 id="price-control-forms">Price-control forms</h1>
<h4 id="how-regulators-actually-set-the-cap">How regulators actually set the cap</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="14" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="price-control--rate-of-return">Price control — rate of return</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Rate-of-return (cost-of-service) regulation</strong> — allow prices covering costs plus a fair return on the asset base.</li>
<li><strong>Rate base</strong> — the capital value on which the allowed return is earned.</li>
<li><strong>Rate case</strong> — the periodic proceeding that sets allowed revenue.</li>
<li><strong>Revenue requirement</strong> — total revenue a firm is permitted: operating costs + return on rate base.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Averch–Johnson effect</strong> — if the allowed return exceeds cost of capital, the firm over-invests in capital (&quot;gold-plating&quot;).</li>
<li><strong>Cost-plus contract</strong> — pays realised costs plus a margin; weak efficiency incentive.</li>
<li><strong>Regulatory lag</strong> — the gap between reviews; longer lag sharpens cost-cutting incentives.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="15" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="price-control--incentive-cap-regulation">Price control — incentive (cap) regulation</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Price-cap regulation</strong> — cap prices for a set period; the firm keeps savings it makes below the cap.</li>
<li><strong>RPI−X</strong> — cap that lets prices rise with inflation minus an efficiency factor X.</li>
<li><strong>X factor</strong> — the annual real price reduction the regulator expects from efficiency gains.</li>
<li><strong>RAB / RCV (regulatory asset base / capital value)</strong> — the regulated value of assets on which returns accrue.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Building-blocks approach</strong> — build allowed revenue from opex + return on RAB + depreciation + tax.</li>
<li><strong>Tariff-basket / weighted-average cap</strong> — cap on the average of a bundle of prices, not each one.</li>
<li><strong>Revenue cap</strong> — cap on total revenue rather than prices, insulating the firm from volume risk.</li>
<li><strong>Ratchet effect</strong> — firms hide efficiency, fearing the regulator will claw it back next period.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="16" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="price-control--sharing--benchmarking">Price control — sharing &amp; benchmarking</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Earnings / profit-sharing (sliding scale)</strong> — customers and firm split gains or losses beyond a band.</li>
<li><strong>Deadband</strong> — the range of outcomes shared 50/50 (or left with the firm) before sharing kicks in.</li>
<li><strong>Menu regulation</strong> — offer the firm a choice of contracts so it self-reveals its true costs.</li>
<li><strong>Yardstick competition</strong> — set a firm's allowed cost from the performance of comparable peers.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Benchmarking</strong> — compare firms' costs/efficiency to set targets.</li>
<li><strong>DEA (data envelopment analysis)</strong> — non-parametric frontier method for relative efficiency.</li>
<li><strong>COLS (corrected ordinary least squares)</strong> — regression-based efficiency frontier estimate.</li>
<li><strong>SFA (stochastic frontier analysis)</strong> — separates inefficiency from noise statistically.</li>
<li><strong>TFP (total factor productivity)</strong> — output-to-all-inputs ratio; drives the X factor.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" class="part" data-marpit-pagination="17" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>

<h4 id="theme-5">Theme 5</h4>
<h1 id="access--competition">Access &amp; competition</h1>
<h4 id="sharing-the-bottleneck-network">Sharing the bottleneck network</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="18" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="access--the-basics">Access — the basics</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Access</strong> — the right of a rival to use an incumbent's essential network.</li>
<li><strong>One-way access</strong> — an entrant buys access into a monopoly network to reach customers.</li>
<li><strong>Two-way access (interconnection)</strong> — networks terminate each other's traffic; each needs the other.</li>
<li><strong>Essential facility</strong> — an input a rival must have and cannot economically duplicate.</li>
<li><strong>(Competitive) bottleneck</strong> — control of a must-have facility conferring market power.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Access pricing</strong> — the charge for using another firm's network.</li>
<li><strong>Retail-minus</strong> — access price = retail price minus the incumbent's avoided retail cost.</li>
<li><strong>Opportunity cost of access</strong> — profit the incumbent forgoes by carrying a rival's traffic.</li>
<li><strong>Vertical integration / separation</strong> — whether the network owner also competes downstream, or is split off.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="19" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="access--the-pricing-rules">Access — the pricing rules</h2>
<div class="def">
<strong>ECPR (Baumol–Willig rule):</strong> access price = direct cost of access + the incumbent's opportunity cost (lost downstream margin) — so an entrant wins only if it is genuinely more efficient.
</div>
<div class="cols">
<div class="card">
<ul>
<li><strong>ECPR / Baumol–Willig rule</strong> — access price = incremental cost + opportunity cost of access.</li>
<li><strong>M-ECPR (market-adjusted ECPR)</strong> — ECPR benchmarked to competitive, not monopoly, retail margins.</li>
<li><strong>LRIC</strong> — long-run incremental cost of providing the access service.</li>
<li><strong>TSLRIC / TELRIC</strong> — total-service / total-element long-run incremental cost; forward-looking cost standards.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>SAC (stand-alone cost)</strong> — cost of the service on its own; the ceiling for an access charge.</li>
<li><strong>FL-LRIC</strong> — forward-looking LRIC, priced on efficient modern-equivalent assets.</li>
<li><strong>Make-or-buy decision</strong> — an entrant's choice to build its own facility or buy access.</li>
<li><strong>By-pass</strong> — a rival routes around the incumbent's network, constraining access prices.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="20" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="access--termination--interconnection">Access — termination &amp; interconnection</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Termination monopoly</strong> — each network monopolises delivery to its own subscribers.</li>
<li><strong>CPNP (calling-party-network-pays)</strong> — the caller's network pays the terminating network.</li>
<li><strong>RPNP (receiving-party-network-pays)</strong> — the called party's side bears termination cost.</li>
<li><strong>Bill-and-keep (BAK)</strong> — networks swap traffic and keep their own revenues; no termination charge.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Waterbed effect</strong> — cutting regulated termination rates pushes up other (retail) prices.</li>
<li><strong>Zero-charge access</strong> — reciprocal termination priced at zero.</li>
<li><strong>Network externality charge</strong> — access charge component reflecting the value new users add.</li>
<li><strong>Adjacent monopolies</strong> — separately-owned complementary bottlenecks whose pricing interacts.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="21" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="access--investment--entry-paths">Access — investment &amp; entry paths</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Ladder of investment</strong> — regulate so entrants climb from reselling toward building their own facilities.</li>
<li><strong>Stepping-stone hypothesis</strong> — access-based entry as a stage toward facilities-based competition.</li>
<li><strong>Access / regulatory holiday</strong> — a period of light or no access obligation to reward risky new investment.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Infrastructure (facilities-based) competition</strong> — rivals compete with their own networks.</li>
<li><strong>Service-based competition</strong> — rivals compete using access to the incumbent's network.</li>
<li><strong>Inter- / intra-platform competition</strong> — rivalry across different network technologies vs within one.</li>
<li><strong>Real-option value</strong> — the value of waiting; why irreversible network investment needs a risk premium.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" class="part" data-marpit-pagination="22" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>

<h4 id="theme-6">Theme 6</h4>
<h1 id="institutions">Institutions</h1>
<h4 id="who-regulates-and-can-we-trust-them">Who regulates, and can we trust them?</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="23" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="institutions-1">Institutions</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Independent regulator</strong> — an agency insulated from day-to-day political control.</li>
<li><strong>Ex ante regulation</strong> — set rules and prices <em>before</em> conduct occurs (utility-style).</li>
<li><strong>Ex post regulation</strong> — intervene <em>after</em> the fact via competition law.</li>
<li><strong>Regulatory capture</strong> — agency serves the regulated firm's interests over the public's.</li>
<li><strong>Light-handed regulation</strong> — minimal intervention, relying on monitoring and the threat to act.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Time-inconsistency</strong> — a policy optimal today the regulator is later tempted to abandon.</li>
<li><strong>Credible commitment</strong> — binding the regulator so investors trust prices won't be expropriated.</li>
<li><strong>Expropriation of sunk investment</strong> — clawing back returns once capital is committed; deters investment.</li>
<li><strong>Quis custodiet ipsos custodes?</strong> — &quot;who guards the guardians?&quot;: the accountability problem for regulators.</li>
<li><strong>Negotiated settlement</strong> — regulator brokers an agreed outcome between firm and stakeholders.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" class="part" data-marpit-pagination="24" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>

<h4 id="theme-7">Theme 7</h4>
<h1 id="finance">Finance</h1>
<h4 id="paying-for-capital">Paying for capital</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="25" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="finance--cost-of-capital">Finance — cost of capital</h2>
<div class="def">
<strong>WACC:</strong> the return a regulated firm must earn on its RAB, blending debt and equity — $\text{WACC} = \dfrac{E}{V}\,r_e + \dfrac{D}{V}\,r_d(1-t)$, with $r_e$ from CAPM.
</div>
<div class="cols">
<div class="card">
<ul>
<li><strong>Cost of capital</strong> — the return investors require to fund the firm's assets.</li>
<li><strong>WACC</strong> — weighted average cost of debt and equity; the allowed return on the RAB.</li>
<li><strong>CAPM</strong> — prices equity return as risk-free rate + beta × equity risk premium.</li>
<li><strong>Gearing</strong> — the ratio of debt to total capital (leverage).</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>DCF (discounted cash flow)</strong> — values assets as the present value of expected future cash.</li>
<li><strong>DORC / ORC</strong> — depreciated / gross optimised replacement cost; a modern-equivalent asset valuation.</li>
<li><strong>RCV / RAB</strong> — regulatory capital value / asset base; the value on which returns are set.</li>
<li><strong>Modigliani–Miller</strong> — in ideal markets, capital structure doesn't change firm value (&quot;flight from equity&quot; caveats aside).</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" class="part" data-marpit-pagination="26" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>

<h4 id="theme-8">Theme 8</h4>
<h1 id="industry-specific-concepts">Industry-specific concepts</h1>
<h4 id="electricity--gas--telecoms--water">Electricity · gas · telecoms · water</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="27" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="industry--electricity--gas">Industry — electricity &amp; gas</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>LMP / nodal pricing</strong> — locational marginal price; energy priced at each network node reflecting losses and congestion.</li>
<li><strong>Zonal pricing</strong> — a coarser version pricing energy by zone rather than node.</li>
<li><strong>Electricity pool</strong> — a centralised wholesale market clearing generation against demand.</li>
<li><strong>Missing-money problem</strong> — energy-only markets under-reward capacity, starving investment.</li>
<li><strong>Capacity market</strong> — a payment stream for available capacity to fix the missing-money gap.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Entry-exit tariff</strong> — gas transport charged on entering and exiting the network, not point-to-point.</li>
<li><strong>Postage-stamp / point-to-point tariff</strong> — uniform vs distance-based transport charges.</li>
<li><strong>LNG (liquefied natural gas)</strong> — gas cooled to liquid for shipping; adds supply flexibility.</li>
<li><strong>Take-or-pay</strong> — long-term gas contract obliging payment whether or not gas is taken.</li>
<li><strong>Trading hub</strong> — a physical/virtual point (e.g. Henry Hub, NBP) where gas is priced and traded.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="28" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="industry--telecoms--water">Industry — telecoms &amp; water</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>PSTN</strong> — legacy circuit-switched public telephone network.</li>
<li><strong>NGN (next-generation network)</strong> — IP-based packet network replacing the PSTN.</li>
<li><strong>Unbundling / LLU</strong> — forcing the incumbent to lease its local loop to rivals.</li>
<li><strong>Net neutrality</strong> — ISPs treat all traffic equally; no paid prioritisation.</li>
<li><strong>Universal service (USO)</strong> — obligation to serve everyone at an affordable price.</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>Inset appointment</strong> — a rival water company appointed to serve a specific site.</li>
<li><strong>Common carriage</strong> — third parties ship water/gas through the incumbent's pipes.</li>
<li><strong>Sewer mining</strong> — extracting and treating wastewater locally for reuse, bypassing the network.</li>
<li><strong>Block tariff (water)</strong> — price bands rising or falling with volume used.</li>
<li><strong>Sunshine regulation</strong> — publish comparative performance to shame firms into improving.</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" class="part" data-marpit-pagination="29" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>

<h4 id="quick-reference">Quick reference</h4>
<h1 id="acronyms">Acronyms</h1>
<h4 id="the-ones-worth-memorising">The ones worth memorising</h4>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="30" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="acronyms--concepts--methods">Acronyms — concepts &amp; methods</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>ECPR</strong> — Efficient Component Pricing Rule</li>
<li><strong>M-ECPR</strong> — Market-adjusted ECPR</li>
<li><strong>LRIC</strong> — Long-Run Incremental Cost</li>
<li><strong>TSLRIC</strong> — Total-Service LRIC</li>
<li><strong>TELRIC</strong> — Total-Element LRIC</li>
<li><strong>FL-LRIC</strong> — Forward-Looking LRIC</li>
<li><strong>SAC / DSAC</strong> — Stand-Alone Cost / Distributed SAC</li>
<li><strong>FDC</strong> — Fully Distributed Costs</li>
<li><strong>EPMU</strong> — Equi-Proportionate Mark-Up</li>
<li><strong>RPI−X</strong> — Retail Price Index minus X</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>RAB / RCV</strong> — Regulatory Asset Base / Capital Value</li>
<li><strong>WACC</strong> — Weighted Average Cost of Capital</li>
<li><strong>CAPM</strong> — Capital Asset Pricing Model</li>
<li><strong>DCF</strong> — Discounted Cash Flow</li>
<li><strong>DORC / ORC</strong> — (Depreciated) Optimised Replacement Cost</li>
<li><strong>DEA / COLS / SFA</strong> — efficiency-frontier methods</li>
<li><strong>TFP</strong> — Total Factor Productivity</li>
<li><strong>A-J</strong> — Averch–Johnson effect</li>
<li><strong>CPNP / RPNP</strong> — Calling/Receiving Party Network Pays</li>
<li><strong>BAK</strong> — Bill-and-Keep</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" data-marpit-pagination="31" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
<header>Reference · Glossary &amp; key concepts</header>
<h2 id="acronyms--bodies--industry">Acronyms — bodies &amp; industry</h2>
<div class="cols">
<div class="card">
<ul>
<li><strong>Ofgem / Ofcom / Ofwat / Oftel</strong> — UK energy / comms / water / (former) telecoms regulators</li>
<li><strong>FERC</strong> — Federal Energy Regulatory Commission (US)</li>
<li><strong>FCC</strong> — Federal Communications Commission (US)</li>
<li><strong>ACCC / AER</strong> — Australian Competition &amp; Consumer Commission / Australian Energy Regulator</li>
<li><strong>CRTC</strong> — Canadian telecoms regulator</li>
<li><strong>PUC / PUCs</strong> — Public Utility Commission(s), US states</li>
<li><strong>NARUC</strong> — Nat'l Assoc. of Regulatory Utility Commissioners</li>
<li><strong>ISO</strong> — Independent System Operator</li>
</ul>
</div>
<div class="card">
<ul>
<li><strong>USO</strong> — Universal Service Obligation</li>
<li><strong>SMP</strong> — Significant Market Power</li>
<li><strong>PSTN / NGN</strong> — Public Switched Telephone / Next-Generation Network</li>
<li><strong>LLU / DSL / xDSL</strong> — Local Loop Unbundling / Digital Subscriber Line</li>
<li><strong>VoIP</strong> — Voice over Internet Protocol</li>
<li><strong>ILEC / CLEC</strong> — Incumbent / Competitive Local Exchange Carrier</li>
<li><strong>MVNO</strong> — Mobile Virtual Network Operator</li>
<li><strong>LMP / FTR</strong> — Locational Marginal Price / Financial Transmission Right</li>
<li><strong>LNG</strong> — Liquefied Natural Gas</li>
<li><strong>NBP / TTF</strong> — National Balancing Point / Title Transfer Facility (gas hubs)</li>
</ul>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="Reference · Glossary &amp; key concepts" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="lead" data-theme="8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu" lang="en-GB" class="lead" data-marpit-pagination="32" style="--paginate:true;--header:Reference · Glossary &amp; key concepts;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:lead;--theme:8eke2g4viebltkdzukjwvbmjlqjm77k2dfbylvv3uifu;" data-marpit-pagination-total="32">
