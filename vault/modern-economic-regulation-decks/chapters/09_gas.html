<h3 id="how-a-storable-tradeable-geographically-specific-fuel-is-produced-transported-priced-and-regulated--from-wellhead-to-the-household-burner">How a storable, tradeable, geographically-specific fuel is produced, transported, priced and regulated — from wellhead to the household burner.</h3>

<header>Ch 9 · Gas regulation</header>
<h2 id="learning-objectives">Learning objectives</h2>
<p>By the end of this chapter you should be able to:</p>
<ul>
<li>Explain the <strong>physical &amp; economic characteristics</strong> of gas and contrast them point-by-point with <strong>electricity</strong>.</li>
<li>Walk the <strong>gas supply chain</strong> end-to-end and say which stages are <strong>core-network monopoly</strong> vs <strong>competitive</strong>.</li>
<li>Describe <strong>wholesale trading</strong>: hubs, spot vs long-term contracts, take-or-pay, hedging, and rival <strong>pricing regimes</strong>.</li>
<li>Explain the <strong>regulatory approach</strong>: price caps vs rate-of-return, benchmarking, quality, the Network Code, third-party access.</li>
<li>Compare <strong>capacity tariff methods</strong>: postage-stamp, point-to-point, entry-exit.</li>
<li>Discuss the live <strong>policy issues</strong>: access, investment, storage, security of supply, shale, environment, retail competition.</li>
<li>Recall the <strong>evidence</strong> on where restructuring worked (USA, Britain) and where it stalled (much of EU; Argentina).</li>
</ul>
<div class="key"><b>Key terms preview:</b> LNG · shipper · nomination & balancing · NBP / Henry Hub / TTF · take-or-pay · gas-on-gas competition · oil-indexation · Network Code · entry-exit tariff · open season · unbundling.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="3" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="why-gas-matters--and-why-its-regulated">Why gas matters — and why it's regulated</h2>
<p>Natural gas (mostly <strong>methane</strong>) is a major energy source: domestic heating &amp; cooking, industrial processes, and — increasingly — the <strong>fuel for electricity generation</strong>.</p>
<div class="cols">
<div class="def">
<p><strong>Cleaner fossil fuel.</strong> Emits ~<strong>45%</strong> of the CO₂ of unabated coal generation — touted as a &quot;bridge&quot; to a low-carbon future alongside renewables.</p>
</div>
<div class="def">
<p><strong>A resource, not a manufacture.</strong> Gas fields are <strong>geographically specific</strong> and unevenly distributed — so some countries must import, raising <strong>security-of-supply</strong> concerns.</p>
</div>
</div>
<div class="key">Two forces run through the whole chapter: gas is <b>transportable</b> (over land by pipeline, over sea as LNG → potential <i>global</i> market) yet <b>import-dependent</b> for many nations (Russia–Ukraine disputes; the shale revolution reshaping the outlook).</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="4" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="%C2%A791-characteristics-of-the-product">§9.1 Characteristics of the product</h2>
<ul>
<li>Gas moves <strong>slowly</strong> along a transmission system (~25 mph in Britain) — supply is <strong>not instantly responsive</strong> to demand.</li>
<li>Gas is <strong>combustible</strong> → supply must be <strong>continuous and at the right pressure</strong>. <strong>Safety</strong> is a first-order concern (explosions if gas escapes, or if air enters and shifts the gas-to-air ratio).</li>
<li>Gas and electricity are treated <strong>similarly</strong> by regulators — both are energy, both need high-pressure/voltage transmission then lower-pressure/voltage distribution, both are <strong>relatively homogeneous</strong> (molecules / electrons) so <strong>tradeable</strong> wholesale.</li>
<li><strong>Demand-side substitution</strong>: gas and electricity substitute for heating/cooking; generators burn gas when the <strong>gas price &lt; electricity price</strong>.</li>
<li>Convergence in governance: often a <strong>single &quot;energy&quot; regulator</strong>; firms operating in both; <strong>dual-fuel</strong> retail offers.</li>
</ul>
<div class="key">The similarity is real — but six differences (next slides) make gas regulation genuinely distinct from electricity.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="5" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="gas-vs-electricity--the-six-key-contrasts">Gas vs electricity — the six key contrasts</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>Feature</th>
<th>Gas</th>
<th>Electricity</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>Source</td>
<td><strong>Natural resource</strong>, geographically-specific fields; some nations must import</td>
<td>Manufactured — generation can be sited <strong>anywhere</strong></td>
</tr>
<tr>
<td>2</td>
<td>Flow path</td>
<td>Can send <strong>point-to-point</strong>; physical path &amp; transport payment determinable</td>
<td>Flows follow physics; path not chosen</td>
</tr>
<tr>
<td>3</td>
<td>Network failure</td>
<td>Can <strong>isolate/shut</strong> a pipeline segment; rest keeps running</td>
<td>Failure on one part hits the <strong>whole</strong> network</td>
</tr>
<tr>
<td>4</td>
<td><strong>Storability</strong></td>
<td><strong>Storable</strong> (incl. in the pipes) → less acute balancing/market-power issues</td>
<td><strong>Non-storable</strong> → real-time balancing critical</td>
</tr>
<tr>
<td>5</td>
<td>Long-distance</td>
<td>Transportable long distances with <strong>low losses</strong> (incl. LNG by sea)</td>
<td>Losses rise with distance</td>
</tr>
<tr>
<td>6</td>
<td>Pricing</td>
<td>Often <strong>oil-linked</strong> outside USA/Britain</td>
<td>Not fuel-indexed in this way</td>
</tr>
</tbody>
</table>
<div class="small">Storability is the headline difference: gas stored today can be sold tomorrow — introducing an <b>opportunity-cost-over-time</b> dimension absent in electricity.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="6" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="characteristics-cont--demand--competition">Characteristics (cont.) — demand &amp; competition</h2>
<div class="cols">
<div class="def">
<p><strong>Inter-fuel competition.</strong> For some uses (cooking, heating) gas competes with <strong>LPG, oil, electricity, coal</strong>. But competition is <strong>long-run only</strong> — once users sink investment in equipment for one fuel, switching is slow.</p>
</div>
<div class="def">
<p><strong>Seasonal &amp; diurnal demand.</strong> Winter demand can be <strong>up to 5× summer</strong>. Within a day (<strong>diurnal swing</strong>) demand peaks morning &amp; evening. Fields export at a <strong>steady rate</strong> → the gap is bridged by <strong>storage</strong>.</p>
</div>
</div>
<ul>
<li>Industrial demand includes <strong>gas-fired electricity</strong> (intermediate &amp; peak), which itself fluctuates sharply.</li>
<li>Peaks are managed via <strong>storage</strong> and, in places like Britain, <strong>interruptible contracts</strong> (supply can be temporarily cut) — priced <strong>below firm contracts</strong>.</li>
</ul>
<div class="key">Because demand swings but production is steady, <b>storage and flexibility</b> are structural necessities of the gas system.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="7" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="%C2%A7912-the-gas-supply-chain--the-four-core-stages">§9.1.2 The gas supply chain — the four core stages</h2>
<p>The traditional chain runs in sequence, with <strong>storage</strong> injectable at several points:</p>
<div class="cols">
<div class="card">
<p><strong>1 · Exploration, extraction &amp; processing</strong> — find fields (often with oil/coal), drill wells, separate methane from liquids/impurities to make <strong>dry gas</strong> for transport.</p>
<p><strong>2 · Transmission</strong> — <strong>high-pressure</strong> pipelines carry gas long distances from fields to consumption areas (cities, big industry).</p>
</div>
<div class="card">
<p><strong>3 · Distribution</strong> — <strong>lower-pressure</strong>, smaller-diameter pipes carry gas from the <strong>citygate</strong> to final users.</p>
<p><strong>4 · Retail supply</strong> — selling the gas commodity to end-users (households, business, industry, generators).</p>
</div>
</div>
<div class="key">Cost split (illustrative): <b>wholesale gas ≈ 69%</b>, <b>network ≈ 31%</b> of the average pre-tax household bill across 14 EU capitals (2011). In the USA the wellhead price was ~36% of the residential price.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="8" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="%F0%9F%93%8A-figure-91--the-gas-network-in-words"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> Figure 9.1 — the gas network (in words)</h2>
<p>Picture gas flowing <strong>left-to-right</strong>, with storage buffering the middle:</p>
<div class="cols">
<div class="def">
<p><strong>Sources (left):</strong> production <strong>wells</strong> and gas fields; <strong>LNG imports</strong> arriving at receiving terminals.</p>
<p><strong>Processing:</strong> a <strong>processing plant</strong> cleans the gas to pipeline quality.</p>
<p><strong>Long-haul spine:</strong> high-pressure <strong>transmission</strong> pipelines, pushed along by <strong>compressor stations</strong>; <strong>underground storage</strong> connected in.</p>
</div>
<div class="def">
<p><strong>Citygate → distribution:</strong> gas steps down in pressure and enters lower-pressure <strong>distribution</strong> pipes.</p>
<p><strong>End-users (right):</strong> large <strong>industrial</strong> customers and <strong>electricity generators</strong> (often taken directly off transmission at high pressure), plus <strong>commercial</strong>, <strong>small industrial</strong> and <strong>residential</strong> customers via distribution.</p>
<p><strong>Overlay:</strong> <strong>gas retailing</strong> sits commercially across the chain.</p>
</div>
</div>
<div class="small">Key insight of the figure: big users tap the <b>transmission</b> network directly; households sit at the end of the <b>distribution</b> network.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="9" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="extraction--processing--conventional-vs-unconventional">Extraction &amp; processing — conventional vs unconventional</h2>
<div class="cols">
<div class="def">
<p><strong>Conventional</strong> — discrete, well-defined reservoirs; <strong>vertical wells</strong>. Recovery <strong>&gt;80%</strong> of original gas. Historically dominant. Largest reserves: <strong>Russia</strong>, Middle East (Qatar, Saudi, Iran), N. America, Africa (Algeria, Nigeria).</p>
</div>
<div class="def">
<p><strong>Unconventional</strong> — less porous rock, spread over large areas. Three types: <strong>tight gas sands</strong>, <strong>coal-bed methane</strong>, <strong>shale gas</strong>. Recovery only <strong>15–30%</strong>. Extracted via <strong>hydraulic fracking</strong> (+ horizontal drilling) — <strong>more expensive</strong> and <strong>environmentally contested</strong>.</p>
</div>
</div>
<ul>
<li>~<strong>45%</strong> of world reserves are unconventional; IEA: <strong>~32%</strong> of supply by 2035.</li>
<li>Big technically-recoverable unconventional reserves: <strong>China, Argentina, Algeria, USA, Canada, Mexico, Australia, South Africa, Russia</strong>.</li>
<li>Production itself is <strong>competitive</strong>, not a monopoly — marginal costs rise as easy fields deplete; large <strong>resource rents</strong> attract entry.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="10" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="transmission--how-gas-actually-moves">Transmission — how gas actually moves</h2>
<ul>
<li>Fields sit far from demand → <strong>high-pressure pipelines</strong> carry gas, often across <strong>state/national borders</strong>.</li>
<li><strong>Ownership varies</strong>: single national operator (Britain, Denmark — same firm as electricity transmission); regional operators (France, Germany); many unintegrated pipelines interconnecting at hubs (USA, Australia). Lesson: <strong>economies of scale exist at the individual-pipeline level</strong> — integration is not required to capture them.</li>
<li><strong>Compressor stations</strong> (every 40–100 miles US; 40–60 miles GB) rebuild pressure lost to friction and offtakes; they let operators <strong>store pressure at low demand</strong> and release it at peak.</li>
<li><strong>Looping</strong> (parallel pipes) adds capacity and doubles as <strong>storage</strong>.</li>
</ul>
<div class="key">Britain: gas enters at <b>terminals</b>, is pushed by ~23 compressor stations, and exits at ~175 <b>offtake points</b> to distribution networks and large users.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="11" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="shippers-nominations--balancing">Shippers, nominations &amp; balancing</h2>
<div class="def">
<p><strong>Shippers</strong> = the users of transmission pipelines — energy retailers, big industrials, generators, traders. They <strong>procure gas</strong> from producers, interconnectors, storage or LNG and <strong>schedule transport</strong> with the pipeline operator.</p>
</div>
<ul>
<li><strong>Nominations</strong>: shippers book the <strong>time, pressure and location</strong> of injections and withdrawals in advance.</li>
<li><strong>Balancing</strong>: over a period, gas <strong>injected ≈ gas withdrawn</strong>. A mismatch → <strong>imbalance charges</strong>.</li>
<li>Shippers stay in balance by trading gas in day-ahead / OTC markets or by calling on <strong>storage</strong>.</li>
<li><strong>Where individual pipelines are separately owned</strong> → each operator balances its own system. <strong>Where integrated</strong> (Britain) → the owner balances <strong>centrally</strong>, at the single <strong>National Balancing Point (NBP)</strong>, buying/selling on the OTC market or drawing storage.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="12" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="capacity-allocation--getting-the-right-to-flow-gas">Capacity allocation — getting the right to flow gas</h2>
<p>Pipeline owners must offer <strong>capacity rights</strong> to shippers. <strong>How</strong> they allocate them varies:</p>
<div class="cols">
<div class="def">
<p><strong>Administrative</strong> — first-come-first-served or pro-rata (e.g. Australia).</p>
<p><strong>Market-based</strong> — <strong>auctions</strong>. USA runs <strong>&quot;open seasons&quot;</strong> (sealed-bid, on the operator's website). Britain, France, the Netherlands use auctions; from 2015 auctions apply at <strong>EU interconnection points</strong>.</p>
</div>
<div class="def">
<p><strong>Secondary market</strong> (&quot;capacity release&quot;) — holders <strong>resell unused capacity</strong> to others; in the USA via electronic bulletin boards.</p>
<p><strong>Anti-hoarding</strong> — <strong>&quot;use-it-or-lose-it&quot;</strong> conditions stop incumbents warehousing capacity to foreclose entrants.</p>
</div>
</div>
<div class="key">See <b>Box 9.1</b> — Britain's gas entry auctions, a widely-cited success story.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="13" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<div class="box">
<h3 id="%F0%9F%93%A6-box-91--allocating-capacity-gas-entry-auctions-in-britain"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Box 9.1 — Allocating capacity: gas entry auctions in Britain</h3>
<p><strong>Example.</strong> Since <strong>1999</strong>, Britain has auctioned entry-capacity rights to the National Transmission System (NTS). Before that, shippers bought unlimited capacity at regulated (LRMC-based) rates.</p>
<ul>
<li><strong>National Grid Gas (NGG)</strong> must offer a <strong>baseline volume</strong> at each entry point (set in the price control) plus <strong>incremental capacity</strong> above it.</li>
<li><strong>Reserve prices</strong> come from NGG's transportation model (long-run incremental cost vs a reference node, adjusted to target revenue).</li>
<li><strong>Staged auctions:</strong> annual <strong>quarterly</strong> auction → long-term allocation (2–16 yrs ahead, up to 90% of baseline); annual <strong>monthly</strong> auction (0–2 yrs, pay-as-bid); <strong>daily</strong> products 7 days ahead; <strong>on-the-day</strong> from 6 a.m.; plus an <strong>interruptible</strong> auction.</li>
<li>Rights come as <strong>firm</strong> (right to flow, or compensation if denied) or <strong>interruptible</strong> (can be cut, no compensation). Rights are <strong>tradeable</strong>.</li>
</ul>
<p><strong>Lesson.</strong> Well-designed auctions can allocate scarce network capacity efficiently <em>and</em> <strong>signal user demand for new investment</strong> (long-term bids underpin incremental capacity). Design matters — ACER recommended extending the model across ~130–150 EU interconnection points.</p>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="14" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="distribution--storage">Distribution &amp; storage</h2>
<div class="cols">
<div class="def">
<p><strong>Distribution.</strong> From the <strong>citygate</strong>, small-diameter high/medium/low-pressure pipes reach end-users. Thousands of km of pipe + pressure-regulating stations.</p>
<p><strong>Counts vary hugely:</strong> Britain <strong>8</strong> networks, Australia 13, Ireland 1 — but <strong>~695</strong> in Germany, <strong>~1,200</strong> in the USA (mostly state-regulated). Strong <strong>economies of density</strong> → don't duplicate networks.</p>
</div>
<div class="def">
<p><strong>Storage.</strong> Smooths price volatility, manages diurnal/seasonal swings, and provides a reserve for very cold days; also used for <strong>system balancing</strong>.</p>
<p>Forms: <strong>underground</strong> (salt caverns, depleted fields), <strong>LNG tanks</strong>, <strong>linepack</strong> (raise pipe pressure at low demand), distribution <strong>bullets</strong> and <strong>gasometers</strong>.</p>
<p>Large facilities can be subject to <strong>open-access</strong> requirements.</p>
</div>
</div>
<div class="small">Retail supply is the final stage — many jurisdictions (Britain, some US states, parts of the EU/Australia) allow <b>full retail competition</b>: any customer can choose supplier.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="15" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="which-stages-are-core-network-vs-competitive">Which stages are core-network vs competitive?</h2>
<div class="cols">
<div class="key">
<p><strong>Competitive (no ex-ante price control)</strong></p>
<ul>
<li><strong>Production / extraction</strong> — rising marginal costs + resource rents ⇒ entry (USA: ~7,000 producers, 400k wells).</li>
<li><strong>Retail supply</strong> — low sunk costs; scope for innovative tariffs; &quot;customer choice&quot;.</li>
<li><strong>Storage</strong> — <em>potentially</em> competitive; economies of scale modest — but a lone facility on a single pipeline can hold <strong>de facto monopoly</strong> power.</li>
</ul>
</div>
<div class="box">
<p><strong>Core network (price-regulated monopoly)</strong></p>
<ul>
<li><strong>Transmission</strong> — capital-intensive, sunk, costs fall with diameter ⇒ <strong>natural monopoly</strong> (except where pipeline-to-pipeline competition exists).</li>
<li><strong>Distribution</strong> — sunk, immobile, strong <strong>economies of density</strong> ⇒ natural monopoly; duplication inefficient.</li>
</ul>
</div>
</div>
<div class="small">Nuance: some argue major US pipelines are "lousy natural monopolies" / oligopolies — hence the debate over pipeline-to-pipeline competition (next section).</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="16" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="%C2%A7913-wholesale-trading--from-long-term-contracts-to-markets">§9.1.3 Wholesale trading — from long-term contracts to markets</h2>
<p><strong>Before restructuring:</strong> a quasi-<strong>vertically-integrated</strong> firm (state or private) monopolised much of the chain, relying on <strong>long-term contracts</strong> (up to 20–25 years) at fixed prices.</p>
<ul>
<li>USA: producers → transmission pipelines → local utilities, all on long contracts.</li>
<li>Britain: state-owned <strong>British Gas</strong> held 25-year contracts with North Sea producers.</li>
<li>Rationale: <strong>underpin investment</strong> in production and pipelines; <strong>share risk</strong>.</li>
</ul>
<p><strong>Restructuring (1980s–90s)</strong> separated transmission/distribution/retail, lifted wholesale price controls, and fostered <strong>new trading arrangements</strong> — shorter-term and more flexible, via OTC platforms.</p>
<div class="key">Main benefit of flexibility: participants can better <b>manage short- and long-term price-volatility risk</b> — especially valuable for gas-fired generators facing volatile electricity demand.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="17" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="wholesale-spot-markets--trading-hubs">Wholesale spot markets &amp; trading hubs</h2>
<div class="def">
<p>A <strong>hub</strong> is a delivery point where multiple pipelines interconnect. Hubs raise <strong>liquidity</strong>, cut <strong>transaction costs</strong>, and host trading in gas, secondary capacity, storage rights, and financial contracts. Hubs can be <strong>physical</strong> (gas passes through the interchange) or <strong>virtual</strong> (a balancing zone, trade at any point within it).</p>
</div>
<table>
<thead>
<tr>
<th>Hub</th>
<th>Location</th>
<th>Note</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Henry Hub</strong></td>
<td>Louisiana, USA</td>
<td>Largest/most liquid US hub; ~28 US hubs; delivery point for <strong>NYMEX</strong> futures</td>
</tr>
<tr>
<td><strong>Alberta Hub</strong></td>
<td>Canada</td>
<td>Leading N. American reference price</td>
</tr>
<tr>
<td><strong>NBP</strong> (National Balancing Point)</td>
<td>Britain</td>
<td><strong>Virtual</strong>; most active/liquid hub in Europe</td>
</tr>
<tr>
<td><strong>TTF</strong></td>
<td>Netherlands</td>
<td>Virtual Title Transfer Facility</td>
</tr>
<tr>
<td><strong>Zeebrugge</strong></td>
<td>Belgium</td>
<td>Trading hub</td>
</tr>
<tr>
<td><strong>CEGH (Baumgarten)</strong></td>
<td>Austria</td>
<td>Central European Gas Hub</td>
</tr>
<tr>
<td><strong>Longford / Wallumbilla / Moomba</strong></td>
<td>Australia</td>
<td>Three main hubs</td>
</tr>
</tbody>
</table>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="18" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="hedging-futures--long-term-contracts">Hedging, futures &amp; long-term contracts</h2>
<div class="cols">
<div class="def">
<p><strong>Hedging</strong> limits exposure to adverse price moves.</p>
<ul>
<li><strong>Physical</strong>: storage contracts, bilateral fixed-price contracts.</li>
<li><strong>Financial</strong>: <strong>futures, options, swaps</strong> — financial settlement, no physical delivery.</li>
</ul>
<p>Henry Hub is the delivery point for <strong>NYMEX</strong> gas futures; in Britain futures price &amp; deliver to the <strong>NBP</strong>. Futures prices <strong>signal expected future gas prices</strong>, informing storage decisions.</p>
</div>
<div class="def">
<p><strong>Long-term contracts persist</strong> — still ~<strong>75%</strong> of procurement in continental Europe; common in Australia/Asia.</p>
<ul>
<li>Often carry a <strong>take-or-pay</strong> clause: buyer pays for a <strong>minimum quantity whether or not taken</strong>.</li>
<li>Prices don't move daily/seasonally but are <strong>indexed over time</strong> — via an <strong>escalation clause</strong> to a competing fuel.</li>
</ul>
</div>
</div>
<div class="key"><b>Take-or-pay</b> shifts volume risk to the buyer and underpins the producer's investment; it also created the "stranded contract" problem when US reforms hit in the 1980s.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="19" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="two-pricing-worlds-gas-on-gas-vs-oil-indexed">Two pricing worlds: gas-on-gas vs oil-indexed</h2>
<div class="cols">
<div class="box">
<p><strong>Gas-on-gas competition</strong> (USA, Britain)<br />
Prices set by <strong>gas market fundamentals</strong> — supply/demand at hubs, indexed to <strong>gas price indices</strong>, not oil. Requires <strong>liquid</strong> wholesale markets.</p>
</div>
<div class="box">
<p><strong>Competing-fuel / oil-indexed</strong> (continental Europe, Asia)<br />
Contract price <strong>linked to oil</strong> (crude — typical Asia) or <strong>gasoil/fuel oil</strong> (Europe) via an escalation clause. Australia sometimes indexes to <strong>CPI</strong>.</p>
</div>
</div>
<ul>
<li><strong>Rationale for oil-indexation</strong> (the <em>market-value principle</em>): encourage investment; make gas substitute for the fuel it displaces; a perceived security premium.</li>
<li><strong>Criticism</strong>: it <strong>divorces gas prices from gas-market fundamentals</strong> and leaves generators &quot;at the mercy of an oil cartel&quot;. In 2009 spot gas was <strong>far below</strong> oil-indexed gas.</li>
</ul>
<div class="small"><b>LNG</b> increasingly links distant markets (Atlantic ↔ Pacific), raising the prospect of arbitrage and a genuinely <b>global</b> gas market.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="20" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="%C2%A792-approach-to-regulation--the-logic">§9.2 Approach to regulation — the logic</h2>
<p>Restructuring (1980s–90s; N. America, UK, Australia, NZ, most EU, parts of S. America):</p>
<ul>
<li><strong>Opened competitive activities</strong> to competition and <strong>relaxed price regulation</strong> there.</li>
<li><strong>Required new access regulation</strong> for the <strong>core network</strong> once activities were separated.</li>
</ul>
<div class="cols">
<div class="def">
<p><strong>No longer price-regulated:</strong> production (competition among producers) and, in many places, <strong>retail supply</strong>.</p>
<p>Retail is potentially competitive: <strong>low sunk costs</strong>, marketing-scale operating costs, scope for <strong>innovative tariffs</strong>. Full retail choice extended to households in Britain, several EU states, US states, parts of Australia.</p>
</div>
<div class="def">
<p><strong>Still price-regulated (ex ante):</strong> <strong>transmission</strong>, <strong>distribution</strong>, and sometimes <strong>storage</strong> — the natural-monopoly core.</p>
<p><strong>Unbundling:</strong> since 2007 EU distributors must <strong>legally unbundle</strong> distribution from retail; US firms offer <strong>bundled</strong> (single price) vs <strong>unbundled</strong> (buy commodity separately) service.</p>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="21" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="pipeline-competition--third-party-access">Pipeline competition &amp; third-party access</h2>
<ul>
<li><strong>Where pipelines are point-to-point</strong> (USA, Australia) — same field → same citygate — there can be <strong>pipeline-to-pipeline competition</strong>. Australia's <strong>&quot;coverage decisions&quot;</strong> weigh whether rival pipelines make regulation unnecessary; US operators can seek FERC approval for <strong>&quot;market-based rates&quot;</strong> (must prove no market power) — but this is <strong>rarely granted</strong>; FERC still sets most rates.</li>
<li><strong>Where competition is absent</strong> (most jurisdictions) — transmission is a natural monopoly, so <strong>third-party access</strong> on <strong>non-discriminatory</strong> terms is mandated. USA: <strong>open access</strong> on a first-come-first-served basis, with min/max rate bounds; since <strong>1992 (FERC Order 636)</strong> interstate pipelines must <strong>separate merchant (production/sales) from transport/storage</strong>.</li>
</ul>
<div class="key">Access + separation is the twin remedy: it lets shippers reach the pipeline on the <b>same terms</b> as the owner's own affiliate — the foundation of a competitive gas market.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="22" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="the-network-code--the-eu-access-regime">The Network Code &amp; the EU access regime</h2>
<div class="cols">
<div class="def">
<p><strong>Britain's Network Code.</strong> After British Gas was privatised (1986) as a <strong>vertically-integrated</strong> entity, entry was <strong>stifled</strong> until the 1990s separation of transportation, publication of tariffs, and a <strong>Network Code</strong> — a multilateral contract defining the <strong>rules and obligations</strong> for third-party access to the transmission system (today the <strong>Uniform Network Code, UNC</strong>).</p>
</div>
<div class="def">
<p><strong>EU Gas Directives.</strong></p>
<ul>
<li><strong>1st (1998):</strong> choice of <strong>negotiated</strong> or <strong>regulated</strong> third-party access.</li>
<li><strong>2nd (2003):</strong> removed the choice → <strong>regulated</strong> access + <strong>legal separation</strong>.</li>
<li><strong>3rd (2009):</strong> one of <strong>three separation options</strong> (ownership unbundling / ISO / independent transmission operator); created <strong>ENTSO-G</strong> and EU network codes.</li>
</ul>
</div>
</div>
<div class="small">Storage & LNG: in the EU may keep negotiated-or-regulated access and can seek <b>exemptions</b>; in the USA the FERC regulates interstate storage, state PUCs the rest.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="23" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="%C2%A7922-form-of-price-controls--two-families">§9.2.2 Form of price controls — two families</h2>
<div class="cols">
<div class="box">
<p><strong>Price caps</strong> (Britain, Australia, most EU)</p>
<ul>
<li>Ceiling on average price/revenue increase for a set period (~5 yrs).</li>
<li>Variants: <strong>revenue cap</strong>, average/hybrid revenue cap, weighted-average price cap.</li>
<li>Built on the <strong>building-block</strong> revenue requirement.</li>
<li>Add-ons: <strong>efficiency carryover</strong>, <strong>error-correction</strong>, investment incentives, <strong>cost pass-throughs</strong> (shrinkage, safety, licence fees).</li>
</ul>
</div>
<div class="box">
<p><strong>Rate of return</strong> (USA)</p>
<ul>
<li>Rates recover <strong>prudent costs</strong> + a <strong>fair return</strong> on the regulated asset base + depreciation &amp; tax.</li>
<li>Set in a <strong>rate case</strong> (initiated by firm or regulator).</li>
<li>Adaptations: rate freezes, cost/revenue <strong>trackers</strong>, multi-year caps, formula rate plans, <strong>earnings-sharing</strong>.</li>
</ul>
</div>
</div>
<ul>
<li><strong>Efficiency benchmarking</strong> (often international) increasingly informs caps — Australia, Canada, Ireland, NZ; Germany benchmarks <strong>187</strong> distributors.</li>
<li><strong>Quality of service</strong>: gas disruptions are rarer/localised → handled mainly via <strong>health &amp; safety</strong> rules, with some financial service incentives/penalties.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="24" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<div class="box">
<h3 id="%F0%9F%93%A6-box-92--negotiated-settlements-in-the-north-american-gas-industry"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Box 9.2 — Negotiated settlements in the North American gas industry</h3>
<p><strong>Example.</strong> Rather than fight a full rate hearing, US interstate pipelines and their customers increasingly <strong>negotiate</strong> rates. <strong>~90%</strong> of rate cases at the <strong>FERC</strong> are now <strong>settled</strong> by the parties, not adjudicated.</p>
<ul>
<li>Participants: the pipeline, <strong>large distribution customers</strong>, <strong>state PUCs</strong> (representing final users), sometimes rival pipelines and future customers.</li>
<li>Process (per Littlechild): pipeline files rate/revenue calcs (rate-of-return basis) → <strong>FERC trial staff</strong> facilitate, run bilateral/multilateral talks, prepare a <strong>first settlement offer</strong> → if <strong>unanimous</strong>, accepted as a whole; if not, consenting parties can be bound and non-consenters sent to the full process.</li>
<li><strong>Canada (NEB):</strong> since the mid-1990s almost all major pipelines settle — cutting processing time by <strong>~one-third</strong>. The NEB now accepts/rejects a settlement <strong>in its entirety</strong> and sets <strong>default cost-of-capital</strong> values to stop negotiations stalling.</li>
</ul>
<p><strong>Lesson.</strong> Negotiation can deliver faster, less adversarial outcomes than formal ratemaking — but <strong>design choices</strong> (sever vs whole-package; process- vs outcome-based review) shape whether parties settle or <strong>hold out</strong>.</p>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="25" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="%C2%A7922-tariff-structures-for-pipeline-capacity">§9.2.2 Tariff structures for pipeline capacity</h2>
<p>Two design questions: (1) <strong>how</strong> capacity is priced (distance vs flat); (2) the <strong>split</strong> between <strong>capacity</strong> and <strong>commodity</strong> charges.</p>
<table>
<thead>
<tr>
<th>Method</th>
<th>How the capacity charge works</th>
<th>Best suited to</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Postage-stamp</strong></td>
<td><strong>Same charge across the region</strong>, independent of distance, levied at entry. Not cost-reflective but politically easy</td>
<td>Denmark, Spain, Finland, Sweden</td>
</tr>
<tr>
<td><strong>Point-to-point</strong> (distance)</td>
<td>Charge ∝ <strong>distance</strong> between chosen entry and exit points; shipper buys a specific origin→destination right</td>
<td><strong>Point-to-point</strong> pipelines (USA, Australia)</td>
</tr>
<tr>
<td><strong>Entry-exit</strong></td>
<td><strong>Separate</strong> charges at entry and at exit; total = entry + exit; both can vary by location</td>
<td><strong>Meshed</strong>, highly-interconnected networks (EU 2009 Gas Regulation; UK, Italy, Germany, France, NL, Ireland)</td>
</tr>
<tr>
<td><strong>Capacity charge</strong></td>
<td>The charge for the <strong>right to reserve pipeline capacity</strong> (vs the commodity/usage charge for volumes actually flowed)</td>
<td>Recovers the largely <strong>fixed, sunk</strong> pipeline costs</td>
</tr>
</tbody>
</table>
<div class="small">Entry-exit <b>de-couples</b> entry from exit → creates "virtual pipelines": any two points can trade → promotes <b>liquid spot markets</b>. In Britain shippers hold separate entry and exit capacity contracts.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="26" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="capacity-vs-commodity-split">Capacity vs commodity split</h2>
<ul>
<li>Gas transportation costs are <strong>mostly fixed</strong> (sunk pipeline investment); variable costs of moving volumes are minor.</li>
<li>The <strong>split</strong> between the <strong>capacity charge</strong> and the <strong>commodity/usage charge</strong> decides <strong>how fixed costs are recovered</strong> and <strong>who bears them</strong>.</li>
<li><strong>USA (federal, &quot;straight-fixed-variable&quot;):</strong> <strong>100% of fixed costs → capacity charge</strong>; all variable costs → commodity fee.</li>
<li><strong>Europe:</strong> ~<strong>10 countries</strong> put <strong>all</strong> costs into a capacity charge; where a commodity charge exists, splits range <strong>70/30 to 95/5</strong>.</li>
<li><strong>Britain:</strong> <strong>no fixed split</strong> — commodity-based charges are ~<strong>50%</strong> of network revenue, prompting concern about the <strong>level and volatility</strong> of the entry commodity charge.</li>
</ul>
<div class="key">Distributional twist: raising the <b>capacity</b> element hits customers (e.g. households) who book lots of capacity for peaks relative to their annual consumption.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="27" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="%C2%A793-policy-issues-1--scope--effects-of-restructuring">§9.3 Policy issues (1) — scope &amp; effects of restructuring</h2>
<div class="cols">
<div class="def">
<p><strong>USA — the success story.</strong> Triggers: 1970s <strong>shortages</strong> (blamed on wellhead price controls). 1978 partial <strong>wellhead deregulation</strong>; FERC <strong>open-access</strong> orders (Order 436 in 1985, <strong>Order 636</strong> in 1992). Reforms were <strong>federal</strong>, unlike electricity. Result: a <strong>competitive wholesale market</strong>, many hubs, long-term contracts largely replaced by short-term trading. Called &quot;the <strong>Stradivarius</strong> of inland transport regulation&quot;.</p>
</div>
<div class="def">
<p><strong>Britain.</strong> Privatisation of British Gas (mid-1980s) but as an <strong>integrated</strong> firm → competition stalled until the <strong>1997 de-merger</strong> and new gas trading arrangements. Then a <strong>liquid, competitive</strong> wholesale market developed — now Europe's most active.</p>
</div>
</div>
<div class="small">Studies: modest US technical-efficiency gains, labour-productivity improvement, welfare gains, and a more market-responsive industry post-1978.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="28" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="policy-issues-1-cont--where-progress-stalled">Policy issues (1, cont.) — where progress stalled</h2>
<div class="cols">
<div class="box">
<p><strong>Continental Europe — slower.</strong> The 2007 EC <strong>Energy Sector Inquiry</strong> found: high <strong>market concentration</strong> (top-3 wholesalers &gt;90% in 12 countries); incumbents <strong>not entering</strong> each other's markets; <strong>illiquid</strong> hubs; entrants dependent on incumbents for gas; pipeline operators <strong>favouring affiliates</strong>. Patchy Directive implementation. EC increasingly uses <strong>competition law</strong> (e.g. vs <strong>Gazprom</strong>). <strong>Notable exceptions:</strong> UK, Netherlands, Spain.</p>
</div>
<div class="box">
<p><strong>Beyond Europe/USA — mixed.</strong> Canada: efficient, competitive, secure. Australia: secure, competitive, rising gas penetration. New Zealand: market <strong>in transition</strong> (still integrated, declining reserves, no LNG). <strong>Argentina: &quot;gone backwards&quot;</strong> — despite big reserves, never recovered from 2004 shortages; a <strong>retail price freeze</strong> raised demand but killed investment.</p>
</div>
</div>
<div class="key">Lesson: a <b>range</b> of restructuring approaches can support competition — but it needs access to a <b>competitive supply</b> of gas (indigenous or diverse imports).</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="29" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="policy-issues-2--security-of-supply">Policy issues (2) — security of supply</h2>
<p><strong>Dimensions:</strong> exhausting indigenous reserves; reliance on <strong>foreign</strong> (possibly unstable) sources; low-probability high-impact events; and <strong>knock-on to electricity</strong> (gas is the fastest-growing generation fuel).</p>
<div class="cols">
<div class="def">
<p><strong>USA.</strong> Mostly domestic + Canada (~15%) + LNG (~3%). The <strong>shale revolution</strong> flipped projections: from rising LNG imports to becoming a <strong>net LNG exporter (~2016)</strong>. Security now rests on <strong>liquid competitive markets</strong> + predictable pipeline regulation.</p>
</div>
<div class="def">
<p><strong>EU.</strong> ~<strong>64%</strong> imported (2009), heading <strong>&gt;80%</strong> by 2030. Demand rising, indigenous reserves (UK shelf) declining, uneven LNG capacity, limited shale prospects. <strong>Russia–Ukraine</strong> disputes (2009, 2014) are the recurring fear.</p>
</div>
</div>
<div class="key"><b>Regulation 994/2010</b> (with Directive 2004/67/EC) is the EU's security-of-supply framework: report storage capacities & long-term third-country arrangements; €1.3bn+ funding for interconnections and <b>reverse flows</b>.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="30" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="policy-issues-3--investment-in-pipelines--storage">Policy issues (3) — investment in pipelines &amp; storage</h2>
<div class="cols">
<div class="def">
<p><strong>Pipelines.</strong> Pre-restructuring, integrated (often state-owned) firms coordinated &amp; funded investment. The <strong>USA</strong> instead funds pipelines <strong>privately</strong>, each expected to pay for itself — enabled by legislative separation from distributors, a single regulator, predictable tariff procedure, and <strong>constitutional protection from expropriation</strong>.</p>
<p><strong>Open seasons</strong> (US) and <strong>entry auctions</strong> (Britain, 16-yr rights) let shippers commit capacity <strong>up front</strong> → underpin investment, <strong>limit stranding</strong>. <strong>Incremental pricing</strong> puts expansion costs on the shippers causing them.</p>
</div>
<div class="def">
<p><strong>Storage.</strong> Harder — storage confers <strong>insurance benefits on all</strong> participants and its level shifts current &amp; future prices. Regulated in USA/EU (access at regulated rates), but the <strong>mid-2000s USA</strong> allowed <strong>market-based rates</strong> for new storage to spur investment; open seasons used for new storage too.</p>
<p><strong>LNG classification</strong> debate: <strong>transport/storage</strong> (open access) vs <strong>supply source</strong> (no open access). <strong>USA (2002):</strong> reclassified LNG as <strong>supply</strong> — no open access → more investment. <strong>EU:</strong> LNG-for-storage treated like storage, but terminals can seek <strong>exemptions</strong>.</p>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="31" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="policy-issues-4--pricing-contracting--volatility">Policy issues (4) — pricing, contracting &amp; volatility</h2>
<div class="cols">
<div class="def">
<p><strong>The shift.</strong> Restructuring moved trading from <strong>long-term, formula-priced</strong> contracts toward <strong>short-term</strong> procurement, spot and futures markets. In the USA, post-reform contracts fell from <strong>~20 years to ~1 month</strong>.</p>
<p>Long contracts once guarded against <strong>hold-up / ex-post opportunism</strong> and (in Britain) redressed bargaining imbalance vs a few oil-major producers.</p>
</div>
<div class="def">
<p><strong>Volatility.</strong> Long contracts <strong>stabilised</strong> end-user prices (staggered pass-through). Spot prices reflect <strong>daily</strong> balances → <strong>volatile</strong>; volatility rose after US restructuring, is <strong>seasonal</strong> (colder = more volatile), and <strong>exceeds crude-oil</strong> volatility.</p>
<p><strong>Henry Hub &amp; NBP</strong> respond similarly to demand shocks.</p>
</div>
</div>
<div class="key"><b>Asymmetric pass-through</b> concern: bills may rise faster with wholesale costs than they fall. Ofgem (2011) found energy bills more responsive to <b>rising</b> than <b>falling</b> supplier costs — though the consumer-harm implication is not clear-cut.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="32" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="policy-issues-5--environmental-policy">Policy issues (5) — environmental policy</h2>
<div class="cols">
<div class="def">
<p><strong>Gas-fired electricity.</strong> Gas is the <strong>fastest-growing generation fuel</strong> (UK: 0.1% of gas output for power in 1990 → <strong>47%</strong> by 2010 — the &quot;dash for gas&quot;). Drivers: <strong>cleaner than coal</strong> (~45% of coal's CO₂), nuclear phase-outs, renewables' siting/intermittency barriers, cheap shale.</p>
<p><em>Debate:</em> a low-carbon <strong>&quot;bridge&quot;</strong> and flexible backup for renewables — <strong>vs</strong> still a <strong>fossil fuel</strong>, raising import-dependence and risking a &quot;missed golden opportunity&quot; for renewables.</p>
</div>
<div class="def">
<p><strong>Shale / fracking.</strong> Transformative in the USA (prices down, net-exporter projections). But <strong>contested on environmental grounds</strong>: risk of <strong>groundwater contamination</strong> and <strong>methane emissions</strong>. <strong>Banned in France &amp; Bulgaria</strong>. A 2011 European Parliament study warned methane leakage could have a <strong>&quot;huge impact&quot;</strong> on the GHG balance, making benefits &quot;short-lived&quot; or &quot;counterproductive&quot;.</p>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="33" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<div class="box">
<h3 id="%F0%9F%93%A6-box-93--changing-perceptions-of-retail-energy-competition-in-britain"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Box 9.3 — Changing perceptions of retail energy competition in Britain</h3>
<p><strong>Example.</strong> Retail competition (gas 1996–98; electricity 1998–99) unleashed a <strong>wide choice of tariffs</strong>: dual-fuel, green, and wholesale-linked. Ofgem counted <strong>~200 tariffs (2007) → ~400 (2011)</strong>.</p>
<ul>
<li><strong>Up to 2007:</strong> seen as <strong>success</strong> — rising switching, innovative tariffs, better service.</li>
<li><strong>After 2007:</strong> the regulator concluded many consumers — especially <strong>vulnerable</strong> ones — were <strong>not</strong> benefiting. Drawing on <strong>behavioural economics</strong>, Ofgem found <strong>status-quo bias</strong> and <strong>limited decision capacity</strong>, with <strong>tariff complexity</strong> &quot;bamboozling&quot; consumers and suppliers possibly <strong>incentivised to multiply tariffs</strong> to blunt switching.</li>
<li><strong>Response:</strong> cap suppliers to <strong>4 core tariffs</strong>, standardise structures, simplify bundles/discounts.</li>
</ul>
<p><strong>Lesson.</strong> Perceptions of retail competition <strong>evolve</strong>. More choice is not automatically more competition — complexity can <strong>soften</strong> rivalry. Yet critics warn standardisation may itself <strong>reduce price-cutting incentives</strong> (echoing an earlier ban on regional price discrimination that <em>reduced</em> competition), and sits awkwardly with smart-meter assumptions of an engaged consumer.</p>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="34" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="%C2%A794-evidence--where-did-restructuring-work">§9.4 Evidence — where did restructuring work?</h2>
<div class="cols3">
<div class="card">
<p><strong>Strong / competitive</strong></p>
<ul>
<li><strong>USA</strong> — liquid spot &amp; futures, many hubs, robust capacity secondary market.</li>
<li><strong>Britain</strong> — Europe's most liquid market; diverse supply (UK shelf, Norway, interconnector, LNG); merchant capacity investment.</li>
<li><strong>Canada</strong> — efficient, secure.</li>
</ul>
</div>
<div class="card">
<p><strong>Partial / relatively successful</strong></p>
<ul>
<li><strong>Netherlands, Spain</strong> — the EU's better performers.</li>
<li><strong>Australia</strong> — secure, competitive, growing gas share.</li>
</ul>
</div>
<div class="card">
<p><strong>Weak / stalled</strong></p>
<ul>
<li><strong>Much of continental EU</strong> — concentrated, illiquid hubs, affiliate favouritism, low switching (&lt;1% in CZ, DK, SK, SE in 2008).</li>
<li><strong>Argentina</strong> — reserves but <strong>endemic shortages</strong>; reforms went backwards.</li>
<li><strong>NZ</strong> — in transition.</li>
</ul>
</div>
</div>
<div class="key">Retail switching spread: high in Britain (~17–37% over the 2000s), modest in NL (9%) & Spain (6%), near-zero elsewhere. Different <b>routes</b> reached competition — so no single blueprint, but <b>access to competitive gas supply</b> is the common enabler.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="35" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="%C2%A794-chapter-summary">§9.4 Chapter summary</h2>
<ul>
<li>Gas is the <strong>most straightforward</strong> utility in some respects: a <strong>commodity-like</strong> product whose transport is simpler than electricity's, with <strong>less acute</strong> environmental interaction — but it is a <strong>geographically-specific resource</strong>, so <strong>import dependence</strong> and <strong>security of supply</strong> dominate policy.</li>
<li>The defining physical fact is <strong>storability</strong> (unlike electricity), which eases balancing but adds an <strong>opportunity-cost-over-time</strong> dimension.</li>
<li>The chain: <strong>production → transmission → distribution → retail</strong>, buffered by <strong>storage</strong>. <strong>Production, retail and (mostly) storage are competitive</strong>; <strong>transmission &amp; distribution are the regulated natural-monopoly core</strong>.</li>
<li>Regulation = <strong>price caps</strong> (UK/EU/Australia) or <strong>rate-of-return / negotiated settlements</strong> (USA), plus <strong>benchmarking</strong>, <strong>quality/safety</strong> rules, a <strong>Network Code</strong>, and <strong>third-party access + unbundling</strong>.</li>
<li>Capacity is priced by <strong>postage-stamp / point-to-point / entry-exit</strong>; wholesale prices run on <strong>gas-on-gas</strong> (USA, UK) or <strong>oil-indexed</strong> (Europe, Asia) logic.</li>
<li>Live issues: <strong>access, investment, storage, security of supply (Reg 994/2010), shale/fracking, gas-fired power, retail-competition design</strong>.</li>
<li>Verdict: <strong>competitive markets in USA, Canada, Britain</strong> (+ NL, Spain); <strong>slower in continental EU</strong>; <strong>Argentina a cautionary tale</strong>.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="Ch 9 · Gas regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml" lang="en-GB" data-marpit-pagination="36" style="--paginate:true;--header:Ch 9 · Gas regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:zpdl5fbqkiqek9po7donkqohd9d19sdnjyc9v57xs0ml;" data-marpit-pagination-total="36">
<header>Ch 9 · Gas regulation</header>
<h2 id="self-check--can-you-answer-these">Self-check — can you answer these?</h2>
<ol>
<li>List the <strong>six</strong> ways gas differs from electricity. Why is <strong>storability</strong> the most consequential?</li>
<li>Name the <strong>four core stages</strong> of the gas supply chain and classify each as <strong>competitive</strong> or <strong>regulated monopoly</strong> (and explain where <strong>storage</strong> sits).</li>
<li>What does a <strong>shipper</strong> do, and what are <strong>nominations</strong> and <strong>balancing</strong>? What is Britain's <strong>NBP</strong>?</li>
<li>Distinguish <strong>gas-on-gas competition</strong> from <strong>oil-indexed pricing</strong>. Who uses each, and what is the main criticism of oil-indexation?</li>
<li>Define the three capacity-tariff methods — <strong>postage-stamp, point-to-point, entry-exit</strong> — and match each to the network type it suits.</li>
<li>What problem does <strong>Regulation 994/2010</strong> address, and name two EU policy responses to security of supply.</li>
<li>Using <strong>Boxes 9.1–9.3</strong>, explain: how British <strong>entry auctions</strong> underpin investment; why <strong>~90%</strong> of US rate cases <strong>settle</strong>; and why <strong>more retail tariffs</strong> did not straightforwardly mean <strong>more competition</strong>.</li>
</ol>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
