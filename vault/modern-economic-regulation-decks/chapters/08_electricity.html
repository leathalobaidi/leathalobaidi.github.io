<header>Ch 8 · Electricity regulation</header>
<h2 id="learning-objectives">Learning objectives</h2>
<p>By the end you should be able to:</p>
<ul>
<li>Explain the <strong>physical &amp; economic characteristics</strong> that make electricity unlike almost any other commodity — instantaneous balancing, non-storability, a synchronised network, line losses, nodes and loop flow.</li>
<li>Identify which parts of the supply chain are <strong>natural monopoly</strong> (wires) and which are <strong>potentially competitive</strong> (generation, retail).</li>
<li>Describe the <strong>four-stage supply chain</strong> plus system operation.</li>
<li>Compare <strong>wholesale trading arrangements</strong>: gross/net pools, bilateral trading, exchanges, capacity markets, FTRs.</li>
<li>Explain the <strong>approach to regulation</strong>: price caps, RAB/building blocks, rate of return, quality &amp; performance incentives.</li>
<li>Analyse the three big <strong>policy issues</strong>: competition, coordination &amp; investment (incl. &quot;missing money&quot; and nodal pricing), and environmental policy.</li>
</ul>
<div class="key"><b>Key terms:</b> non-storability · system operation · node · loop flow · line losses · natural monopoly · electricity pool (gross/net) · bilateral trading · FTR · capacity market · price cap · RAB · building blocks · rate of return · missing money · LMP/nodal vs zonal · deep vs shallow connection · ETS · feed-in tariff · smart grid · demand-side management · time-of-use / critical-peak pricing.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" class="part" data-marpit-pagination="3" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>

<h4 id="part-1">Part 1</h4>
<h1 id="physical--economic-characteristics">Physical &amp; economic characteristics</h1>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="4" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="why-electricity-matters--and-why-it-is-different">Why electricity matters — and why it is different</h2>
<ul>
<li>Electricity is <strong>fundamental</strong> to modern economies: an input to almost all production and a final good for households and businesses.</li>
<li>Shortages are costly: the <strong>2003 blackouts</strong> (northern USA, Canada, Italy) and a 2013 estimate that Pakistan's shortages cut growth by <strong>~2% a year</strong> show the stakes.</li>
<li>Safe, reliable supply is critical to <strong>economic performance and consumer welfare</strong> — which is why the industry is so heavily regulated.</li>
</ul>
<div class="key">The chapter's logic: understand the <b>physics and economics</b> first, because they determine <b>what can be competitive</b>, <b>what must be regulated</b>, and <b>how tightly the stages must be coordinated</b>.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="5" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="characteristics-of-the-product-1">Characteristics of the product (1)</h2>
<div class="cols">
<div class="card">
<p><strong>Standardised at production</strong><br />
Made from many inputs (coal, gas, oil, nuclear, hydro, wind, solar, biomass, geothermal), but each source yields a <strong>standardised unit</strong> of electricity at the point of production.</p>
</div>
<div class="card">
<p><strong>Non-storable</strong><br />
Electricity generally <strong>cannot be stored</strong> economically — what is produced must be consumed almost immediately. You cannot build up inventories to buffer supply and demand.</p>
</div>
</div>
<div class="def"><b>Non-storability</b> is the master fact of the industry. It rules out the stock-buffering that stabilises almost every other market, so balancing must happen in <b>real time</b>.</div>
<div class="small">Limited exceptions exist — ponded/pumped-storage hydro, flywheels, capacitors, batteries — but these were traditionally seen as inefficient or small-scale.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="6" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="characteristics-of-the-product-2--balancing">Characteristics of the product (2) — balancing</h2>
<ul>
<li>Because it cannot be stored, <strong>supply and demand must be held in equilibrium continuously</strong> — at every instant of the day and at <strong>every point on the network</strong>.</li>
<li>A failure to balance on <strong>one part</strong> of the network can cause <strong>systemic failure across the whole network</strong> — not just for local customers.</li>
<li>So a shortfall or surplus anywhere threatens the <strong>stability of the entire grid</strong>, and therefore <em>all</em> customers.</li>
</ul>
<div class="box"><b>Consequence:</b> supply is <b>complex and tightly coordinated</b>. The stages of the chain cannot act independently — they form, in the classic phrase, <b>"one large machine."</b></div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="7" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="characteristics-of-the-product-3--emissions--demand">Characteristics of the product (3) — emissions &amp; demand</h2>
<ul>
<li>Electricity <strong>production is a large emitter</strong> of greenhouse gases (CO₂, SO₂, NOₓ). This makes the industry a central target of climate policy (see Part 5) — reshaping generation, networks <em>and</em> consumption.</li>
<li><strong>Demand is highly inelastic in the short run</strong>:
<ul>
<li>Most consumers are on <strong>fixed average-price retail contracts</strong>, not exposed to real-time wholesale prices.</li>
<li>Short-run substitution / consumption cuts are limited (though heating/cooking can substitute to gas).</li>
</ul>
</li>
</ul>
<div class="key">Inelastic demand + non-storability = the market cannot easily "self-correct" a price spike by shedding load. This is central to why even <b>small generators</b> can wield market power.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="8" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="the-transmission-network--nodes-and-power-flows">The transmission network — nodes and power flows</h2>
<div class="def"><b>Node:</b> a point on the transmission network where power is <b>injected</b> (by a generator) or <b>withdrawn</b> (by a buyer / load-serving entity).</div>
<ul>
<li>Generators do <strong>not</strong> sell a specific electron to a specific buyer. They inject a quantity of indistinguishable electrons at a node; buyers withdraw their quantity at the nearest node.</li>
<li>Unlike trains on rails or gas in pipes, you <strong>cannot direct power along a chosen path</strong>. Flows follow the <strong>laws of physics</strong> (Kirchhoff's laws — the path of least resistance).</li>
</ul>
<div class="box"><b>Loop flow:</b> exporting power from France to Germany can cause large real flows through Belgium, the Netherlands and Switzerland. Trades in one place physically load lines somewhere else.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="9" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="system-operation">System operation</h2>
<div class="def"><b>System operation:</b> the task of ensuring injections match withdrawals so the system stays "in balance" — <b>minute by minute, at all nodes, at all times.</b></div>
<ul>
<li>Someone must continuously match supply and demand and manage the network in real time.</li>
<li>In the USA this is often done by an <strong>Independent System Operator (ISO)</strong> — a <strong>not-for-profit</strong> entity, <strong>separate</strong> from the transmission owner, that also runs competitive markets.</li>
<li>In some places (e.g. National Grid in England) the transmission owner also operated the system, under its own price control with cost-minimising incentives.</li>
</ul>
<div class="small">The independent SO is one of the key institutional innovations that made vertical separation workable (see Part 4, coordination).</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="10" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="line-losses-and-congestion">Line losses and congestion</h2>
<div class="cols">
<div class="card">
<p><strong>Line losses</strong><br />
Energy (largely thermal) lost in transport. Inject <strong>100 MWh</strong>, and on average only <strong>~93 MWh</strong> is withdrawn ⇒ <strong>~7%</strong> total T&amp;D losses. Losses rise with <strong>distance</strong> and <strong>lower voltage</strong>.</p>
</div>
<div class="card">
<p><strong>Congestion</strong><br />
A line is <strong>congested</strong> when it hits its capacity limit. To keep balance, generation/consumption must be adjusted elsewhere.</p>
</div>
</div>
<div class="box"><b>Why congestion matters economically:</b> a constraint can block cheap power from reaching demand — buyers must turn to <b>higher-cost generators</b> on the "right side" of the constraint ⇒ <b>higher prices for consumers</b>.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="11" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="market-power-pockets-from-constraints">Market-power &quot;pockets&quot; from constraints</h2>
<ul>
<li>Where a constraint limits <strong>imports</strong> into a region, generators <strong>inside</strong> that import-constrained region become <strong>pivotal</strong> to meeting demand.</li>
<li>Even a generator with a <strong>small share</strong> can then raise the price of the marginal MWh needed to keep the lights on.</li>
<li>Constraints therefore <strong>shelter</strong> local generators from competition elsewhere.</li>
</ul>
<div class="key">This is worse in electricity than in other markets: no inventories to discipline a price spike, and demand is inelastic in the short run, so consumers can't quickly punish the abuse. Central theme for Part 5.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="12" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="which-parts-are-monopoly-which-are-competitive">Which parts are monopoly, which are competitive?</h2>
<div class="cols">
<div class="card">
<p><strong>Natural monopoly — the wires</strong><br />
<strong>Transmission</strong> and <strong>distribution</strong> networks: large <strong>sunk</strong> costs, <strong>immobile</strong> long-lived assets, increasing returns. Inefficient to duplicate ⇒ classic <strong>natural monopoly</strong> ⇒ <strong>regulate</strong>.</p>
</div>
<div class="card">
<p><strong>Potentially competitive</strong><br />
<strong>Generation</strong> (modest scale economies; diverse technologies can compete) and <strong>retail supply</strong> (low fixed/sunk costs of trading &amp; marketing) ⇒ <strong>open to competition</strong>.</p>
</div>
</div>
<div class="def">This split is the organising idea of the whole chapter: <b>compete where you can, regulate the network you must share.</b> The competitive segments still depend on the regulated core network.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" class="part" data-marpit-pagination="13" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>

<h4 id="part-2">Part 2</h4>
<h1 id="the-electricity-supply-chain">The electricity supply chain</h1>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="14" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="the-four-stages--system-operation">The four stages (+ system operation)</h2>
<p><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> <strong>Figure 8.1 — the electricity network (in words):</strong></p>
<ul>
<li><strong>Generation</strong> (many plants, competitive) injects power into the <strong>high-voltage transmission</strong> grid.</li>
<li><strong>Transmission</strong> carries it long distances to load centres; <strong>transformer substations</strong> step voltage <strong>down</strong>.</li>
<li><strong>Distribution</strong> (lower-voltage, local wires) delivers to industrial, commercial and residential customers.</li>
<li><strong>Distributed generation</strong> (rooftop solar, small wind, CHP) connects <em>directly</em> to the distribution network.</li>
<li><strong>Retail supply</strong> sits over the top: retailers sell to end-customers and bundle all the underlying charges.</li>
</ul>
<div class="key">Rough cost shares of a household bill (Britain, 2012): wholesale generation & supply ≈ <b>54%</b>, distribution ≈ <b>18%</b>, transmission ≈ <b>5%</b>; the rest = environmental, other, VAT. (USA 2010: generation ≈ 60%, distribution ≈ 30%.)</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="15" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="stage-1--generation">Stage 1 — Generation</h2>
<ul>
<li>Inputs: <strong>non-renewable</strong> (coal, gas, oil, nuclear) and <strong>renewable</strong> (hydro, solar, tidal, wind, biomass, geothermal). 2007 world mix: coal 42%, gas 21%, hydro 16%, nuclear 14%, oil 5%, non-hydro renewables ~2.5%.</li>
<li>Plants classed by <strong>operating pattern</strong> and variable cost:</li>
</ul>
<table>
<thead>
<tr>
<th>Type</th>
<th>Runs</th>
<th>Variable cost</th>
<th>Flexibility</th>
<th>Typical source</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Base-load</strong></td>
<td>many hours/yr</td>
<td>low</td>
<td>inflexible</td>
<td>nuclear, coal</td>
</tr>
<tr>
<td><strong>Intermediate</strong></td>
<td>mid</td>
<td>mid</td>
<td>moderate</td>
<td>older/less-efficient plant</td>
</tr>
<tr>
<td><strong>Peaking</strong></td>
<td>few hours/yr</td>
<td>high</td>
<td>starts/stops fast</td>
<td>gas turbines</td>
</tr>
</tbody>
</table>
<div class="small">Nuclear: high sunk cost + long lead times, very low marginal cost, plus decommissioning/waste costs. An efficient system holds a <b>mix</b> of technologies. Wind/solar are <b>intermittent</b>, needing conventional reserves alongside.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="16" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="stage-2--transmission">Stage 2 — Transmission</h2>
<ul>
<li>Transports power at <strong>high voltage</strong> over long distances to major load centres (minimising losses).</li>
<li><strong>Highly capital-intensive</strong>, large <strong>sunk</strong> costs, immobile assets ⇒ the <em>&quot;classic natural monopoly.&quot;</em></li>
<li>Efficiency of an electric system depends on transmission <strong>structure</strong> (where generation sits relative to demand), <strong>losses</strong>, and <strong>capacity/congestion</strong>.</li>
</ul>
<div class="key">Because flows obey physics (loop flow) and constraints create "pockets" of market power, transmission is not just a cost centre — its <b>design and pricing shape competition</b> in generation.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="17" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="stage-3--distribution">Stage 3 — Distribution</h2>
<ul>
<li>Once power reaches a load centre, <strong>transformers step the voltage down</strong> for safe local use.</li>
<li>Dense physical infrastructure (wires, poles, cables, substations) covering every customer in an area; large sunk, immobile assets ⇒ <strong>natural-monopoly-like</strong>. Strong <strong>economies of density</strong>.</li>
<li>Structure: usually <strong>few</strong> transmission companies but <strong>many</strong> distributors — Britain <strong>14</strong>, Australia <strong>16</strong>, some EU countries <strong>100s</strong>.</li>
</ul>
<div class="box"><b>Distributed / embedded generation</b> (rooftop solar, small wind, CHP, biomass) connects directly to distribution. Networks built for <b>one-way</b> flow now see <b>two-way</b> flows ⇒ need <b>active management</b>, new connection/interconnection standards, less predictable flows.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="18" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="stage-4--retail-supply">Stage 4 — Retail supply</h2>
<ul>
<li>The final stage: selling electricity to <strong>end-consumers</strong>. Where retail competition exists, <strong>distribution</strong> (delivering power) and <strong>retail supply</strong> (selling it) are <strong>separated</strong>.</li>
<li>Retailers <strong>bundle</strong> all upstream charges — wholesale generation, transmission, distribution, plus retailing/marketing — into a single <strong>tariff</strong>.</li>
<li>Even when separated for regulation, the two functions may sit under <strong>common ownership</strong>.</li>
</ul>
<div class="cols">
<div class="card">
<p><strong>Tariff innovation</strong><br />
Dual-fuel (gas + electricity), <strong>green</strong> tariffs, <strong>real-time</strong> tariffs (shift wholesale-price risk to consumers).</p>
</div>
<div class="card">
<p><strong>Smart meters</strong><br />
Near real-time consumption info ⇒ consumers can control use and support emissions reduction (Box 8.3).</p>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" class="part" data-marpit-pagination="19" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>

<h4 id="part-3">Part 3</h4>
<h1 id="wholesale-trading-arrangements">Wholesale trading arrangements</h1>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="20" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="from-vertical-integration-to-markets">From vertical integration to markets</h2>
<ul>
<li>Until the 1980s, all stages were usually run by a <strong>single vertically integrated entity</strong> — <strong>privately owned but regulated</strong> (USA) or <strong>state-owned</strong> (most of Europe, Latin America, Australia).</li>
<li>Restructuring introduced <strong>competition in generation</strong>, which needed <strong>new trading arrangements</strong> so entrants could contract with buyers.</li>
<li><strong>USA — PURPA 1978:</strong> created <strong>qualifying facilities</strong> (small/co-generation plants); incumbents had to buy their power on an <strong>avoided-cost</strong> basis ⇒ birth of <strong>Independent Power Producers (IPPs)</strong>. Comprehensive US restructuring really began <strong>mid-1990s</strong>.</li>
<li><strong>Chile (early 1980s)</strong> and <strong>England &amp; Wales (1990 Pool)</strong> were early movers, splitting incumbents into separate generation companies.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="21" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="electricity-pools--how-they-work">Electricity pools — how they work</h2>
<div class="def"><b>Electricity pool:</b> a centralised, often compulsory wholesale spot market — an <b>auction</b> in which generators sell and load customers buy.</div>
<ul>
<li>Generators submit <strong>advance bids</strong> to supply in a given interval (e.g. each half-hour of the next day).</li>
<li>Bids set the <strong>dispatch / merit order</strong> to meet expected demand.</li>
<li>A <strong>market-clearing price</strong> is struck for each interval (where supply offers meet demand); <strong>all</strong> scheduled generators are paid this <strong>system marginal price</strong>.</li>
<li>If bids reflect <strong>marginal cost</strong>, the merit order gives <strong>efficient dispatch</strong>, and the clearing price = operating cost of the <strong>marginal plant</strong>.</li>
</ul>
<div class="small">To manage price volatility, participants <b>hedge</b> with financial contracts, e.g. <b>Contracts for Differences (CfDs)</b>.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="22" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="gross-pool-vs-net-pool">Gross pool vs net pool</h2>
<p><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> <strong>Figure 8.2 — gross power pool (in words):</strong> Generators A–D (coal, CCGT, nuclear, renewable) each <strong>bid power in</strong> for an interval and receive the <strong>Pool Purchase Price</strong>. Suppliers 1–3 <strong>buy</strong> and pay the <strong>Pool Selling Price</strong>; each consumer pays a retail price. Sellers and buyers <strong>never trade directly</strong> — the Pool sits between them; CfDs run alongside for hedging.</p>
<table>
<thead>
<tr>
<th>Feature</th>
<th><strong>Gross pool</strong></th>
<th><strong>Net pool (voluntary)</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td>Trade via pool</td>
<td><strong>Mandatory</strong> for all output</td>
<td><strong>Optional</strong></td>
</tr>
<tr>
<td>Direct bilateral deals</td>
<td>No</td>
<td><strong>Yes</strong></td>
</tr>
<tr>
<td>Interface</td>
<td>Seller → pool → buyer</td>
<td>Bilateral + day-ahead + balancing</td>
</tr>
<tr>
<td>Examples</td>
<td>E&amp;W Pool 1990–2001, Australia <strong>NEM</strong>, Irish <strong>AIM</strong></td>
<td>Norway/<strong>NordPool</strong>, Britain <strong>NETA</strong> (2001), then <strong>BETTA</strong></td>
</tr>
</tbody>
</table>
<div class="small">England & Wales moved from a <b>gross pool (1990)</b> to <b>NETA (2001)</b> — a net/voluntary arrangement — partly over fears generators were <b>manipulating the pool price</b>.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="23" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="bilateral-trading-exchanges--balancing">Bilateral trading, exchanges &amp; balancing</h2>
<ul>
<li>Under <strong>net/bilateral</strong> arrangements, generators and load customers contract <strong>directly</strong>; price is set by <strong>negotiation</strong> (tender or OTC), with day-ahead exchanges to adjust positions.</li>
<li>Even so, physical traders must <strong>notify the system operator</strong> of injections/withdrawals.</li>
<li>A <strong>close-to-real-time balancing market</strong> clears any residual imbalance to keep the system in balance.</li>
</ul>
<div class="cols">
<div class="card">
<p><strong>Who runs the day-ahead spot?</strong><br />
<strong>Europe:</strong> an independent <strong>power exchange</strong>.<br />
<strong>USA:</strong> the <strong>system operator</strong>.</p>
</div>
<div class="card">
<p><strong>Pay-as-bid vs marginal price</strong><br />
Britain's balancing market is <strong>pay-as-bid</strong> — each trader is paid <strong>their own offer</strong>, not the system marginal price.</p>
</div>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="24" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="the-single-buyer-model-a-partial-reform">The single-buyer model (a partial reform)</h2>
<div class="def"><b>Single-buyer model:</b> one nominated company (e.g. the transmission operator, or a vertically integrated incumbent) acts as the <b>sole buyer</b> of all power from independent producers.</div>
<ul>
<li>Competition happens <strong>upstream</strong>: the single buyer runs <strong>periodic competitive tenders</strong> for new capacity, then signs a <strong>power purchase agreement (PPA)</strong> with the winner.</li>
<li>Common in many <strong>Asian, African and Eastern European</strong> countries — a more partial form of competition.</li>
</ul>
<div class="box"><b>Risks:</b> can <b>misallocate risk</b>; creates scope for <b>ex-post opportunism</b> by the monopsony buyer; long-term PPAs can become <b>stranded</b>.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="25" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="electricity-markets--exchanges">Electricity markets &amp; exchanges</h2>
<ul>
<li>A rich set of markets emerged to trade different &quot;products&quot; and manage <strong>price risk</strong>:
<ul>
<li><strong>Temporally differentiated:</strong> OTC → day-ahead spot → close-to-real-time balancing (e.g. NordPool).</li>
<li><strong>Ancillary-services</strong> markets — keep frequency/voltage/loading within limits.</li>
<li><strong>Financial transmission rights</strong> and <strong>capacity markets</strong> (next slides).</li>
</ul>
</li>
<li><strong>Exchanges</strong> (e.g. EEX, IPEX, Belpex, APX, POLPX) allow OTC contracts plus <strong>futures/forwards</strong> for hedging. Physical trades still need SO scheduling.</li>
</ul>
<div class="key"><b>Regional</b> markets often cross borders: <b>NordPool</b> (Denmark, Sweden, Norway, Finland; regulators cooperate via NordREG), <b>MIBEL</b> (Spain + Portugal), <b>PJM</b> (13 US states + DC), Midwest ISO, New England; Australia's <b>NEM</b> covers 5 regions.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="26" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="financial-transmission-rights-ftrs">Financial transmission rights (FTRs)</h2>
<div class="def"><b>FTR:</b> not a physical right to deliver power. It gives the holder a <b>share of the congestion revenues</b> on a transmission path — a way to <b>hedge</b> exposure to congestion costs.</div>
<ul>
<li>Prominent in some <strong>US regional markets</strong>; also called <strong>Transmission Congestion Contracts (TCCs)</strong>.</li>
<li><strong>Congestion revenue</strong> arises because load pays the SO more (at its node) than the SO pays generation (at its node) when lines are constrained.</li>
<li>By holding FTRs matched to their energy deliveries, participants become <strong>indifferent to congestion</strong> — reimbursed the extra cost congestion imposes.</li>
</ul>
<div class="small">Forms: <b>point-to-point</b> (between two nodes — accurate but hard to estimate) and <b>flowgate</b> (attached to a known-congested link). Sold by the ISO in annual/seasonal/monthly auctions. See Box 8.2.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="27" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="capacity-markets">Capacity markets</h2>
<div class="def"><b>Capacity market:</b> load customers must buy enough <b>capacity</b> to cover expected loads (plus reserves) — paying generators to <b>be available</b>, not just for energy produced.</div>
<ul>
<li>Particularly prevalent in the <strong>USA</strong>; most European countries have <strong>none</strong>.</li>
<li>Purpose: compensate generators for <strong>providing capacity where it is most needed</strong> — addressing the <strong>&quot;missing money&quot;</strong> problem (Part 5).</li>
<li>With a capacity market, the regulator can <strong>cap energy prices lower</strong>, since some fixed costs are recovered via capacity payments.</li>
</ul>
<div class="key">Capacity markets are one answer to the investment question: will an energy-only market pay generators enough to build the capacity the system needs? Controversial in both theory and practice.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" class="part" data-marpit-pagination="28" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>

<h4 id="part-4">Part 4</h4>
<h1 id="approach-to-regulation">Approach to regulation</h1>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="29" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="what-is-regulated-what-is-not">What is regulated, what is not</h2>
<div class="cols">
<div class="card">
<p><strong>Competitive → light-touch</strong><br />
<strong>Generation</strong> and <strong>retail supply</strong> are treated as potentially competitive. Price controls have largely been <strong>withdrawn</strong> (UK, Australia; USA for generators without market power) — but oversight remains.</p>
</div>
<div class="card">
<p><strong>Core network → price-controlled</strong><br />
<strong>Transmission</strong> and <strong>distribution</strong> are subject to <strong>price/revenue controls</strong> almost everywhere — their cost characteristics approximate <strong>natural monopoly</strong>.</p>
</div>
</div>
<ul>
<li>Networks must offer <strong>non-discriminatory access</strong> on efficient terms — the competitive segments depend on them.</li>
<li><strong>System operation</strong> is also regulated in some places (own price control in Britain; recovered via a <strong>grid/management tariff</strong> approved by FERC in the USA).</li>
</ul>
<div class="small">The "standard model" of restructuring: corporatise/privatise; independent regulator; vertical & horizontal restructuring; transmission-access rules; IPPs; independent SO; retail-tariff unbundling; markets. In practice, jurisdictions <b>deviated</b> widely.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="30" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="price-caps--the-building-block-rab">Price caps + the building-block RAB</h2>
<div class="def"><b>Price cap:</b> the regulator sets a ceiling on the average increase in prices/revenues for a set of services over a fixed period (say 5 years). Used in the UK, Australia, much of Europe, parts of Latin America and some US states.</div>
<ul>
<li>Variants: <strong>total revenue cap</strong>, <strong>average revenue cap</strong>, <strong>weighted-average price cap</strong>.</li>
<li>The revenue requirement is usually set via the <strong>building-block approach</strong>:</li>
</ul>
<div class="key"><b>Building blocks (RAB-based):</b> allowed revenue = efficient <b>operating costs</b> + <b>depreciation</b> + a <b>return on the Regulatory Asset Base (RAB)</b>. The firm should recover efficient costs and earn a return on capital invested — no more.</div>
<div class="small">Note: despite the flexibility price caps allow, network firms have generally <b>not</b> developed efficient pricing structures (e.g. peak-load / time-of-use), and regulators mostly haven't required them to.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="31" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="incentives-inside-the-price-cap">Incentives inside the price cap</h2>
<p>Price caps for networks typically bolt on targeted incentive schemes:</p>
<ul>
<li><strong>Capex</strong> — ensure firms respond to investment signals <em>and</em> keep projects efficient. Ofgem's <strong>&quot;menu&quot; regulation</strong>: firms choose <strong>low allowance + high-powered incentive</strong> (higher expected return) <em>or</em> <strong>high allowance + low-powered incentive</strong>.</li>
<li><strong>Opex efficiency</strong> — <strong>cost benchmarking</strong> sets base-year costs and tests forecast efficiency: <strong>TFP</strong>, partial performance indicators, <strong>DEA</strong>, and <strong>econometric</strong> models.</li>
<li><strong>Service quality</strong> — Britain: a <strong>losses</strong> incentive, an <strong>interruptions</strong> scheme, a <strong>customer-satisfaction</strong> reward. Australia: a <strong>service target performance scheme</strong>. Netherlands: quality linked to allowed revenue.</li>
<li><strong>Innovation &amp; demand management</strong> — reward connecting distributed generation and DSM.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="32" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="rate-of-return-ror-regulation">Rate of return (ROR) regulation</h2>
<div class="def"><b>Rate of return:</b> lets the network recover all costs of the regulated services <b>plus a "fair" return</b> on its regulated asset base. Still the most common approach in <b>North America</b>.</div>
<ul>
<li>Two stages: set the <strong>overall revenue requirement</strong>, then design the <strong>tariff/rate structure</strong>.</li>
<li>Built-in incentive elements: <strong>regulatory lag</strong>; <strong>&quot;used and useful&quot;</strong> / <strong>prudence</strong> tests on the asset base; <strong>disallowance</strong> of inefficiently incurred costs.</li>
<li>From the early 1980s some US states added <strong>performance-based</strong> measures: price caps, <strong>rate freezes / moratoria</strong>, <strong>efficiency-sharing</strong>, and quality targets (interruptions, call-centre response, cost thresholds).</li>
</ul>
<div class="small">Comprehensive incentive regulation has been <b>slow to spread</b> in the US power sector — but rising input prices and capacity needs (more costly rate cases) may make alternatives to ROR more attractive.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="33" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<div class="box">
<h3 id="box-81--yardstick-competition-in-the-netherlands">Box 8.1 · Yardstick competition in the Netherlands</h3>
<div class="tag">Example</div>
<ul>
<li><strong>Yardstick competition (Shleifer 1985):</strong> tie a regulated firm's allowed prices to the <strong>costs of comparable firms</strong>, creating a form of competition between firms in <strong>separate markets</strong> — each is judged against the others, not itself.</li>
<li>The Netherlands has applied it to <strong>distribution companies for over a decade</strong>; benchmark efficiency estimates drive the <strong>&quot;X&quot; factor</strong> in price controls.</li>
<li>Methods: <strong>parametric</strong> (OLS, COLS, SFA regressions) and <strong>non-parametric</strong> (<strong>DEA</strong> linear programming).</li>
<li>A distinctive feature: a <strong>&quot;q-factor&quot;</strong> for comparative <strong>quality</strong> is written <strong>directly into the price formula</strong> — rewarding/penalising firms on service quality.</li>
</ul>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="34" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<div class="box">
<h3 id="box-81--netherlands-cont--the-lessons">Box 8.1 · Netherlands (cont.) — the lessons</h3>
<div class="tag">Lesson</div>
<ul>
<li>The first 2000 benchmarking exercise was <strong>controversial</strong> — Nillesen &amp; Pollitt estimate it <strong>cost consumers ~€140m</strong>. Faults: relying on <strong>one method</strong> (DEA) and applying results <strong>mechanically</strong> to set X.</li>
<li>Concerns about benchmarking generally: it can invite <strong>gaming</strong>; it is <strong>subjective</strong>; several legitimate methods give <strong>very different answers</strong> with no clear way to choose.</li>
<li><strong>Takeaway:</strong> benchmarking results should be <strong>one instrument among several</strong> in regulatory judgement — <strong>not a mechanical rule</strong>. After adaptations, a yardstick-plus-price-cap system (with a common industry-average benchmark and TFP-based X) is still used.</li>
</ul>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-class="part" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" class="part" data-marpit-pagination="35" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--class:part;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>

<h4 id="part-5">Part 5</h4>
<h1 id="regulatory-policy-issues">Regulatory policy issues</h1>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="36" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="the-three-big-debates">The three big debates</h2>
<div class="cols3">
<div class="card">
<p><strong>A · Competition</strong><br />
Is generation &amp; retail <em>actually</em> competitive? Market power, concentration, switching, default tariffs, re-regulation.</p>
</div>
<div class="card">
<p><strong>B · Coordination &amp; investment</strong><br />
Do separated markets deliver enough, timely investment? &quot;Missing money,&quot; nodal vs zonal pricing, connection charging, policy instability.</p>
</div>
<div class="card">
<p><strong>C · Environment</strong><br />
Emissions, cap-and-trade/ETS, renewables &amp; feed-in tariffs, smart grids/meters, demand-side management, dynamic pricing.</p>
</div>
</div>
<div class="key">Restructuring's <b>"standard model"</b> was widely adopted but rarely followed to the letter — outcomes are a <b>patchwork</b>. These three debates explain why.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="37" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="restructuring-scope--drivers">Restructuring: scope &amp; drivers</h2>
<ul>
<li><strong>Drivers differed.</strong> UK/Europe/Australia/NZ/Latin America: restructuring was part of a <strong>broader utility-reform / privatisation</strong> agenda (and, in the EU, building a <strong>single internal electricity market</strong>). USA: utilities were <strong>already private</strong> — the case rested more on <strong>lower consumer prices</strong> than ideology.</li>
<li><strong>Scope of separation ranged widely</strong>:
<ul>
<li><strong>Full</strong> horizontal <em>and</em> vertical separation — <strong>England &amp; Wales</strong>, some Australian states.</li>
<li><strong>Partial</strong> — activities remain combined in one entity (some EU countries, some US states).</li>
<li><strong>Developing countries</strong> — mainly competition in generation via <strong>IPPs</strong> alongside a state-owned integrated utility.</li>
</ul>
</li>
</ul>
<div class="small"><b>USA:</b> FERC Orders (888/889/890, Order 2000) mandated non-discriminatory transmission access and regional transmission organisations. <b>EU:</b> three Electricity Directives (1996, 2003, 2009) progressively forced <b>unbundling</b> of network activities.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="38" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="restructuring-mixed-evidence">Restructuring: mixed evidence</h2>
<div class="box">
<p>Pollitt (2007): <em>&quot;the evidence on the success of electricity reform is surprisingly mixed.&quot;</em></p>
</div>
<ul>
<li><strong>USA — patchwork.</strong> Reform began mid-1990s (Massachusetts, Rhode Island, California), spread to ~12 states by 2000, then the <strong>2000–01 California collapse</strong> triggered delays, cancellations and calls for <strong>re-regulation</strong>. Joskow: a system <em>&quot;1/3 reformed and 2/3 stuck.&quot;</em> Where reform did happen: lower prices, more efficient dispatch (e.g. PJM), better wholesale markets.</li>
<li><strong>Europe — pioneers vs laggards.</strong> UK &amp; Norway led; France &amp; Germany lagged. Concentration stays <strong>high</strong>; distribution bundling remains an obstacle; the single EU market is still largely <strong>national</strong> (regional markets like NordPool/MIBEL aside).</li>
<li><strong>Positive cases:</strong> UK, Netherlands, Nordics — productivity gains, some price falls/convergence. Latin America: Chile &amp; Argentina &quot;poster cases,&quot; Brazil problematic. Overall: only a <strong>small number</strong> of countries progressed far.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="39" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="a--competition-in-wholesale-generation">A · Competition in wholesale generation</h2>
<ul>
<li><strong>Market power</strong> is the recurring worry. Documented abuse in the <strong>early E&amp;W Pool</strong> and <strong>California</strong>; issues also in NZ, Chile, Colombia, US (PJM, Texas), Alberta, Brazil, parts of Europe.</li>
<li>Why electricity is <strong>especially vulnerable</strong> (even small firms can exploit it):
<ul>
<li><strong>Transmission constraints</strong> create geographic <strong>&quot;pockets&quot;</strong> of market power.</li>
<li><strong>Non-storability</strong> — no inventories to discipline a spike.</li>
<li><strong>High generation concentration</strong>.</li>
<li><strong>Inelastic demand</strong> + limited short-run supply substitution.</li>
</ul>
</li>
<li>Any abuse can transfer <strong>enormous rents</strong> from consumers to producers in <strong>very short periods</strong>.</li>
</ul>
<div class="key">Yet several markets work reasonably well despite periodic concerns — <b>PJM, New England, New York, the Australian NEM, and Britain</b> are cited as reasonably well-functioning competitive wholesale markets.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="40" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="a--competition-in-retail-supply">A · Competition in retail supply</h2>
<p><strong>Arguments for retail competition:</strong> limits political interference in prices; spurs <strong>tariff innovation</strong> (dual-fuel, green, online, price-guarantee); enables tariffs that track wholesale prices, improving <strong>demand response</strong>.</p>
<p><strong>Arguments against full retail competition (to households):</strong> prices become <strong>more volatile</strong> (politically hard); consumers are <strong>volatility-averse</strong> and won't monitor usage; needs major <strong>metering</strong> infrastructure; doubts consumers respond to real-time prices.</p>
<div class="box"><b>Default / standard tariffs matter hugely.</b> Where the incumbent's default tariff is set <b>below wholesale cost</b> (some US states), rivals <b>can't attract customers</b>. Where a well-designed default ("price to beat" in Texas) incentivised switching, participation was high.</div>
<div class="small">Scorecard: strong switching & innovation in the <b>Nordics</b> and <b>Texas</b>; "disappointing" switching in many US states; high concentration in parts of Europe.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="41" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="a--britains-retail-u-turn--re-regulation">A · Britain's retail U-turn — re-regulation</h2>
<ul>
<li>Up to <strong>2008</strong>: Ofgem viewed retail competition as <strong>effective</strong> — strong switching, innovative tariffs, better service.</li>
<li>Reassessed: by <strong>2011</strong> Ofgem concluded competition was <em>&quot;being stifled by a combination of tariff complexity, poor supplier behaviour, and lack of transparency.&quot;</em></li>
<li>Tariff numbers had <strong>&quot;bamboozled&quot;</strong> customers — rising from <strong>180 to 300+</strong> since 2008.</li>
<li><strong>Response:</strong> government/regulator <strong>restricted the number of tariffs</strong> suppliers may offer (see Box 9.3, Ch 9).</li>
</ul>
<div class="key"><b>Lesson:</b> "competition introduced" ≠ "competition working." Complexity can be used <b>strategically</b> to blunt switching — prompting a partial <b>return to regulation</b>.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="42" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="b--coordination--the-case-for-integration">B · Coordination &amp; the case for integration</h2>
<ul>
<li>Electricity is <em>&quot;one large machine&quot;</em> — tight <strong>physical &amp; economic interdependence</strong> between generation and transmission ⇒ potential <strong>economies of integration</strong>.</li>
<li>Separating activities risked <strong>coordination failures</strong>:
<ul>
<li><strong>Short-term (operational):</strong> constant matching of supply &amp; demand at every point.</li>
<li><strong>Long-term (investment):</strong> where a generator sites its plant drives how much transmission must be built.</li>
</ul>
</li>
<li>Other integration benefits argued: <strong>risk management</strong> (hedging price volatility between generation and retail), and <strong>mitigating market power</strong> (an integrated generator has less incentive to gouge its own retail affiliate).</li>
</ul>
<div class="small">Fear at restructuring: separation could raise <b>transaction/information costs</b> and create <b>bilateral-monopoly "hold-up"</b>, chilling investment.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="43" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="b--how-coordination-fears-were-partly-resolved">B · How coordination fears were (partly) resolved</h2>
<ul>
<li><strong>Short-term:</strong> the <strong>independent system operator</strong> function — separate from the transmission owner — largely solved operational coordination, ensuring <strong>non-discriminatory dispatch</strong> and reliability.</li>
<li><strong>Long-term:</strong> coordinating <strong>generation + transmission investment</strong> remains hard — sharpened by the need for big new investment and by renewables in <strong>remote</strong> locations. Debate over whether a <strong>centralised transmission planner</strong> should co-optimise both.</li>
<li><strong>Re-integration in practice:</strong> across Australia, Britain, NZ, firms <strong>re-integrated generation + retail</strong>; <strong>stand-alone retail entrants often failed</strong> (Britain, Netherlands, Australia, NZ).</li>
</ul>
<div class="box"><b>The trade-off:</b> integration can cut transaction costs and hedge market-power exposure — but if a <b>dominant</b> generator integrates with retail, it can <b>foreclose</b> rivals and reduce competition. Empirical scope-economy studies are <b>mixed/inconclusive</b>.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="44" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="b--investment-in-generation--missing-money">B · Investment in generation — &quot;missing money&quot;</h2>
<div class="def"><b>Missing money problem:</b> in a competitive energy-only market, prices sit near marginal cost most of the time. Generators only recover fixed costs in the few high-price, tight-demand hours. If a regulator <b>caps</b> prices in those hours (to curb market power), the revenue to justify new capacity <b>goes missing</b>.</div>
<ul>
<li>Result: generators may be <strong>reluctant to invest</strong> — they can't be sure energy-market revenues will cover the investment.</li>
<li><strong>Fixes:</strong> a <strong>capacity market</strong> (load must buy capacity + reserves) lets generators earn outside the energy market, so energy prices can be capped lower. Alternative: <strong>capacity payments</strong> fixed to incentivise investment.</li>
<li>Complications: market-power mitigation and SO actions can <strong>suppress scarcity prices</strong> further; <strong>policy instability</strong> (nuclear? which renewables to subsidise?) deters big commitments.</li>
</ul>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="45" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="b--investment-in-transmission">B · Investment in transmission</h2>
<ul>
<li>In separated markets, transmission and generation investment decisions are <strong>decentralised</strong> ⇒ planning is harder.</li>
<li>Big transmission investments (e.g. to reach <strong>remote renewables</strong>) create a <strong>&quot;chicken-and-egg&quot;</strong> problem: neither generator nor transmission company will commit until the other does.</li>
<li><strong>Merchant transmission</strong> (private investors capturing congestion rents between locations) exists but is <strong>limited</strong> — technology and regulatory challenges constrain it; some Australian merchant lines later sought <strong>regulation</strong>.</li>
<li>Some jurisdictions use <strong>&quot;public contests&quot;</strong> to commission new transmission (e.g. Argentina).</li>
</ul>
<div class="key">Finding an <b>effective transmission investment framework</b> remains a live challenge — and it interacts directly with how transmission is <b>priced</b> (next).</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="46" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<h2 id="b--nodal-lmp-vs-zonal-pricing-connection-charging">B · Nodal (LMP) vs zonal pricing; connection charging</h2>
<div class="def"><b>Locational marginal pricing (LMP) / nodal pricing:</b> price every generator at <b>its own node</b>. The value of transmission between two nodes = the <b>difference in nodal energy prices</b> (driven by <b>losses</b> + <b>congestion</b>). No congestion ⇒ differences reflect losses only.</div>
<ul>
<li><strong>Zonal pricing:</strong> congestion costs are <strong>aggregated &amp; socialised</strong> across a zone, so a new generator doesn't fully face the network impact of <em>where</em> it locates.</li>
<li><strong>Connection charging:</strong></li>
</ul>
<table>
<thead>
<tr>
<th>Policy</th>
<th>Generator pays for…</th>
<th>Effect</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Shallow</strong> (Britain, Australia)</td>
<td>only the assets connecting it to the shared grid</td>
<td>encourages generation entry; <strong>weak</strong> locational signal</td>
</tr>
<tr>
<td><strong>Deep</strong></td>
<td>connection <strong>+</strong> wider network <strong>reinforcements</strong> it triggers</td>
<td>stronger locational signal</td>
</tr>
</tbody>
</table>
<div class="small">Argued ideal for efficient siting: <b>LMP + deep connection charges</b>.</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="47" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<div class="box">
<h3 id="box-82--international-approaches-to-transmission-network-pricing">Box 8.2 · International approaches to transmission network pricing</h3>
<div class="tag">Example</div>
<p>Two broad approaches in practice:</p>
<ul>
<li><strong>LMP / nodal pricing</strong> — no separate pre-set usage charge; the <strong>spot price at each node</strong> already bundles energy + marginal losses + congestion. Participants hedge with <strong>FTRs</strong> auctioned by the ISO (a share of congestion revenues). Theoretically <strong>most efficient</strong> — gives both short-run operational signals <em>and</em> long-run investment signals.</li>
<li><strong>Use-of-system charges</strong> — <strong>pre-set</strong> charges (on generators and/or load), estimated on <strong>long-run cost</strong> principles, often <strong>differentiated by zone</strong>. Gives clearer <strong>long-term locational signals</strong>, but may <strong>not reflect real-time</strong> congestion value (short-run inefficiency). Britain's <strong>ICRP/TNUoS</strong> and Australia's zonal cost-reflective pricing are examples.</li>
</ul>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="Ch 8 · Electricity regulation" data-footer="Modern Economic Regulation · C. Decker (CUP 2015) · learning deck" data-theme="ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn" lang="en-GB" data-marpit-pagination="48" style="--paginate:true;--header:Ch 8 · Electricity regulation;--footer:Modern Economic Regulation · C. Decker (CUP 2015) · learning deck;--theme:ekybsvheg3d7myaqaevymotuw33q53yo3zmfiy8o7jn;" data-marpit-pagination-total="61">
<header>Ch 8 · Electricity regulation</header>
<div class="box">
<h3 id="box-82--transmission-pricing-cont--the-debate--lesson">Box 8.2 · Transmission pricing (cont.) — the debate &amp; lesson</h3>
<div class="tag">Lesson</div>
<ul>
<li><strong>Pro-LMP:</strong> most efficient; one price signal serves both operation and investment. <strong>Caveat:</strong> LMP alone may <strong>not raise the network's full revenue allowance</strong>, so it often needs <strong>supplementary uniform charges</strong> to cover the shortfall.</li>
<li><strong>Real-world choices:</strong>
<ul>
<li><strong>USA</strong> — gradual <strong>convergence to LMP</strong> (California, Texas most recent adopters).</li>
<li><strong>Britain &amp; Australia</strong> — reviewed LMP but <strong>chose not to adopt</strong> it (Britain kept/modified ICRP; Australia proposed something LMP-with-FTR-like).</li>
<li><strong>EU</strong> — interest in LMP, but big <strong>political</strong> obstacles.</li>
</ul>
</li>
<li><strong>Takeaway:</strong> the &quot;best&quot; pricing method is a <strong>trade-off</strong> between short-run efficiency and long-run investment signals — and is shaped as much by <strong>politics</strong> as by theory.</li>
</ul>
</div>
<footer>Modern Economic Regulation · C. Decker (CUP 2015) · learning deck</footer>
</section>
